<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>3분 실험실</title>
<style>
:root{--bg:#0e1116;--card:#171c24;--fg:#e8eaed;--sub:#9aa4b2;--acc:#5b8def;--warm:#f0a04b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI",sans-serif;
     display:flex;justify-content:center;padding:24px 16px}
.wrap{width:100%;max-width:430px}
.card{background:var(--card);border-radius:18px;padding:22px;margin-bottom:14px}
h1{font-size:17px;margin:0 0 18px;color:var(--sub);font-weight:600}
.no{font-size:13px;color:var(--acc);margin-bottom:10px}
.hyp{font-size:16px;line-height:1.55;margin-bottom:6px}
.ev{font-size:13px;color:var(--sub);margin-bottom:18px}
.step{background:#1f2632;border-radius:12px;padding:14px;font-size:15px;line-height:1.5;margin-bottom:8px}
.howto{font-size:13px;color:var(--sub);line-height:1.5;margin-bottom:16px}
button{width:100%;padding:14px;border:0;border-radius:12px;font-size:15px;font-weight:600;
       background:var(--acc);color:#fff;margin-bottom:8px;cursor:pointer}
button.ghost{background:transparent;color:var(--sub);border:1px solid #2c3542}
button.warm{background:var(--warm);color:#1a1a1a}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #2c3542;background:#1f2632;
      color:var(--fg);font-size:15px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{margin:0}
.rule{border-left:3px solid var(--acc);padding:10px 12px;margin-bottom:10px;font-size:14px;line-height:1.5}
.rule small{color:var(--sub)}
.locked{color:#5a6472;font-size:13px}
.dis{font-size:11px;color:#5a6472;line-height:1.5;margin-top:18px}
</style>
</head>
<body><div class="wrap" id="app"></div>
<script>
const API=""; let uid=localStorage.getItem("uid"), exp=null;
const $=h=>document.getElementById("app").innerHTML=h;
const post=(u,b)=>fetch(API+u,{method:"POST",headers:{"Content-Type":"application/json"},
  body:JSON.stringify(b||{})}).then(r=>r.json());
const get=u=>fetch(API+u).then(r=>r.json());

async function boot(){
  if(!uid){const r=await post("/api/users",{nickname:"연구자",consent_emotion_log:true});
    uid=r.user_id;localStorage.setItem("uid",uid);}
  screenStart();
}
function screenStart(){
  $(`<h1>🧪 3분 실험실</h1><div class="card">
   <div class="hyp">오늘 뭘 하려다 못 하고 있어요?</div>
   <div class="ev">한 줄만 적어주세요. 잘 쓸 필요 없어요.</div>
   <input id="t" placeholder="예: 보고서 쓰기"/>
   <div class="ev">지금 컨디션</div>
   <div class="grid" style="margin-bottom:12px">
     ${[1,2,3,4].map(i=>`<button class="ghost" onclick="setE(${i})" id="e${i}">${["바닥","별로","보통","좋음"][i-1]}</button>`).join("")}
   </div>
   <button onclick="startExp()">실험 받기</button></div>
   <div class="dis" id="dis"></div>`);
  window.energy=3;
}
window.setE=i=>{window.energy=i;[1,2,3,4].forEach(n=>
  document.getElementById("e"+n).className=n===i?"":"ghost");};

async function startExp(){
  const task=document.getElementById("t").value.trim(); if(!task)return;
  const r=await post("/api/today",{user_id:uid,task_text:task,energy:window.energy,place:"unknown"});
  if(r.mode==="SOS")return screenSOS(r);
  exp=r; screenExp(r,r.suggested_level);
}
function screenExp(r,lv){
  const s=r.ladder[lv];
  $(`<h1>🧪 3분 실험실</h1><div class="card">
   <div class="no">실험 #${r.experiment_no} · ${r.variation.name}</div>
   <div class="hyp">가설: ${r.hypothesis_line}</div>
   <div class="ev">${r.evidence_line}</div>
   <div class="step">${s.text} <b>(${s.minutes}분)</b></div>
   <div class="howto">${r.variation.howto}</div>
   <button onclick="lock(${lv})">실험 시작</button>
   ${lv>0?`<button class="ghost" onclick="screenExp(exp,${lv-1})">너무 부담돼요 → 더 작게</button>`:
          `<div class="ev">여기가 가장 작은 크기예요.</div>`}
   ${lv<4?`<button class="ghost" onclick="screenExp(exp,${lv+1})">더 할 수 있어요 ↑</button>`:""}
   </div>`);
}
async function lock(lv){
  const r=await post(`/api/experiments/${exp.experiment_id}/ladder`,{level:lv});
  $(`<h1>🧪 진행 중</h1><div class="card">
    <div class="step">${r.step.text}</div><div class="ev">${r.message}</div>
    <button onclick="screenObs()">끝났어요 / 기록할게요</button></div>`);
}
function screenObs(){
  $(`<h1>🔬 관찰 기록</h1><div class="card">
   <div class="hyp">무슨 일이 일어났나요?</div>
   <div class="ev">어떤 답이든 유효한 데이터예요.</div>
   ${[["NOT_STARTED","시작도 못 함"],["STARTED_STOPPED","시작했다 멈춤"],
      ["DID_MINIMUM","계획한 만큼 함"],["WENT_LONGER","계획보다 더 함"]]
     .map(([k,l])=>`<button class="ghost" onclick="send('${k}')">${l}</button>`).join("")}
   <div class="ev" style="margin-top:14px">그때 기분 (안 써도 됨)</div>
   <input id="n" placeholder="한 줄"/></div>`);
}
async function send(o){
  const note=document.getElementById("n").value;
  const r=await post(`/api/experiments/${exp.experiment_id}/observe`,
    {outcome:o,note:note||null});
  if(r.mode==="SUPPORT")return screenSupport(r);
  let h=`<h1>🔬 기록됐어요</h1><div class="card"><div class="hyp">${r.message}</div>
    <div class="ev">누적 관찰 ${r.observed_total}회</div></div>`;
  (r.new_hypotheses||[]).forEach(n=>{h+=`<div class="card">
    <div class="hyp">${n.question}</div><div class="ev">${n.evidence}</div>
    <div class="grid">${n.actions.map(a=>
      `<button class="${a.key==='yes'?'':'ghost'}" onclick="verdict('${n.rule_id}','${a.key}')">${a.label}</button>`).join("")}</div></div>`;});
  h+=`<button class="ghost" onclick="showManual()">📕 내 사용설명서 보기</button>`;
  $(h);
}
async function verdict(id,v){
  const r=await post(`/api/rules/${id}/verdict`,{verdict:v});
  if(r.share_card){const c=r.share_card;
    $(`<h1>📕 등재됐어요</h1><div class="card">
      <div class="no">${c.headline}</div><div class="hyp">"${c.statement}"</div>
      <div class="ev">${c.proof} ${c.byline}</div>
      <div class="howto">${c.caption}</div>
      <button onclick="showManual()">사용설명서 보기</button></div>`);}
  else showManual();
}
async function showManual(){
  const m=await get(`/api/manual/${uid}`);
  let h=`<h1>${m.title}</h1><div class="card">
    <div class="no">발견 ${m.progress.found}/${m.progress.total}</div>`;
  h+=m.confirmed.length?m.confirmed.map(c=>`<div class="rule"><b>${c.no}</b> ${c.statement}
      <br><small>${c.evidence}</small></div>`).join(""):`<div class="ev">아직 비어 있어요. 관찰이 쌓이면 채워집니다.</div>`;
  if(m.testing.length){h+=`<div class="no" style="margin-top:16px">🔍 검증 중</div>`+
    m.testing.map(t=>`<div class="rule" style="border-color:#f0a04b">${t.statement}<br><small>${t.evidence}</small></div>`).join("");}
  h+=`<div class="locked" style="margin-top:14px">🔒 아직 발견되지 않음 ${m.progress.locked}개</div>
    <div class="dis">${m.disclaimer}</div></div>
    <button onclick="screenStart()">새 실험 하기</button>`;
  $(h);
}
function screenSOS(r){
  $(`<h1>${r.title}</h1><div class="card">
    <div class="hyp">${r.body}</div>
    <div class="ev" style="margin:14px 0 8px">오늘 유일한 미션</div>
    ${r.missions.map(m=>`<div class="step">□ ${m}</div>`).join("")}
    <div class="howto" style="margin-top:14px">${r.footer}</div>
    <button class="warm" onclick="showManual()">알겠어요</button>
    <button class="ghost" onclick="resume()">그래도 아주 작은 거 하나 할래요</button></div>`);
}
async function resume(){await post(`/api/sos/${uid}/resume`);screenStart();}
function screenSupport(r){
  $(`<h1>${r.title}</h1><div class="card">
    <div class="hyp">${r.body}</div>
    <div class="ev" style="margin-top:14px">${r.suggestions.map(s=>"· "+s).join("<br>")}</div>
    ${(r.resources||[]).map(x=>`<div class="step">${x.name} <b>${x.contact}</b> <small>${x.note}</small></div>`).join("")}
    </div>`);
}
boot();
</script></body></html>
