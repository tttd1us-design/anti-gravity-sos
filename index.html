<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>안티그레비티 (Anti-Gravity OS) - 게으름과 완벽주의를 부수는 1등 성공 OS</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=JetBrains+Mono:wght@400;600;700&family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#F0FDF4',
              500: '#10B981',
              600: '#059669',
            },
            space: {
              950: '#030508',
              900: '#070B12',
              850: '#0D1422',
              800: '#141E33',
              700: '#1D2A47',
              600: '#2A3C63',
            },
            cyan: {
              400: '#22D3EE',
              500: '#06B6D4',
              glow: '#00F0FF',
            },
            gold: {
              400: '#FACC15',
              500: '#EAB308',
              glow: '#FFD700',
            }
          },
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
            serif: ['Cinzel', 'serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #030508;
      color: #F8FAFC;
      font-family: 'Pretendard', sans-serif;
      overflow-x: hidden;
      transition: font-size 0.2s ease;
    }
    
    .bg-grid-pattern {
      background-image: 
        linear-gradient(to right, rgba(34, 211, 238, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(34, 211, 238, 0.03) 1px, transparent 1px);
      background-size: 32px 32px;
    }
    
    .glass-card {
      background: rgba(13, 20, 34, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(34, 211, 238, 0.18);
    }

    .glass-card-glow {
      background: rgba(13, 20, 34, 0.95);
      backdrop-filter: blur(24px);
      border: 1.5px solid rgba(0, 240, 255, 0.45);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.12);
    }

    .gold-glow {
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.2), inset 0 0 15px rgba(255, 215, 0, 0.1);
    }

    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #070B12;
    }
    ::-webkit-scrollbar-thumb {
      background: #1D2A47;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00F0FF;
    }
  </style>
</head>
<body class="bg-grid-pattern min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Web Audio SFX ---
    const playSound = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (type === 'click') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(800, ctx.currentTime);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'complete') {
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.06);
            gain.gain.setValueAtTime(0.06, ctx.currentTime + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.06 + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.06);
            osc.stop(ctx.currentTime + i * 0.06 + 0.25);
          });
        }
      } catch (e) {}
    };

    // --- Quick Goal Templates ---
    const GOAL_TEMPLATES = [
      { id: 'diet', icon: 'dumbbell', title: '다이어트 & 운동 습관', desc: '5kg 감량 및 매일 15분 운동' },
      { id: 'side', icon: 'wallet', title: '월 100만 원 부업/수익', desc: '직장 외 파이프라인 개설' },
      { id: 'exam', icon: 'graduation-cap', title: '자격증 / 시험 합격', desc: '올해 목표 자격증 100% 합격' },
      { id: 'book', icon: 'book-open', title: '도서 출판 / 글쓰기', desc: '책 1권 완고 및 블로그 연재' },
      { id: 'biz', icon: 'trending-up', title: '사업 성장 & 100억 로드맵', desc: '비즈니스 자동화 시스템 구축' }
    ];

    const FRICTION_REASONS = [
      { id: 'perf', label: '완벽하게 하려다 시작을 못 해요', score: 8.5 },
      { id: 'overwhelm', label: '해야 할 양이 너무 많아 막막해요', score: 8.0 },
      { id: 'fear', label: '실패하면 남들에게 창피할까 봐요', score: 7.5 },
      { id: 'tired', label: '퇴근 후 기운이 없어 유튜브만 봐요', score: 9.0 }
    ];

    function App() {
      // Font Scale (1.0 ~ 2.2)
      const [fontScale, setFontScale] = useState(() => {
        return parseFloat(localStorage.getItem('AG_FONT_SCALE') || '1.6');
      });

      // App Main Tabs: 'COACH', 'TIMER', 'REPORT', 'PRICING'
      const [mainTab, setMainTab] = useState('COACH');

      // Mode: 'EASY' vs 'PRO'
      const [mode, setMode] = useState('EASY');

      // User Success Data State
      const [userData, setUserData] = useState(() => {
        const saved = localStorage.getItem('AG_COMMERCIAL_USER_V1');
        return saved ? JSON.parse(saved) : {
          streakDays: 3,
          completedMissions: 7,
          badges: ['🔥 3일 연속 달성', '🛡️ 완벽주의 격파자', '⚡ 3분 마스터'],
          currentGoal: '월 100만 원 자동화 부업 파이프라인 구축',
          currentFriction: '완벽하게 준비하려다 시작을 계속 미루는 완벽주의',
          microAction: '스마트폰 메모장을 열고 팔고 싶은 아이디어 단어 딱 3개 적기',
          burdenScore: 25, // 0~100 (낮을수록 좋음)
          cfScore: 2.1,
          eAct: 0.28
        };
      });

      // 3-Minute Timer State
      const [timerSeconds, setTimerSeconds] = useState(180);
      const [timerActive, setTimerActive] = useState(false);
      const [showShareModal, setShowShareModal] = useState(false);

      // Chat Messages
      const [messages, setMessages] = useState([
        {
          id: 1,
          sender: 'ai',
          text: `반갑습니다! 😊 당신의 게으름과 완벽주의를 부수는 **1등 성공 파트너, 안티그레비티 OS**에 오신 것을 환영해요.\n\n거창한 계획을 세워도 작심삼일이 되는 건 당신의 의지력 탓이 아니에요! 뇌가 시작할 때 마음에 큰 부담을 느끼기 때문이에요.\n\n현재 가장 이루고 싶은 목표는 무엇인가요?`,
          timestamp: '지금'
        }
      ]);
      const [inputText, setInputText] = useState("");
      const [isTyping, setIsTyping] = useState(false);
      const chatScrollRef = useRef(null);

      // Save User Data
      useEffect(() => {
        localStorage.setItem('AG_COMMERCIAL_USER_V1', JSON.stringify(userData));
        chatScrollRef.current?.scrollIntoView({ behavior: 'smooth' });
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [messages, userData, mainTab, fontScale, mode]);

      // Timer Tick
      useEffect(() => {
        let interval = null;
        if (timerActive && timerSeconds > 0) {
          interval = setInterval(() => setTimerSeconds(t => t - 1), 1000);
        } else if (timerSeconds === 0 && timerActive) {
          setTimerActive(false);
          playSound('complete');
          if (window.confetti) {
            window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
          }
          setUserData(prev => ({
            ...prev,
            completedMissions: prev.completedMissions + 1,
            streakDays: prev.streakDays + 1,
            burdenScore: Math.max(5, prev.burdenScore - 20)
          }));
          setShowShareModal(true);
        }
        return () => clearInterval(interval);
      }, [timerActive, timerSeconds]);

      const handleFontScale = (scale) => {
        const clamped = Math.min(2.2, Math.max(1.0, parseFloat(scale.toFixed(1))));
        setFontScale(clamped);
        localStorage.setItem('AG_FONT_SCALE', clamped.toString());
        playSound('click');
      };

      const handleSendMessage = (customText) => {
        const text = (customText || inputText).trim();
        if (!text || isTyping) return;

        const userMsg = {
          id: Date.now(),
          sender: 'user',
          text,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setMessages(prev => [...prev, userMsg]);
        setInputText("");
        playSound('click');
        setIsTyping(true);

        setTimeout(() => {
          let replyText = "";
          if (messages.length === 1) {
            replyText = `멋진 목표예요! 👏\n\n그런데 이 목표를 시작하려고 할 때, 마음에 브레이크가 걸리거나 자꾸 유튜브를 보며 미루게 만드는 **'진짜 이유'**는 무엇인가요?\n\n솔직하게 아래 버튼을 선택해 보세요.`;
            setUserData(prev => ({ ...prev, currentGoal: text }));
          } else if (messages.length === 3) {
            replyText = `정말 많은 분들이 똑같은 고민을 해요. 완벽하게 잘하고 싶은 마음이 크다 보니 뇌가 너무 큰 에너지가 든다고 착각하는 거예요.\n\n그래서 지금 이 순간, **'마음 편한 3분 초간단 시작 모드'**를 발동할게요!\n\n오늘 딱 3분 동안 **"${userData.microAction}"**만 해보는 거예요.\n\n우측 상단의 **[⏱️ 3분 타이머]** 탭을 누르고 함께 3분을 시작해 볼까요?`;
            setUserData(prev => ({ ...prev, currentFriction: text, burdenScore: 20 }));
            playSound('complete');
            if (window.confetti) {
              window.confetti({ particleCount: 70, spread: 60, origin: { y: 0.65 } });
            }
          } else {
            replyText = `훌륭합니다! 3분의 작은 성공이 뇌의 도파민 회로를 깨우고 연속 성공을 만듭니다. 지금의 기분과 성취감을 시스템에 기록했습니다! 🚀`;
          }

          const aiMsg = {
            id: Date.now() + 1,
            sender: 'ai',
            text: replyText,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };

          setMessages(prev => [...prev, aiMsg]);
          setIsTyping(false);
        }, 450);
      };

      const basePx = 15 * fontScale;

      return (
        <div className="flex flex-col h-screen max-h-screen">
          
          {/* Top Brand Header */}
          <header className="h-20 border-b border-cyan-500/20 glass-card px-4 md:px-8 flex items-center justify-between z-20">
            
            {/* Brand Logo */}
            <div className="flex items-center space-x-3.5">
              <div className="w-11 h-11 md:w-12 md:h-12 rounded-2xl bg-gradient-to-br from-cyan-400 via-indigo-600 to-purple-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                <i data-lucide="orbit" className="w-6 h-6 text-white animate-spin" style={{ animationDuration: '18s' }}></i>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-xl md:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-white to-gold-300 tracking-tight">
                    ANTI-GRAVITY
                  </h1>
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">
                    PRO v2.0
                  </span>
                </div>
                <p className="text-xs text-slate-400 font-medium">게으름과 완벽주의를 부수는 1등 성공 OS</p>
              </div>
            </div>

            {/* Navigation Tabs */}
            <nav className="hidden md:flex items-center space-x-1.5 bg-space-900 border border-slate-800 rounded-2xl p-1.5">
              {[
                { id: 'COACH', label: '💬 AI 성공 코치', icon: 'message-square' },
                { id: 'TIMER', label: '⏱️ 3분 집중 미션', icon: 'zap' },
                { id: 'REPORT', label: '📊 성공 자산 리포트', icon: 'file-text' },
                { id: 'PRICING', label: '💎 VIP 멤버십', icon: 'crown' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => { setMainTab(tab.id); playSound('click'); }}
                  className={`px-3.5 py-2 rounded-xl text-xs md:text-sm font-bold flex items-center gap-1.5 transition ${
                    mainTab === tab.id
                      ? 'bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-md shadow-cyan-500/30'
                      : 'text-slate-400 hover:text-white hover:bg-space-800'
                  }`}>
                  <i data-lucide={tab.icon} className="w-4 h-4"></i>
                  <span>{tab.label}</span>
                </button>
              ))}
            </nav>

            {/* Quick Controls: Font Size & Mode */}
            <div className="flex items-center space-x-2.5">
              
              {/* Font Size A- / A+ Controller */}
              <div className="bg-space-900 border border-slate-700/80 rounded-2xl px-2 py-1 flex items-center gap-1">
                <button
                  onClick={() => handleFontScale(fontScale - 0.2)}
                  title="글씨 축소"
                  className="w-7 h-7 md:w-8 md:h-8 rounded-lg bg-space-800 hover:bg-space-700 text-slate-300 font-bold text-sm flex items-center justify-center transition">
                  A-
                </button>
                <span className="text-xs md:text-sm font-bold font-mono text-cyan-300 px-1.5 min-w-[48px] text-center">
                  {Math.round(fontScale * 100)}%
                </span>
                <button
                  onClick={() => handleFontScale(fontScale + 0.2)}
                  title="글씨 확대"
                  className="w-7 h-7 md:w-8 md:h-8 rounded-lg bg-space-800 hover:bg-space-700 text-slate-300 font-bold text-sm flex items-center justify-center transition">
                  A+
                </button>
              </div>

              {/* Mode Switch (Easy / Pro) */}
              <button
                onClick={() => { setMode(mode === 'EASY' ? 'PRO' : 'EASY'); playSound('click'); }}
                className={`px-3 py-2 rounded-2xl text-xs font-bold font-mono flex items-center gap-1.5 border transition ${
                  mode === 'EASY'
                    ? 'bg-emerald-950/60 border-emerald-500/40 text-emerald-300'
                    : 'bg-purple-950/60 border-purple-500/40 text-purple-300'
                }`}>
                <span>{mode === 'EASY' ? '🌱 이지 모드' : '⚡ 프로 모드'}</span>
              </button>

            </div>
          </header>

          {/* Main Body */}
          <div className="flex-1 flex overflow-hidden">
            
            {/* TAB 1: AI SUCCESS COACH */}
            {mainTab === 'COACH' && (
              <div className="flex-1 flex overflow-hidden">
                
                {/* Chat Column */}
                <section className="flex-1 flex flex-col bg-space-950/80 border-r border-cyan-500/10 relative">
                  
                  {/* Streak & Status Banner */}
                  <div className="bg-space-900/90 border-b border-cyan-500/10 px-5 py-2.5 flex items-center justify-between text-xs md:text-sm font-medium">
                    <div className="flex items-center gap-2">
                      <span className="text-gold-400 font-bold flex items-center gap-1">
                        <i data-lucide="flame" className="w-4 h-4 text-gold-400"></i>
                        {userData.streakDays}일 연속 귀차니즘 극복 중!
                      </span>
                    </div>
                    <div className="flex items-center gap-2 text-slate-400">
                      <span>완료 미션: <strong className="text-cyan-300">{userData.completedMissions}회</strong></span>
                    </div>
                  </div>

                  {/* Messages */}
                  <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
                    {messages.map(m => (
                      <div key={m.id} className={`flex flex-col ${m.sender === 'user' ? 'items-end' : 'items-start'}`}>
                        <div className="flex items-center gap-2 mb-1 px-1">
                          <span className="text-xs font-bold uppercase tracking-wider text-cyan-400">
                            {m.sender === 'ai' ? '🌱 안티그레비티 AI 코치' : '👤 나 (사용자)'}
                          </span>
                          <span className="text-xs text-slate-500 font-mono">{m.timestamp}</span>
                        </div>

                        <div className={`max-w-[92%] md:max-w-[85%] rounded-3xl p-5 leading-relaxed shadow-lg ${
                          m.sender === 'user'
                            ? 'bg-gradient-to-r from-cyan-950/90 to-indigo-950/95 border-2 border-cyan-500/40 text-white rounded-tr-none'
                            : 'glass-card-glow text-slate-100 border-l-[6px] border-l-cyan-400 rounded-tl-none'
                        }`} style={{ fontSize: `${basePx}px` }}>
                          <p className="whitespace-pre-line font-sans font-medium leading-relaxed">{m.text}</p>
                        </div>
                      </div>
                    ))}

                    {isTyping && (
                      <div className="flex items-center space-x-3 text-cyan-400 text-sm font-medium p-4 glass-card rounded-2xl w-fit">
                        <i data-lucide="loader-2" className="w-5 h-5 animate-spin"></i>
                        <span>당신의 마음에 꼭 맞는 맞춤형 해결책을 생각하고 있어요...</span>
                      </div>
                    )}
                    <div ref={chatScrollRef} />
                  </div>

                  {/* Quick Goal Selector (1턴째) */}
                  {messages.length === 1 && (
                    <div className="px-4 md:px-6 py-3.5 bg-space-900/95 border-t border-cyan-500/10">
                      <span className="text-xs font-bold text-slate-400 block mb-2">🎯 목표를 선택해 보세요:</span>
                      <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
                        {GOAL_TEMPLATES.map(t => (
                          <button
                            key={t.id}
                            onClick={() => handleSendMessage(t.title)}
                            className="p-3 rounded-2xl bg-space-800 hover:bg-cyan-500/20 text-left border border-slate-700 hover:border-cyan-400 transition shadow-sm">
                            <span className="text-xs md:text-sm font-bold text-slate-200 block mb-0.5">{t.title}</span>
                            <span className="text-[11px] text-slate-400 truncate block">{t.desc}</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Quick Friction Selector (2턴째) */}
                  {messages.length === 2 && (
                    <div className="px-4 md:px-6 py-3.5 bg-space-900/95 border-t border-cyan-500/10">
                      <span className="text-xs font-bold text-slate-400 block mb-2">🛑 왜 시작이 망설여지나요?</span>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                        {FRICTION_REASONS.map(f => (
                          <button
                            key={f.id}
                            onClick={() => handleSendMessage(f.label)}
                            className="p-3 rounded-2xl bg-space-800 hover:bg-rose-500/20 text-left border border-slate-700 hover:border-rose-400 transition shadow-sm">
                            <span className="text-xs md:text-sm font-semibold text-rose-200 block">{f.label}</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Input Box */}
                  <div className="p-4 md:p-5 bg-space-900/95 border-t border-cyan-500/20">
                    <form onSubmit={(e) => { e.preventDefault(); handleSendMessage(); }} className="relative flex items-center">
                      <textarea
                        rows="2"
                        value={inputText}
                        onChange={(e) => setInputText(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            handleSendMessage();
                          }
                        }}
                        placeholder="자유롭게 고민이나 목표를 적어주세요..."
                        className="w-full bg-space-950 border-2 border-slate-700 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400 rounded-2xl px-5 py-3.5 text-white placeholder-slate-500 focus:outline-none resize-none pr-28 font-sans leading-relaxed"
                        style={{ fontSize: `${basePx}px` }}
                      />
                      <button
                        type="submit"
                        disabled={!inputText.trim() || isTyping}
                        className={`absolute right-3 bottom-3.5 px-5 py-2.5 rounded-xl font-bold text-sm flex items-center gap-1.5 transition ${
                          inputText.trim() && !isTyping
                            ? 'bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-lg shadow-cyan-500/40 hover:scale-105'
                            : 'bg-space-800 text-slate-600 cursor-not-allowed'
                        }`}>
                        <span>보내기</span>
                        <i data-lucide="send" className="w-4 h-4"></i>
                      </button>
                    </form>
                  </div>
                </section>

                {/* Right Side Quick Widget */}
                <aside className="hidden lg:flex w-4/12 flex-col bg-space-950/90 p-6 space-y-6 overflow-y-auto">
                  
                  {/* Today Mission Card */}
                  <div className="glass-card-glow rounded-3xl p-6 border-2 border-cyan-400/40 text-center">
                    <div className="flex items-center justify-center gap-1.5 text-cyan-400 font-bold text-xs uppercase mb-2">
                      <i data-lucide="zap" className="w-4 h-4"></i>
                      <span>오늘의 부담 없는 3분 미션</span>
                    </div>
                    <p className="text-base font-bold text-white mb-4 leading-snug">
                      "{userData.microAction}"
                    </p>
                    <button
                      onClick={() => { setMainTab('TIMER'); playSound('click'); }}
                      className="w-full py-3 rounded-2xl font-black text-sm bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-lg hover:scale-105 transition flex items-center justify-center gap-2">
                      <i data-lucide="play" className="w-4 h-4"></i>
                      <span>지금 바로 3분 시작하기</span>
                    </button>
                  </div>

                  {/* Burden Gauge */}
                  <div className="glass-card rounded-3xl p-5 border border-slate-800 space-y-3">
                    <div className="flex justify-between items-center text-xs font-bold">
                      <span className="text-slate-400">내 마음의 시작 부담감</span>
                      <span className="text-cyan-300">{userData.burdenScore}점 (가벼움)</span>
                    </div>
                    <div className="w-full bg-space-900 h-2.5 rounded-full overflow-hidden border border-slate-800">
                      <div className="bg-gradient-to-r from-cyan-500 to-emerald-400 h-full transition-all duration-500" style={{ width: `${userData.burdenScore}%` }}></div>
                    </div>
                    <p className="text-[11px] text-slate-400 leading-relaxed">
                      💡 <strong>마찰 제로 팁:</strong> 시작이 무거울 땐 '단어 3개만 적기'처럼 아주 작게 쪼개는 것이 비결입니다.
                    </p>
                  </div>

                  {/* Badges */}
                  <div className="glass-card rounded-3xl p-5 border border-slate-800">
                    <span className="text-xs font-bold text-slate-400 block mb-2.5">🏆 획득한 성공 배지</span>
                    <div className="flex flex-wrap gap-2">
                      {userData.badges.map((b, i) => (
                        <span key={i} className="px-3 py-1 rounded-full text-xs font-bold bg-space-900 text-gold-300 border border-gold-500/30">
                          {b}
                        </span>
                      ))}
                    </div>
                  </div>

                </aside>

              </div>
            )}

            {/* TAB 2: 3-MINUTE FOCUS TIMER */}
            {mainTab === 'TIMER' && (
              <section className="flex-1 flex flex-col items-center justify-center p-6 text-center bg-space-950/90">
                <div className="max-w-md w-full glass-card-glow rounded-3xl p-8 border-2 border-cyan-400/50 shadow-2xl">
                  <div className="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-cyan-500/20 text-cyan-300 font-bold text-xs mb-4">
                    <i data-lucide="zap" className="w-4 h-4"></i>
                    <span>무마찰 3분 몰입 타이머</span>
                  </div>

                  <h2 className="text-xl font-black text-white mb-2">
                    "{userData.microAction}"
                  </h2>
                  <p className="text-xs text-slate-400 mb-6">
                    잘하려고 애쓰지 말고, 3분 동안 딱 이것만 가볍게 해보세요!
                  </p>

                  {/* Countdown Clock */}
                  <div className="bg-space-900 py-6 rounded-3xl border-2 border-cyan-500/30 mb-6 shadow-inner">
                    <span className="text-5xl md:text-6xl font-black font-mono text-cyan-300 tracking-wider">
                      {Math.floor(timerSeconds / 60)}:{(timerSeconds % 60).toString().padStart(2, '0')}
                    </span>
                  </div>

                  {/* Timer Controls */}
                  {!timerActive ? (
                    <button
                      onClick={() => { setTimerActive(true); playSound('click'); }}
                      className="w-full py-4 rounded-2xl font-black text-base bg-gradient-to-r from-cyan-500 via-indigo-600 to-purple-600 text-white shadow-xl shadow-cyan-500/40 hover:scale-105 transition flex items-center justify-center gap-2">
                      <i data-lucide="play" className="w-5 h-5"></i>
                      <span>⏱️ 3분 타이머 시작하기</span>
                    </button>
                  ) : (
                    <div className="flex gap-3">
                      <button
                        onClick={() => { setTimerActive(false); playSound('click'); }}
                        className="flex-1 py-4 rounded-2xl font-black text-sm bg-space-800 hover:bg-space-700 text-slate-200 border border-slate-700 transition">
                        일시 정지
                      </button>
                      <button
                        onClick={() => {
                          setTimerSeconds(0);
                        }}
                        className="flex-1 py-4 rounded-2xl font-black text-sm bg-emerald-600 hover:bg-emerald-500 text-white transition">
                        ✓ 지금 완료하기
                      </button>
                    </div>
                  )}
                </div>
              </section>
            )}

            {/* TAB 3: SUCCESS ASSET REPORT & DOWNLOADS */}
            {mainTab === 'REPORT' && (
              <section className="flex-1 overflow-y-auto p-6 md:p-10 max-w-5xl mx-auto space-y-6">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-xl md:text-2xl font-black text-white">📊 나의 성공 자산 리포트</h2>
                    <p className="text-xs md:text-sm text-slate-400">대화와 실행을 통해 누적된 나만의 성공 데이터베이스입니다.</p>
                  </div>
                  <button
                    onClick={() => {
                      const doc = `# 🚀 ANTI-GRAVITY 개인 맞춤형 성공 자산 리포트\n\n- 목표: ${userData.currentGoal}\n- 내면의 저항: ${userData.currentFriction}\n- 오늘의 3분 실행 과제: ${userData.microAction}\n- 연속 성공 기록: ${userData.streakDays}일 연속\n- 누적 완료 미션: ${userData.completedMissions}회`;
                      const blob = new Blob([doc], { type: 'text/markdown;charset=utf-8;' });
                      const url = URL.createObjectURL(blob);
                      const a = document.createElement('a');
                      a.href = url;
                      a.download = `Anti_Gravity_Success_Report.md`;
                      a.click();
                      playSound('complete');
                    }}
                    className="px-4 py-2.5 rounded-xl font-bold text-xs md:text-sm bg-cyan-500/20 text-cyan-300 border border-cyan-400 hover:bg-cyan-500/30 flex items-center gap-2">
                    <i data-lucide="download" className="w-4 h-4"></i>
                    <span>Notion / Obsidian MD 다운로드</span>
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div className="glass-card rounded-3xl p-6 border border-slate-800">
                    <span className="text-xs font-bold text-cyan-400 block mb-1">🎯 나의 중심 목표</span>
                    <p className="text-base font-bold text-white leading-relaxed">{userData.currentGoal}</p>
                  </div>
                  <div className="glass-card rounded-3xl p-6 border border-slate-800">
                    <span className="text-xs font-bold text-rose-400 block mb-1">🛑 직면한 내면의 저항</span>
                    <p className="text-base font-medium text-rose-200 leading-relaxed">{userData.currentFriction}</p>
                  </div>
                </div>

                <div className="glass-card-glow rounded-3xl p-6 border-2 border-emerald-500/30">
                  <span className="text-xs font-bold text-emerald-400 block mb-1">⚡ 오늘 당장 3분 실행 미션</span>
                  <p className="text-lg font-bold text-emerald-200 leading-relaxed">"{userData.microAction}"</p>
                </div>
              </section>
            )}

            {/* TAB 4: VIP MEMBERSHIP PRICING */}
            {mainTab === 'PRICING' && (
              <section className="flex-1 overflow-y-auto p-6 md:p-10 max-w-5xl mx-auto space-y-8 text-center">
                <div>
                  <h2 className="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-white to-gold-300">
                    💎 안티그레비티 VIP 멤버십 플랜
                  </h2>
                  <p className="text-sm text-slate-400 mt-2">
                    무의식의 마찰력을 완전히 없애고 당신의 목표를 현실로 끌어내리는 프리미엄 플랜
                  </p>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 gap-6 text-left">
                  
                  {/* Tier 1 */}
                  <div className="glass-card rounded-3xl p-6 border border-slate-800 space-y-4">
                    <span className="text-xs font-bold text-slate-400 font-mono">TIER 1</span>
                    <h3 className="text-xl font-bold text-white">Explorer</h3>
                    <div className="text-2xl font-black text-cyan-400">₩99,000 <span className="text-xs text-slate-400 font-normal">/ 월</span></div>
                    <ul className="text-xs text-slate-300 space-y-2 pt-2 border-t border-slate-800">
                      <li>✓ 무제한 AI 성공 코치 문답</li>
                      <li>✓ 일일 3분 집중 타이머 & 도파민 배지</li>
                      <li>✓ Obsidian/Notion 자동 백업</li>
                    </ul>
                    <button className="w-full py-3 rounded-xl font-bold text-xs bg-space-800 hover:bg-space-700 text-slate-200 border border-slate-700">
                      신청하기
                    </button>
                  </div>

                  {/* Tier 2 (Popular) */}
                  <div className="glass-card-glow rounded-3xl p-6 border-2 border-cyan-400 space-y-4 relative">
                    <span className="absolute -top-3 right-6 px-3 py-0.5 rounded-full text-[10px] font-black bg-cyan-400 text-black">
                      가장 인기 있는 플랜
                    </span>
                    <span className="text-xs font-bold text-cyan-400 font-mono">TIER 2 (주력)</span>
                    <h3 className="text-xl font-bold text-white">Architect</h3>
                    <div className="text-2xl font-black text-cyan-300">₩290,000 <span className="text-xs text-slate-400 font-normal">/ 월</span></div>
                    <ul className="text-xs text-slate-200 space-y-2 pt-2 border-t border-cyan-500/30">
                      <li>✓ Tier 1 전체 기능 포함</li>
                      <li>✓ 5-Layer Why 심층 무의식 마이닝</li>
                      <li>✓ 100권 도서 출판 원고 자동 컴파일러</li>
                      <li>✓ 1인 지식 엔터프라이즈 프레임워크</li>
                    </ul>
                    <button className="w-full py-3 rounded-xl font-black text-xs bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-lg">
                      7일 무료 체험 시작
                    </button>
                  </div>

                  {/* Tier 3 */}
                  <div className="glass-card rounded-3xl p-6 border border-gold-500/40 space-y-4">
                    <span className="text-xs font-bold text-gold-400 font-mono">TIER 3 (VIP)</span>
                    <h3 className="text-xl font-bold text-white">Sovereign</h3>
                    <div className="text-2xl font-black text-gold-300">₩1,500,000 <span className="text-xs text-slate-400 font-normal">/ 월</span></div>
                    <ul className="text-xs text-slate-300 space-y-2 pt-2 border-t border-slate-800">
                      <li>✓ Tier 2 전체 기능 포함</li>
                      <li>✓ C-Level 1:1 오프라인 인지 재설계 세션</li>
                      <li>✓ 10조 비즈니스 M&A & 자본 배치 연계</li>
                    </ul>
                    <button className="w-full py-3 rounded-xl font-bold text-xs bg-space-800 hover:bg-space-700 text-gold-300 border border-gold-500/40">
                      VIP 상담 문의
                    </button>
                  </div>

                </div>
              </section>
            )}

          </div>

          {/* Social Share & Reward Modal */}
          {showShareModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-card-glow rounded-3xl max-w-sm w-full p-6 text-center border-2 border-cyan-400 shadow-2xl">
                <div className="w-16 h-16 rounded-full bg-emerald-500/20 text-emerald-400 mx-auto flex items-center justify-center mb-3">
                  <i data-lucide="check-circle" className="w-8 h-8"></i>
                </div>
                <h3 className="text-lg font-black text-white mb-1">🎉 3분 미션 성공 완료!</h3>
                <p className="text-xs text-slate-300 mb-4">
                  오늘의 귀차니즘을 완벽히 이겨내셨습니다!<br/>
                  <strong>{userData.streakDays}일 연속 달성 스탬프</strong>가 적립되었어요.
                </p>

                <div className="p-3 bg-space-900 rounded-2xl border border-slate-800 text-xs text-cyan-300 font-bold mb-4">
                  "{userData.microAction}" 완료!
                </div>

                <div className="space-y-2">
                  <button
                    onClick={() => {
                      alert("인스타그램/카카오톡 공유 링크가 클립보드에 복사되었습니다!");
                      setShowShareModal(false);
                    }}
                    className="w-full py-3 rounded-xl font-bold text-xs bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-lg">
                    📱 성공 인증 카드 공유하기
                  </button>
                  <button
                    onClick={() => setShowShareModal(false)}
                    className="w-full py-2.5 rounded-xl font-medium text-xs text-slate-400 hover:text-white">
                    닫기
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
