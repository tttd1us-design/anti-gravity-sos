    const playSound = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'bell') {
          [659.25, 880, 1046.5, 1318.51].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.08);
            gain.gain.setValueAtTime(0.06, ctx.currentTime + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.08);
            osc.stop(ctx.currentTime + i * 0.08 + 0.35);
          });
        } else if (type === 'cheer') {
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.05);
            gain.gain.setValueAtTime(0.05, ctx.currentTime + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.05 + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.05);
            osc.stop(ctx.currentTime + i * 0.05 + 0.2);
          });
        }
      } catch (e) {}

                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <span className="text-lg">🏛️</span>
                      <strong className="text-white text-sm md:text-base font-black">
                        [2. 5대 거장 실전 행동연계 매트릭스 (Master Action Checklist)]
                      </strong>
                    </div>
                    <span className="text-xs text-cyan-300 font-mono font-bold">
                      완료: {completedCount} / 5개
                    </span>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                    
                    {/* Ray Dalio Action Card */}
                    <div className={`p-4 rounded-2xl border transition space-y-2 ${masterActionChecks.dalio ? 'bg-cyan-950/40 border-cyan-400' : 'bg-space-950 border-slate-800'}`}>
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="text-[11px] font-mono text-cyan-400 font-bold block">레이 달리오 《원칙》</span>
                          <strong className="text-white text-xs md:text-sm font-bold">기계적 피드백 & If-Then 방어</strong>
                        </div>
                        <button
                          onClick={() => toggleMasterCheck('dalio')}
                          className={`px-2.5 py-1 rounded-xl text-xs font-bold transition flex items-center gap-1 ${masterActionChecks.dalio ? 'bg-cyan-500 text-black font-black' : 'bg-space-800 text-slate-300 border border-slate-700'}`}>
                          {masterActionChecks.dalio ? '✓ 완료됨' : '미완료'}
                        </button>
                      </div>
                      <p className="text-xs text-slate-200 leading-snug">
                        👉 <strong>행동 지침:</strong> {fiveMastersData.dalio.actionItem}
                      </p>
                      <div className="text-[11px] text-cyan-300 bg-space-900/80 p-2 rounded-xl border border-cyan-500/20 font-mono">
                        {fiveMastersData.dalio.ifThenRule}
                      </div>
                    </div>

                    {/* Tony Robbins Action Card */}
                    <div className={`p-4 rounded-2xl border transition space-y-2 ${masterActionChecks.robbins ? 'bg-rose-950/40 border-rose-400' : 'bg-space-950 border-slate-800'}`}>
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="text-[11px] font-mono text-rose-400 font-bold block">토니 로빈스 《거인을 깨워라》</span>
                          <strong className="text-white text-xs md:text-sm font-bold">30초 신경연합(NAC) 닻 내리기</strong>
                        </div>
                        <button
                          onClick={() => toggleMasterCheck('robbins')}
                          className={`px-2.5 py-1 rounded-xl text-xs font-bold transition flex items-center gap-1 ${masterActionChecks.robbins ? 'bg-rose-500 text-white font-black' : 'bg-space-800 text-slate-300 border border-slate-700'}`}>
                          {masterActionChecks.robbins ? '✓ 완료됨' : '미완료'}
                        </button>
                      </div>
                      <p className="text-xs text-slate-200 leading-snug">
                        👉 <strong>행동 지침:</strong> {fiveMastersData.robbins.actionItem}
                      </p>
                      <div className="text-[11px] text-rose-300 bg-space-900/80 p-2 rounded-xl border border-rose-500/20">
                        ⚡ 헌법: {fiveMastersData.robbins.immutablePrinciple}
                      </div>
                    </div>

                    {/* Tiago Forte Action Card */}
                    <div className={`p-4 rounded-2xl border transition space-y-2 ${masterActionChecks.forte ? 'bg-purple-950/40 border-purple-400' : 'bg-space-950 border-slate-800'}`}>
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="text-[11px] font-mono text-purple-400 font-bold block">티아고 포르테 《세컨드 브레인》</span>
                          <strong className="text-white text-xs md:text-sm font-bold">PARA 1문장 지식 증류 (CODE)</strong>
                        </div>
                        <button
                          onClick={() => toggleMasterCheck('forte')}
                          className={`px-2.5 py-1 rounded-xl text-xs font-bold transition flex items-center gap-1 ${masterActionChecks.forte ? 'bg-purple-500 text-white font-black' : 'bg-space-800 text-slate-300 border border-slate-700'}`}>
                          {masterActionChecks.forte ? '✓ 완료됨' : '미완료'}
                        </button>
                      </div>
                      <p className="text-xs text-slate-200 leading-snug">
                        👉 <strong>행동 지침:</strong> {fiveMastersData.forte.actionItem}
                      </p>
                      <div className="text-[11px] text-purple-300 bg-space-900/80 p-2 rounded-xl border border-purple-500/20">
                        💎 본질: {fiveMastersData.forte.distilledEssence}
                      </div>
                    </div>

                    {/* Napoleon Hill Action Card */}
                    <div className={`p-4 rounded-2xl border transition space-y-2 ${masterActionChecks.hill ? 'bg-gold-950/40 border-gold-400' : 'bg-space-950 border-slate-800'}`}>
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="text-[11px] font-mono text-gold-400 font-bold block">나폴레온 힐 《생각하라 부자가 되어라》</span>
                          <strong className="text-white text-xs md:text-sm font-bold">DCA 6단계 확약문 낭독</strong>
                        </div>
                        <button
                          onClick={() => toggleMasterCheck('hill')}
                          className={`px-2.5 py-1 rounded-xl text-xs font-bold transition flex items-center gap-1 ${masterActionChecks.hill ? 'bg-gold-500 text-black font-black' : 'bg-space-800 text-slate-300 border border-slate-700'}`}>
                          {masterActionChecks.hill ? '✓ 완료됨' : '미완료'}
                        </button>
                      </div>
                      <p className="text-xs text-slate-200 leading-snug">
                        👉 <strong>행동 지침:</strong> {fiveMastersData.hill.actionItem}
                      </p>
                      <div className="text-[11px] text-gold-300 bg-space-900/80 p-2 rounded-xl border border-gold-500/20">
                        🎯 북극성: "{fiveMastersData.hill.definiteChiefAim}"
                      </div>
                    </div>

                  </div>
                </div>

                {/* 3. 하루 3대 골든 타임라인 루틴 트래커 (Daily 3-Phase Action Timeline) */}
                <div className="glass-box rounded-3xl p-6 border border-slate-800 space-y-4">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-2">
                      <span className="text-lg">⏰</span>
                      <strong className="text-white text-sm md:text-base font-black">
                        [3. 하루 3대 골든 타임라인 실행 루틴]
                      </strong>
                    </div>
                    <span className="text-xs text-emerald-400 font-mono font-bold">
                      루틴 완료: {routineCompletedCount} / 3회
                    </span>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                    
                    {/* 아침 07:00 */}
                    <div className={`p-4 rounded-2xl border transition space-y-2 ${dailyRoutineChecks.morning ? 'bg-emerald-950/40 border-emerald-400' : 'bg-space-950 border-slate-800'}`}>
                      <div className="flex justify-between items-center">
                        <span className="text-xs font-black text-cyan-300">☀️ 아침 07:00 (착수)</span>
                        <button
                          onClick={() => toggleRoutineCheck('morning')}
                          className={`w-6 h-6 rounded-lg text-xs font-bold flex items-center justify-center ${dailyRoutineChecks.morning ? 'bg-emerald-500 text-black' : 'bg-space-800 border border-slate-700 text-slate-400'}`}>
                          {dailyRoutineChecks.morning ? '✓' : ''}
                        </button>
                      </div>
                      <p className="text-xs text-slate-200">
                        • 비공개 3분 메모 루틴<br/>
                        • DCA 확약문 1회 낭독
                      </p>
                    </div>

                    {/* 낮 13:00 */}
                    <div className={`p-4 rounded-2xl border transition space-y-2 ${dailyRoutineChecks.midday ? 'bg-emerald-950/40 border-emerald-400' : 'bg-space-950 border-slate-800'}`}>
                      <div className="flex justify-between items-center">
                        <span className="text-xs font-black text-gold-300">🌤️ 낮 13:00 (방어)</span>
                        <button
                          onClick={() => toggleRoutineCheck('midday')}
                          className={`w-6 h-6 rounded-lg text-xs font-bold flex items-center justify-center ${dailyRoutineChecks.midday ? 'bg-emerald-500 text-black' : 'bg-space-800 border border-slate-700 text-slate-400'}`}>
                          {dailyRoutineChecks.midday ? '✓' : ''}
                        </button>
                      </div>
                      <p className="text-xs text-slate-200">
                        • 타성 방어 30초 시각화<br/>
                        • If-Then 헌법 1회 상기
                      </p>
                    </div>

                    {/* 밤 22:00 */}
                    <div className={`p-4 rounded-2xl border transition space-y-2 ${dailyRoutineChecks.night ? 'bg-emerald-950/40 border-emerald-400' : 'bg-space-950 border-slate-800'}`}>
                      <div className="flex justify-between items-center">
                        <span className="text-xs font-black text-purple-300">🌙 밤 22:00 (결산)</span>
                        <button
                          onClick={() => toggleRoutineCheck('night')}
                          className={`w-6 h-6 rounded-lg text-xs font-bold flex items-center justify-center ${dailyRoutineChecks.night ? 'bg-emerald-500 text-black' : 'bg-space-800 border border-slate-700 text-slate-400'}`}>
                          {dailyRoutineChecks.night ? '✓' : ''}
                        </button>
                      </div>
                      <p className="text-xs text-slate-200">
                        • 오늘 깨달음 1문장 요약<br/>
                        • 파트너에게 3분 미션 완료 보고
                      </p>
                    </div>

                  </div>
                </div>

              </div>
            )}

            {/* 🌟 1. [대화 워크스페이스] 탭 */}
            {mainNavTab === 'WORKSPACE' && (
              <div className="flex-1 p-6 text-center">
                <p className="text-white">대화 워크스페이스로 전환 중...</p>
              </div>
            )}

            {/* 🌟 2. [대화&답변 백업로그] 탭 */}
            {mainNavTab === 'BACKUP_LOGS' && (
              <div className="flex-1 p-6 overflow-y-auto space-y-2 max-w-5xl mx-auto">
                <h2 className="text-xl font-black text-teal-300 mb-3">📒 실시간 대화 & 답변 백업로그 볼트</h2>
                {qaBackupLogs.map((log, idx) => (
                  <div key={log.id} className="glass-box-active p-3 rounded-xl border border-slate-750">
                    <strong className="text-cyan-300 text-xs block mb-1">#{idx + 1} {log.question} ({log.time})</strong>
                    <p className="text-white text-xs leading-snug">{log.answer}</p>
                  </div>
                ))}
              </div>
            )}

            {/* 🌟 3. [5대 시스템종합] 탭 */}
            {mainNavTab === 'MATRIX' && (
              <div className="flex-1 p-6 overflow-y-auto max-w-6xl mx-auto">
                <h2 className="text-xl font-black text-white mb-4">📑 5대 시스템종합 데이터 아키텍처 매트릭스</h2>
                <div className="glass-box rounded-2xl p-4 border border-cyan-500/30">
                  <p className="text-slate-200 text-xs">5대 거장 시스템의 원리와 산출물이 체계적으로 매핑되어 있습니다.</p>
                </div>
              </div>
            )}

            {/* 🌟 4. [분석 시스템] 탭 */}
            {mainNavTab === 'ANALYSIS' && (
              <div className="flex-1 p-6 overflow-y-auto max-w-6xl mx-auto">
                <h2 className="text-xl font-black text-purple-300 mb-4">📊 5대 거장 분석 시스템</h2>
                <div className="glass-box rounded-2xl p-4 border border-purple-500/30">
                  <p className="text-slate-200 text-xs">5대 거장의 핵심 원리와 3대 기준, AI 행동 처방전을 확인하세요.</p>
                </div>
              </div>
            )}

            {/* 🌟 6. [소셜 알람] 탭 */}
            {mainNavTab === 'SOCIAL_ALARM' && (
              <div className="flex-1 p-6 max-w-5xl mx-auto">
                <h2 className="text-xl font-black text-rose-300 mb-3">🔔 소셜 알람 & 다채널 행동 유도 관제 센터</h2>
                <p className="text-slate-200 text-sm">메일, 카카오톡, 텔레그램을 통해 매일 정해진 시간(07:00 / 13:00 / 22:00)에 오늘 내가 해야 할 명확한 행동 지침을 전송합니다.</p>
              </div>
            )}

          </main>

          {/* 3-Minute Stamp Complete Modal */}
          {showStampPopup && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-box-active rounded-3xl max-w-md w-full p-8 text-center border-2 border-cyan-400 shadow-2xl">
                <span className="text-4xl block mb-2">🎉</span>
                <h3 className="text-2xl font-black text-white mb-2">3분 미션 성공 완료!</h3>
                <p className="text-sm text-slate-200 mb-6">
                  오늘의 행동 마찰을 멋지게 돌파하셨습니다!<br/>
                  누적 {completedStreaks}회 완수 기록이 성공관리시스템에 안전하게 저장되었습니다.
                </p>
                <button onClick={() => setShowStampPopup(false)} className="w-full py-3 bg-cyan-500 text-black font-bold rounded-xl">
                  확인
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
