<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <title>안티그레비티 - 소크라테스 4대 질문 기반 성공관리시스템(SMS)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            space: {
              950: '#030508',
              900: '#070B12',
              850: '#0D1422',

  </script>

  <style>
    body {
      background-color: #030508;
      color: #F8FAFC;
      font-family: 'Pretendard', sans-serif;
      overflow-x: hidden;
      font-size: 18px;
      line-height: 1.7;
      user-select: none;
      transition: font-size 0.15s ease;
    }
    
    .bg-soft-pattern {
      background-image: 
        linear-gradient(to right, rgba(34, 211, 238, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(34, 211, 238, 0.03) 1px, transparent 1px);
      background-size: 36px 36px;
    }
    
    .glass-box {
      background: rgba(13, 20, 34, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid rgba(34, 211, 238, 0.22);
    }

    .glass-box-active {
      background: rgba(13, 20, 34, 0.96);
      backdrop-filter: blur(22px);
      border: 2px solid rgba(0, 240, 255, 0.55);
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.18);
    }

    .pipeline-step-active {
      border-left: 4px solid #00F0FF;
      background: rgba(34, 211, 238, 0.08);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
    }

    .mic-pulse {
      animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.7); }
      70% { box-shadow: 0 0 0 14px rgba(244, 63, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
    }

    .resizer-bar {
      width: 10px;
      cursor: col-resize;

      transition: background 0.2s ease;

    }
    .resizer-bar:hover, .resizer-bar.dragging {
      background: #00F0FF;

    }

    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #070B12;
    }
    ::-webkit-scrollbar-thumb {

<body class="bg-soft-pattern min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const playSound = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.06);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.06);
        } else if (type === 'cheer') {
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.06);
            gain.gain.setValueAtTime(0.06, ctx.currentTime + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.06 + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.06);
            osc.stop(ctx.currentTime + i * 0.06 + 0.25);
          });
        }
      } catch (e) {}
    };

    // 4대 소크라테스 질문 생성기
    const generateSocratic4Questions = (userText) => {
      const t = userText.toLowerCase();

      if (t.includes('책') || t.includes('글') || t.includes('출판') || t.includes('블로그') || t.includes('원고')) {
        return [
          { id: 'q1', slot: 'endState', pillar: '1. 본원적 가치 & 타겟 독자', title: '🎯 핵심 독자 정의', text: `이 책/글을 읽고 인생이 바뀔 '단 한 사람의 구체적인 타겟 독자(Persona)'는 누구인가요?` },
          { id: 'q2', slot: 'bottleneck', pillar: '2. 핵심 병목 & 두려움', title: '🛑 집필 마찰 요인', text: `글쓰기를 시작하려 할 때 가장 큰 저항(완벽주의, 목차 막막함, 시간 부족)은 무엇인가요?` },
          { id: 'q3', slot: 'leverage', pillar: '3. 차별화 레버리지', title: '💎 독점적 통찰', text: `기존 도서/콘텐츠와 차별화되는 당신만의 '실제 경험 수치 및 고유 프레임워크'는 무엇인가요?` },
          { id: 'q4', slot: 'microAction', pillar: '4. 3분 마이크로 실행', title: '⚡ 즉시 착수 미션', text: `지금 당장 3분 안에 마찰 없이 쓸 수 있는 '프롤로그의 첫 한 줄'은 무엇인가요?` }
        ];
      }

      if (t.includes('돈') || t.includes('수익') || t.includes('사업') || t.includes('매출') || t.includes('부업') || t.includes('월')) {
        return [
          { id: 'q1', slot: 'endState', pillar: '1. 수익 모델 & 가치 교환', title: '💰 고객의 지불 가치', text: `고객이 기꺼이 지갑을 열고 돈을 낼 수밖에 없는 '가장 절실한 고통(Pain Point)'은 무엇인가요?` },
          { id: 'q2', slot: 'bottleneck', pillar: '2. 핵심 병목 & 전환 마찰', title: '🛑 수익화 병목', text: `첫 1원 또는 첫 결제자를 확보하는 데 가장 큰 장애물(트래픽, 상품성, 설득력)은 무엇인가요?` },
          { id: 'q3', slot: 'leverage', pillar: '3. 레버리지 & 복리 구조', title: '📈 확장 메커니즘', text: `나의 시간을 직접 쓰지 않고도 24시간 작동할 수 있는 '자동화/시스템 레버리지'는 무엇인가요?` },
          { id: 'q4', slot: 'microAction', pillar: '4. 3분 마이크로 실행', title: '⚡ 즉시 착수 미션', text: `오늘 당장 3분 안에 잠재 고객에게 보여줄 수 있는 '한 줄 가치 제안(Value Proposition)'은 무엇인가요?` }
        ];
      }

      if (t.includes('공부') || t.includes('시험') || t.includes('자격증') || t.includes('합격') || t.includes('영어') || t.includes('개발')) {
        return [
          { id: 'q1', slot: 'endState', pillar: '1. 합격 기준 & 최종 상태', title: '🏆 목표 합격선', text: `합격을 위해 반드시 넘어야 하는 '가장 취약한 과목/파트'와 목표 점수는 몇 점인가요?` },
          { id: 'q2', slot: 'bottleneck', pillar: '2. 학습 저항 & 망각 곡선', title: '🛑 학습 몰입 병목', text: `책상 앞에 앉았을 때 스마트폰이나 딴짓으로 빠지게 만드는 '환경적 유혹'은 무엇인가요?` },
          { id: 'q3', slot: 'leverage', pillar: '3. 메타인지 & 오답 전략', title: '🧠 고효율 학습법', text: `단순 암기가 아닌, 틀린 문제를 시스템적으로 정복할 '나만의 오답 루프(Retrospective Loop)'는 무엇인가요?` },
          { id: 'q4', slot: 'microAction', pillar: '4. 3분 마이크로 실행', title: '⚡ 즉시 착수 미션', text: `지금 당장 3분 동안 교재를 펴고 확인할 '핵심 개념 1단락'은 무엇인가요?` }
        ];
      }

      // 범용 고도화 프레임워크
      return [
        { id: 'q1', slot: 'endState', pillar: '1. 본원적 열망 (End-State)', title: '🎯 달성 후의 본질적 가치', text: `[${userText.substring(0, 15)}]이(가) 완벽히 실현되었을 때, 삶에서 얻게 되는 '가장 핵심적인 변화'는 무엇인가요?` },
        { id: 'q2', slot: 'bottleneck', pillar: '2. 심리적 저항 (Gravity Friction)', title: '🛑 시작을 막는 진짜 이유', text: `이 일을 시작하거나 지속하려 할 때, 무의식적으로 뒤로 미루게 만드는 '마음속 브레이크'는 무엇인가요?` },
        { id: 'q3', slot: 'leverage', pillar: '3. 전략적 레버리지 (Leverage)', title: '💎 성공 확률을 3배 높일 지렛대', text: `의지력에 의존하지 않고 환경과 시스템으로 자동 실행되게 만들 '단 하나의 안전장치'는 무엇인가요?` },
        { id: 'q4', slot: 'microAction', pillar: '4. 마이크로 실행 (Runway Action)', title: '⚡ 3분 활성화 미션', text: `실패가 물리적으로 불가능할 정도로 작은, '지금 당장 3분 안에 할 수 있는 최소 행동'은 무엇인가요?` }
      ];
    };

    function App() {
      // 폰트 배율 (기본 1.6)
      const [fontSize, setFontSize] = useState(() => {
        return parseFloat(localStorage.getItem('AG_EASY_FONT') || '1.6');
      });

      // 좌우 화면 분할 비율 (기본 50% / 50%)
      const [leftWidthPercent, setLeftWidthPercent] = useState(() => {
        return parseFloat(localStorage.getItem('AG_SPLIT_PERCENT') || '50');
      });
      const [isDragging, setIsDragging] = useState(false);

      // 입력창 높이
      const [inputRows, setInputRows] = useState(2);

      // 4대 질문 중 현재 선택되어 활성화된 질문 (null이면 일반 모드)
      const [selectedQuestion, setSelectedQuestion] = useState(null);

      // 4대 질문 리스트
      const [activeQuestions, setActiveQuestions] = useState(() => {
        return generateSocratic4Questions("월 100만 원 부업 수익 만들기");
      });

      // 성공관리시스템(SMS) 파이프라인 데이터
      const [smsPipeline, setSmsPipeline] = useState(() => {
        const saved = localStorage.getItem('AG_SMS_PIPELINE_V2');
        return saved ? JSON.parse(saved) : {
          step1: {
            surfaceGoal: "월 100만 원 부업 수익 만들기",
            latentDesire: "회사에 종속되지 않는 경제적 자립과 자아실현",
            gravityFriction: "완벽주의에 의한 평가 공포 및 시작 지연",
            ladderLevel: "Level 2 (3분 초간단 미션)"
          },
          step2: {
            dca: "2026년 1인 지식 엔터프라이즈 기반 월 100만 원 자동화 파이프라인 확립",
            radarWeights: { independence: 92, competence: 88, stability: 75, freedom: 95 },
            paraCategory: "Projects (진행 중인 핵심 프로젝트)",
            accumulatedDataCount: 18
          },
          step3: {
            ifThenRule: "IF 새로운 기획을 앞두고 미루고 싶을 때, THEN 비공개 메모장에 단어 3개만 적는다.",
            crucialAction: "스마트폰 메모장을 켜고 아이디어 단어 3개만 적기",
            activationEnergy: "0.85 (매우 가벼움 - 중력 탈출 성공)",
            momentumScore: 78
          }
        };
      });

      // 실시간 대화 및 답변 백업 로그
      const [qaBackupLogs, setQaBackupLogs] = useState(() => {
        const saved = localStorage.getItem('AG_QA_BACKUP_LOGS_V1');
        return saved ? JSON.parse(saved) : [
          {
            id: 1,
            type: 'GOAL',
            question: '🎯 나의 핵심 목표',
            answer: '월 100만 원 부업 수익 만들기',
            time: '기본 등록'
          }
        ];
      });

      // 3분 미션 타이머
      const [timeLeft, setTimeLeft] = useState(180);
      const [timerOn, setTimerOn] = useState(false);
      const [showStampPopup, setShowStampPopup] = useState(false);

      // 메시지 목록
      const [messages, setMessages] = useState([
        {
          id: 1,
          sender: 'coach',
          text: `안녕하세요! 반갑습니다 😊\n\n하고 싶은 목표나 프로젝트를 자유롭게 적거나 마이크로 말씀해 주세요. 그에 맞춘 **4대 소크라테스 질문**이 도출되며, 질문을 누르고 답하면 우측 하단에 실시간 백업됩니다!`,
          time: '지금'
        }
      ]);

      const [inputMsg, setInputMsg] = useState("");
      const [isThinking, setIsThinking] = useState(false);
      const chatEndRef = useRef(null);

      // 30분 연속 음성 인식 상태
      const [isRecording, setIsRecording] = useState(false);
      const [recordDuration, setRecordDuration] = useState(0);
      const recognitionRef = useRef(null);
      const isExplicitStopRef = useRef(false);
      const recordTimerRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('AG_SMS_PIPELINE_V2', JSON.stringify(smsPipeline));
        localStorage.setItem('AG_QA_BACKUP_LOGS_V1', JSON.stringify(qaBackupLogs));
        localStorage.setItem('AG_SPLIT_PERCENT', leftWidthPercent.toString());
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [messages, smsPipeline, qaBackupLogs, leftWidthPercent, fontSize, isRecording, recordDuration, selectedQuestion, inputRows]);

      // 타이머 카운트다운
      useEffect(() => {
        let timer = null;
        if (timerOn && timeLeft > 0) {
          timer = setInterval(() => setTimeLeft(t => t - 1), 1000);
        } else if (timeLeft === 0 && timerOn) {
          setTimerOn(false);
          playSound('cheer');
          if (window.confetti) {
            window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
          }
          setSmsPipeline(prev => ({
            ...prev,
            step3: {
              ...prev.step3,
              momentumScore: Math.min(100, prev.step3.momentumScore + 10)
            }
          }));
          setShowStampPopup(true);
        }
        return () => clearInterval(timer);
      }, [timerOn, timeLeft]);

      // 음성 녹음 시간 카운터
      useEffect(() => {
        if (isRecording) {
          recordTimerRef.current = setInterval(() => {
            setRecordDuration(sec => sec + 1);
          }, 1000);
        } else {
          clearInterval(recordTimerRef.current);
          setRecordDuration(0);
        }
        return () => clearInterval(recordTimerRef.current);
      }, [isRecording]);

      // 가로 리사이징 마우스 드래그 핸들러
      const handleMouseDown = (e) => {
        setIsDragging(true);
      };

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!isDragging) return;
          const containerWidth = window.innerWidth;
          const newPercent = (e.clientX / containerWidth) * 100;
          if (newPercent >= 25 && newPercent <= 80) {
            setLeftWidthPercent(parseFloat(newPercent.toFixed(1)));
          }
        };

        const handleMouseUp = () => {
          setIsDragging(false);
        };

        if (isDragging) {
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);
        }
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [isDragging]);

      // Web Speech API 30분 연속 음성 인식
      const toggleVoiceRecording = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("현재 브라우저가 음성 인식을 지원하지 않습니다. Chrome 또는 Edge 브라우저를 사용해 주세요.");
          return;
        }

        if (isRecording) {
          isExplicitStopRef.current = true;
          setIsRecording(false);
          if (recognitionRef.current) recognitionRef.current.stop();
          playSound('pop');
        } else {
          isExplicitStopRef.current = false;
          playSound('pop');

          const recognition = new SpeechRecognition();
          recognition.lang = 'ko-KR';
          recognition.continuous = true;
          recognition.interimResults = true;

          recognition.onstart = () => {
            setIsRecording(true);
          };

          recognition.onresult = (event) => {
            for (let i = event.resultIndex; i < event.results.length; ++i) {
              if (event.results[i].isFinal) {
                const finalPiece = event.results[i][0].transcript.trim();
                setInputMsg(prev => (prev ? prev + " " : "") + finalPiece);
              }
            }
          };

          recognition.onerror = (event) => {
            if (event.error === 'not-allowed') {
              alert("마이크 권한을 허용해 주세요.");
              setIsRecording(false);
              isExplicitStopRef.current = true;
            }
          };

          recognition.onend = () => {
            if (!isExplicitStopRef.current) {
              try { recognition.start(); } catch (e) {}
            }
          };

          recognitionRef.current = recognition;
          try { recognition.start(); } catch (e) {}
        }
      };

      const changeFontSize = (scale) => {
        const val = Math.min(2.4, Math.max(1.1, parseFloat(scale.toFixed(1))));
        setFontSize(val);
        localStorage.setItem('AG_EASY_FONT', val.toString());
        playSound('pop');
      };

      // 4대 질문 중 하나를 클릭하면 ➔ 대화창 위쪽에 고정하여 답변 준비
      const handleSelectQuestion = (q) => {
        setSelectedQuestion(q);

              question: `${qObj.title}: ${qObj.text}`,

              time: timeStr

          setSmsPipeline(prev => {
            const next = { ...prev };
            if (qObj.slot === 'endState') {
              next.step1.latentDesire = text;
            } else if (qObj.slot === 'bottleneck') {
              next.step1.gravityFriction = text;
            } else if (qObj.slot === 'leverage') {
              next.step3.ifThenRule = `IF [${text}] 레버리지 가동 시, THEN 실행 마찰을 최소화한다.`;
            } else if (qObj.slot === 'microAction') {
              next.step3.crucialAction = text;
            }
            next.step2.accumulatedDataCount += 1;
            return next;

          setSelectedQuestion(null); // 질문 답변 완료 후 헤더 닫기
          playSound('cheer');
          setIsThinking(true);

          setTimeout(() => {
            const coachMsg = {
              id: Date.now() + 1,
              sender: 'coach',
              text: `✅ **"${qObj.title}"**에 대한 소중한 답변이 성공관리시스템 및 우측 하단 백업 저장소에 안전하게 기록되었습니다! 🌟\n\n다른 질문을 선택하여 방향성을 계속 구체화하거나 자유롭게 대화를 이어가 보세요.`,
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            setMessages(prev => [...prev, coachMsg]);
            setIsThinking(false);

          sender: 'user',
          text,
          time: timeStr

                  </div>
                  <div className="text-xs space-y-1.5">
                    <div className="p-2.5 bg-space-900 rounded-lg border border-purple-500/30">
                      <span className="text-purple-300 block text-[11px] font-bold">🧭 중심 목표 (DCA):</span>
                      <p className="text-white font-bold">{smsPipeline.step2.dca}</p>
                    </div>
                    <div className="p-2.5 bg-space-900 rounded-lg border border-gold-500/40">
                      <span className="text-gold-400 block text-[11px] font-bold">⚡ Ray Dalio If-Then 원칙:</span>
                      <p className="text-gold-100">{smsPipeline.step3.ifThenRule}</p>
                    </div>
                    <div className="p-2.5 bg-space-900 rounded-lg border border-cyan-400/40 flex justify-between items-center">
                      <div>
                        <span className="text-cyan-300 block text-[11px] font-bold">🚀 3분 활성화 미션:</span>
                        <span className="text-white font-extrabold text-xs">{smsPipeline.step3.crucialAction}</span>
                      </div>
                      <button
                        onClick={() => { setTimerOn(true); playSound('pop'); }}
                        className="px-3 py-1.5 rounded-lg text-xs font-black bg-cyan-500 text-black hover:bg-cyan-400">
                        타이머 시작
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              {/* 🌟 5. 우측 하단 (50% 높이): 실시간 대화 & 답변 백업 기록 (상시 확인 및 다운로드) */}
              <div className="flex-1 p-5 md:p-6 overflow-y-auto space-y-3 bg-space-900/60">
                <div className="flex items-center justify-between border-b border-slate-800 pb-2.5">
                  <div className="flex items-center gap-2">
                    <span className="text-lg">📒</span>
                    <h3 className="text-base font-bold text-emerald-400">실시간 대화 & 답변 백업 기록</h3>
                  </div>
                  <button
                    onClick={() => {
                      const doc = `# 📒 [Anti-Gravity 대화 & 답변 실시간 백업 로그]\n\n` +
                        qaBackupLogs.map((log, idx) => `### ${idx + 1}. [${log.type}] ${log.question} (${log.time})\n- 답변 내용: ${log.answer}\n`).join('\n');
                      downloadTextFile('대화내용_답변_백업로그.md', doc);
                    }}
                    className="px-3 py-1 rounded-xl font-bold text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-400 hover:bg-emerald-500/30 flex items-center gap-1.5 shadow-md">
                    <i data-lucide="download" className="w-3.5 h-3.5"></i>
                    <span>백업 다운로드 (.md)</span>
                  </button>
                </div>

                <div className="space-y-2.5">
                  {qaBackupLogs.map((log, idx) => (
                    <div key={log.id} className="p-3.5 rounded-xl bg-space-850 border border-slate-800 space-y-1">
                      <div className="flex justify-between items-center text-[11px] text-slate-400">
                        <span className="font-bold text-cyan-300 font-mono">#{idx + 1} {log.question}</span>
                        <span>{log.time}</span>
                      </div>
                      <p className="text-xs md:text-sm text-slate-100 font-medium whitespace-pre-line leading-relaxed">
                        {log.answer}
                      </p>
                    </div>
                  ))}
                </div>
              </div>

            </aside>

          </div>

          {/* 3-Minute Stamp Complete Modal */}
          {showStampPopup && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-box-active rounded-3xl max-w-md w-full p-8 text-center border-2 border-cyan-400 shadow-2xl">
                <div className="w-20 h-20 rounded-full bg-emerald-500/20 text-emerald-400 mx-auto flex items-center justify-center mb-4">
                  <span className="text-4xl">🎉</span>
                </div>
                <h3 className="text-2xl font-black text-white mb-2">3분 미션 성공 완료!</h3>
                <p className="text-base text-slate-200 mb-6 leading-relaxed">
                  오늘의 귀차니즘을 멋지게 이겨내셨어요!<br/>
                  오른편 <strong>성공관리시스템 모멘텀 +10%</strong>가 적립되었습니다.
                </p>
                <button
                  onClick={() => setShowStampPopup(false)}
                  className="w-full py-4 rounded-xl font-bold text-base bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-lg">
                  확인
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
