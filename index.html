    const playSound = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'cheer') {
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.05);
            gain.gain.setValueAtTime(0.05, ctx.currentTime + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.05 + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.05);
            osc.stop(ctx.currentTime + i * 0.05 + 0.2);
          });
        }
      } catch (e) {}
    };

        localStorage.setItem('AG_QA_BACKUP_LOGS_V6', JSON.stringify(qaBackupLogs));
        localStorage.setItem('AG_SPLIT_PERCENT', leftWidthPercent.toString());
        localStorage.setItem('AG_FONT_CHAT', chatFontSize.toString());
        localStorage.setItem('AG_FONT_SYSTEM', systemFontSize.toString());
        localStorage.setItem('AG_FONT_BACKUP', backupFontSize.toString());
        localStorage.setItem('AG_FONT_ANALYSIS', analysisFontSize.toString());
        localStorage.setItem('AG_FONT_ACTION', actionFontSize.toString());
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        if (window.lucide) {

      useEffect(() => {
        let timer = null;
        if (timerOn && timeLeft > 0) {
          timer = setInterval(() => setTimeLeft(t => t - 1), 1000);
        } else if (timeLeft === 0 && timerOn) {
          setTimerOn(false);
          playSound('cheer');
          if (window.confetti) {
            window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
          }
          setShowStampPopup(true);
        }
        return () => clearInterval(timer);
      }, [timerOn, timeLeft]);

      useEffect(() => {
        if (isRecording) {
          recordTimerRef.current = setInterval(() => {
            setRecordDuration(sec => sec + 1);
          }, 1000);
        } else {
          clearInterval(recordTimerRef.current);
          setRecordDuration(0);
        }
        return () => clearInterval(recordTimerRef.current);
      }, [isRecording]);

      const handleMouseDown = (e) => {
        setIsDragging(true);
      };

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!isDragging) return;
          const containerWidth = window.innerWidth;
          const newPercent = (e.clientX / containerWidth) * 100;
          if (newPercent >= 25 && newPercent <= 80) {
            setLeftWidthPercent(parseFloat(newPercent.toFixed(1)));
          }
        };

        const handleMouseUp = () => {
          setIsDragging(false);
        };

        if (isDragging) {
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);
        }
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [isDragging]);

      const toggleVoiceRecording = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("Chrome 또는 Edge 브라우저를 사용해 주세요.");
          return;
        }

        if (isRecording) {
          isExplicitStopRef.current = true;
          setIsRecording(false);
          if (recognitionRef.current) recognitionRef.current.stop();
          playSound('pop');
        } else {
          isExplicitStopRef.current = false;
          playSound('pop');

          const recognition = new SpeechRecognition();
          recognition.lang = 'ko-KR';
          recognition.continuous = true;
          recognition.interimResults = true;

          recognition.onstart = () => setIsRecording(true);

          recognition.onresult = (event) => {
            for (let i = event.resultIndex; i < event.results.length; ++i) {
              if (event.results[i].isFinal) {
                const finalPiece = event.results[i][0].transcript.trim();
                setInputMsg(prev => (prev ? prev + " " : "") + finalPiece);
              }
            }
          };

          recognition.onerror = (event) => {
            if (event.error === 'not-allowed') {
              alert("마이크 권한을 허용해 주세요.");
              setIsRecording(false);
              isExplicitStopRef.current = true;
            }
          };

          recognition.onend = () => {
            if (!isExplicitStopRef.current) {
              try { recognition.start(); } catch (e) {}
            }
          };

          recognitionRef.current = recognition;
          try { recognition.start(); } catch (e) {}
        }
      };

      const handleSelectQuestion = (q) => {
        setSelectedQuestion(q);
        playSound('pop');
      };

      const sendChat = () => {
        const text = inputMsg.trim();
        if (!text || isThinking) return;

        if (isRecording) {
          isExplicitStopRef.current = true;
          setIsRecording(false);
          if (recognitionRef.current) recognitionRef.current.stop();
        }

        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        if (selectedQuestion) {
          const qObj = selectedQuestion;
          const userMsg = {
            id: Date.now(),
            sender: 'user',
            text: `[${qObj.title} 답변]\n${text}`,

            setMessages(prev => [...prev, coachMsg]);
            setIsThinking(false);
          }, 400);

          return;

          id: Date.now(),
          sender: 'user',
          text,
          time: timeStr
        };

        setMessages(prev => [...prev, userMsg]);
        
        setQaBackupLogs(prev => [
          ...prev,
          {
            id: Date.now(),
            type: 'STATEMENT',
            question: '💬 자유 발언 / 목표 기획',
            answer: text,
            time: timeStr
          }
        ]);

        setInputMsg("");
        playSound('pop');
        setIsThinking(true);

            ...prev,

              ...prev.dalio,

            {/* 🌟 1. [대화 워크스페이스] 탭 */}

                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="glass-box rounded-3xl p-5 border border-rose-500/40 space-y-2"><span className="text-rose-400 font-black text-sm block">🛑 미달성 시 고통</span><p className="text-slate-100 leading-relaxed bg-space-900 p-3.5 rounded-xl">{fiveMastersData.robbins.painOfFailure}</p></div>
                        <div className="glass-box rounded-3xl p-5 border border-emerald-500/40 space-y-2"><span className="text-emerald-400 font-black text-sm block">✨ 달성 시 쾌락</span><p className="text-slate-100 leading-relaxed bg-space-900 p-3.5 rounded-xl">{fiveMastersData.robbins.pleasureOfSuccess}</p></div>
                      </div>
                    </div>
                  )}

                  {selectedMasterInAnalysis === 'FORTE' && (
                    <div className="space-y-6">
                      <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                        <h2 className="text-xl md:text-2xl font-black text-purple-300">③ 티아고 포르테 《세컨드 브레인》 심층 분석</h2>
                        <span className="text-xs font-mono text-slate-400">PARA Framework</span>
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="glass-box rounded-3xl p-5 border-2 border-purple-500/40 space-y-1.5"><strong className="text-purple-300 text-sm block">📁 Projects</strong><p className="text-white font-bold bg-space-900 p-3.5 rounded-xl">{fiveMastersData.forte.projects}</p></div>
                        <div className="glass-box rounded-3xl p-5 border border-slate-800 space-y-1.5"><strong className="text-slate-300 text-sm block">📂 Areas</strong><p className="text-white font-bold bg-space-900 p-3.5 rounded-xl">{fiveMastersData.forte.areas}</p></div>
                        <div className="glass-box rounded-3xl p-5 border border-slate-800 space-y-1.5"><strong className="text-slate-300 text-sm block">📚 Resources</strong><p className="text-white font-bold bg-space-900 p-3.5 rounded-xl">{fiveMastersData.forte.resources}</p></div>
                        <div className="glass-box rounded-3xl p-5 border border-slate-800 space-y-1.5"><strong className="text-slate-300 text-sm block">🗄️ Archives</strong><p className="text-white font-bold bg-space-900 p-3.5 rounded-xl">{fiveMastersData.forte.archives}</p></div>
                      </div>
                      <div className="glass-box-active rounded-3xl p-6 border-2 border-cyan-400 space-y-2"><strong className="text-cyan-300 text-sm block">💎 정제된 본질 (Distilled Essence)</strong><p className="text-white font-bold leading-relaxed bg-space-950 p-4 rounded-xl">{fiveMastersData.forte.distilledEssence}</p></div>
                    </div>
                  )}

                  {selectedMasterInAnalysis === 'HILL' && (
                    <div className="space-y-6">
                      <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                        <h2 className="text-xl md:text-2xl font-black text-gold-300">④ 나폴레온 힐 《생각하라 그리고 부자가 되어라》 심층 분석</h2>
                        <span className="text-xs font-mono text-slate-400">DCA Protocol</span>
                      </div>
                      <div className="glass-box-active rounded-3xl p-7 border-2 border-gold-400 shadow-2xl space-y-3">
                        <span className="text-gold-300 font-bold text-sm block">📜 나의 6단계 확약 진술문</span>
                        <div className="bg-space-950 p-5 rounded-2xl border border-gold-500/40"><p className="text-white font-black leading-relaxed">"{fiveMastersData.hill.definiteChiefAim}"</p></div>
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div className="glass-box p-4 rounded-2xl border border-slate-800"><span className="text-gold-400 font-bold text-xs block mb-1">💰 목표 금액/가치</span><p className="text-white font-bold">{fiveMastersData.hill.exactAmount}</p></div>
                        <div className="glass-box p-4 rounded-2xl border border-slate-800"><span className="text-gold-400 font-bold text-xs block mb-1">⏳ 완수 기한</span><p className="text-white font-bold">{fiveMastersData.hill.deadline}</p></div>
                        <div className="glass-box p-4 rounded-2xl border border-slate-800"><span className="text-rose-400 font-bold text-xs block mb-1">⚖️ 지불할 대가</span><p className="text-white font-bold">{fiveMastersData.hill.sacrifice}</p></div>
                        <div className="glass-box p-4 rounded-2xl border border-slate-800"><span className="text-emerald-400 font-bold text-xs block mb-1">🚀 즉시 실행 계획</span><p className="text-white font-bold">{fiveMastersData.hill.immediatePlan}</p></div>
                      </div>
                    </div>
                  )}

                  {selectedMasterInAnalysis === 'GTD' && (
                    <div className="space-y-6">
                      <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                        <h2 className="text-xl md:text-2xl font-black text-cyan-300">⑤ 데이비드 앨런 《GTD》 심층 분석</h2>
                        <span className="text-xs font-mono text-slate-400">Horizons of Focus</span>
                      </div>
                      <div className="glass-box rounded-3xl p-6 border border-cyan-500/40 space-y-3">
                        <div className="p-3.5 bg-space-900 rounded-xl border-l-4 border-purple-400"><strong className="text-purple-300 block">{fiveMastersData.gtd.altitude50k}</strong></div>
                        <div className="p-3.5 bg-space-900 rounded-xl border-l-4 border-indigo-400"><strong className="text-indigo-300 block">{fiveMastersData.gtd.altitude40k}</strong></div>
                        <div className="p-3.5 bg-space-900 rounded-xl border-l-4 border-cyan-400"><strong className="text-cyan-300 block">{fiveMastersData.gtd.altitude30k}</strong></div>
                        <div className="p-3.5 bg-space-900 rounded-xl border-l-4 border-emerald-400"><strong className="text-emerald-300 block">{fiveMastersData.gtd.altitude20k}</strong></div>
                        <div className="p-3.5 bg-space-900 rounded-xl border-l-4 border-gold-400"><strong className="text-gold-300 block">{fiveMastersData.gtd.altitude10k}</strong></div>
                        <div className="p-4 bg-cyan-950 rounded-2xl border-2 border-cyan-400 flex justify-between items-center">
                          <div>
                            <span className="text-cyan-400 font-bold text-xs block">오늘 3분 활성화 미션:</span>
                            <strong className="text-white text-base font-black">{fiveMastersData.gtd.runway}</strong>
                          </div>
                          <button onClick={() => { setTimerOn(true); playSound('pop'); }} className="px-4 py-2 rounded-xl bg-cyan-500 text-black font-black text-xs">⏱️ 3분 시작</button>
                        </div>
                      </div>
                    </div>
                  )}
                </section>
              </div>
            )}

            {/* 🌟 4. [행동연계] 탭 */}
            {mainNavTab === 'ACTION' && (
              <div className="flex-1 p-6 md:p-8 overflow-y-auto space-y-6 w-full max-w-5xl mx-auto" style={{ fontSize: `${actionPx}px` }}>
                <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                  <div>
                    <h2 className="text-xl md:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-gold-300 via-white to-amber-300">
                      ⚡ 5대 시스템 행동연계 관제탑 (Action Engine Hub)
                    </h2>
                    <p className="text-xs md:text-sm text-slate-300 mt-1">
                      분석된 원칙과 목표를 오늘 당장 3분 안에 실행 가능한 물리적 행동으로 즉각 전환
                    </p>
                  </div>
                  <FontController label="행동 글씨:" value={actionFontSize} onChange={setActionFontSize} />
                </div>

                <div className="space-y-6">
                  <div className="glass-box-active rounded-3xl p-8 border-2 border-cyan-400 shadow-2xl space-y-5">
                    <div className="flex items-center justify-between">
                      <span className="text-cyan-300 font-black text-base md:text-lg flex items-center gap-2">
                        <span>🚀</span> 오늘 지금 당장 3분 마이크로 실행 미션 (Runway)
                      </span>
                      <span className="text-xs font-mono px-3 py-1 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-400">
                        Immediate Action
                      </span>
                    </div>

                    <div className="bg-space-950 p-6 rounded-2xl border border-cyan-500/40">
                      <p className="text-white font-black text-lg md:text-xl leading-relaxed">
                        "{fiveMastersData.gtd.runway}"
                      </p>
                    </div>

                    <div className="flex flex-col sm:flex-row items-center justify-between gap-4 pt-2">
                      <div className="flex items-center gap-3">
                        <span className="text-sm text-slate-300 font-bold">남은 시간:</span>
                        <span className="text-3xl font-black font-mono text-gold-300 bg-space-900 px-4 py-1 rounded-xl border border-gold-500/40">
                          {Math.floor(timeLeft / 60)}:{(timeLeft % 60).toString().padStart(2, '0')}
                        </span>
                      </div>

                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => { setTimeLeft(180); setTimerOn(true); playSound('pop'); }}
                          className="px-6 py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-600 text-white font-black text-sm md:text-base hover:scale-105 transition shadow-lg shadow-cyan-500/40">
                          🚀 3분 타이머 시작
                        </button>
                        <button
                          onClick={() => { setTimerOn(false); playSound('pop'); }}
                          className="px-4 py-3 rounded-xl bg-space-800 hover:bg-space-700 text-slate-300 font-bold text-sm border border-slate-700">
                          정지
                        </button>
                      </div>
                    </div>
                  </div>

                  <div className="glass-box rounded-3xl p-6 border border-slate-800 space-y-3">
                    <span className="text-gold-300 font-black text-base flex items-center gap-2">
                      <span>⚡</span> 레이 달리오 If-Then 자동 방어 알고리즘
                    </span>
                    <p className="text-white font-bold text-base bg-space-900 p-4 rounded-xl leading-relaxed">
                      {fiveMastersData.dalio.ifThenRule}
                    </p>
                  </div>

                  <div className="glass-box rounded-3xl p-6 border border-slate-800 space-y-3">
                    <span className="text-emerald-400 font-black text-base flex items-center gap-2">
                      <span>📜</span> 나폴레온 힐 대가 지불 & 즉시 실행 서약
                    </span>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
                      <div className="p-4 bg-space-900 rounded-xl">
                        <span className="text-rose-400 font-bold block mb-1">포기할 대가 (Sacrifice):</span>
                        <p className="text-white font-bold">{fiveMastersData.hill.sacrifice}</p>
                      </div>
                      <div className="p-4 bg-space-900 rounded-xl">
                        <span className="text-emerald-400 font-bold block mb-1">실행 계획 (Action Plan):</span>
                        <p className="text-white font-bold">{fiveMastersData.hill.immediatePlan}</p>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* 3-Minute Stamp Complete Modal */}
          {showStampPopup && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-box-active rounded-3xl max-w-md w-full p-8 text-center border-2 border-cyan-400 shadow-2xl">
                <div className="w-20 h-20 rounded-full bg-emerald-500/20 text-emerald-400 mx-auto flex items-center justify-center mb-4">
                  <span className="text-4xl">🎉</span>
                </div>
                <h3 className="text-2xl font-black text-white mb-2">3분 미션 성공 완료!</h3>
                <p className="text-sm text-slate-200 mb-6 leading-relaxed">
                  오늘의 귀차니즘을 멋지게 이겨내셨어요!<br/>
                  <strong>5대 마스터 시스템</strong>에 실행 데이터가 안전하게 누적되었습니다.
                </p>
                <button
                  onClick={() => setShowStampPopup(false)}
                  className="w-full py-4 rounded-xl font-bold text-base bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-lg">
                  확인
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
