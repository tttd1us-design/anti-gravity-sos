<body class="bg-soft-pattern min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const playSound = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'cheer') {
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.05);
            gain.gain.setValueAtTime(0.05, ctx.currentTime + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.05 + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.05);
            osc.stop(ctx.currentTime + i * 0.05 + 0.2);
          });
        }
      } catch (e) {}
    };

    // 4대 소크라테스 질문 생성기
    const generateSocratic4Questions = (userText) => {
      const t = userText.toLowerCase();

      if (t.includes('책') || t.includes('글') || t.includes('출판') || t.includes('블로그') || t.includes('원고')) {
        return [
          { id: 'q1', slot: 'endState', pillar: '1. 본원적 가치 & 타겟 독자', title: '🎯 핵심 독자 정의', text: `이 책/글을 읽고 인생이 바뀔 '단 한 사람의 구체적인 타겟 독자(Persona)'는 누구인가요?` },
          { id: 'q2', slot: 'bottleneck', pillar: '2. 핵심 병목 & 두려움', title: '🛑 집필 마찰 요인', text: `글쓰기를 시작하려 할 때 가장 큰 저항(완벽주의, 목차 막막함, 시간 부족)은 무엇인가요?` },
          { id: 'q3', slot: 'leverage', pillar: '3. 차별화 레버리지', title: '💎 독점적 통찰', text: `기존 도서/콘텐츠와 차별화되는 당신만의 '실제 경험 수치 및 고유 프레임워크'는 무엇인가요?` },
          { id: 'q4', slot: 'microAction', pillar: '4. 3분 마이크로 실행', title: '⚡ 즉시 착수 미션', text: `지금 당장 3분 안에 마찰 없이 쓸 수 있는 '프롤로그의 첫 한 줄'은 무엇인가요?` }
        ];
      }

      if (t.includes('돈') || t.includes('수익') || t.includes('사업') || t.includes('매출') || t.includes('부업') || t.includes('월')) {
        return [
          { id: 'q1', slot: 'endState', pillar: '1. 수익 모델 & 가치 교환', title: '💰 고객의 지불 가치', text: `고객이 기꺼이 지갑을 열고 돈을 낼 수밖에 없는 '가장 절실한 고통(Pain Point)'은 무엇인가요?` },
          { id: 'q2', slot: 'bottleneck', pillar: '2. 핵심 병목 & 전환 마찰', title: '🛑 수익화 병목', text: `첫 1원 또는 첫 결제자를 확보하는 데 가장 큰 장애물(트래픽, 상품성, 설득력)은 무엇인가요?` },
          { id: 'q3', slot: 'leverage', pillar: '3. 레버리지 & 복리 구조', title: '📈 확장 메커니즘', text: `나의 시간을 직접 쓰지 않고도 24시간 작동할 수 있는 '자동화/시스템 레버리지'는 무엇인가요?` },
          { id: 'q4', slot: 'microAction', pillar: '4. 3분 마이크로 실행', title: '⚡ 즉시 착수 미션', text: `오늘 당장 3분 안에 잠재 고객에게 보여줄 수 있는 '한 줄 가치 제안(Value Proposition)'은 무엇인가요?` }
        ];
      }

      return [
        { id: 'q1', slot: 'endState', pillar: '1. 본원적 열망 (End-State)', title: '🎯 달성 후의 본질적 가치', text: `[${userText.substring(0, 15)}]이(가) 완벽히 실현되었을 때, 삶에서 얻게 되는 '가장 핵심적인 변화'는 무엇인가요?` },
        { id: 'q2', slot: 'bottleneck', pillar: '2. 심리적 저항 (Gravity Friction)', title: '🛑 시작을 막는 진짜 이유', text: `이 일을 시작하거나 지속하려 할 때, 무의식적으로 뒤로 미루게 만드는 '마음속 브레이크'는 무엇인가요?` },
        { id: 'q3', slot: 'leverage', pillar: '3. 전략적 레버리지 (Leverage)', title: '💎 성공 확률을 3배 높일 지렛대', text: `의지력에 의존하지 않고 환경과 시스템으로 자동 실행되게 만들 '단 하나의 안전장치'는 무엇인가요?` },
        { id: 'q4', slot: 'microAction', pillar: '4. 마이크로 실행 (Runway Action)', title: '⚡ 3분 활성화 미션', text: `실패가 물리적으로 불가능할 정도로 작은, '지금 당장 3분 안에 할 수 있는 최소 행동'은 무엇인가요?` }
      ];
    };

    function App() {
      // 폰트 배율
      const [fontSize, setFontSize] = useState(() => {
        return parseFloat(localStorage.getItem('AG_COMPACT_FONT') || '1.0');
      });

      // 좌우 화면 분할 비율
      const [leftWidthPercent, setLeftWidthPercent] = useState(() => {
        return parseFloat(localStorage.getItem('AG_SPLIT_PERCENT') || '50');
      });
      const [isDragging, setIsDragging] = useState(false);

      // 답변창(입력창) 높이
      const [inputHeightPx, setInputHeightPx] = useState(85);

      // 선택된 질문
      const [selectedQuestion, setSelectedQuestion] = useState(null);

      // 4대 질문 목록
      const [activeQuestions, setActiveQuestions] = useState(() => {
        return generateSocratic4Questions("월 100만 원 부업 수익 만들기");
      });

      // 🌟 우측 메인보드 5대 거장 프레임워크 탭 상태
      // 'PRINCIPLES' | 'NAC' | 'SECOND_BRAIN' | 'DCA' | 'GTD'
      const [activeMasterTab, setActiveMasterTab] = useState('PRINCIPLES');

      // 🌟 5대 프레임워크 심층 분석 데이터 저장소
      const [fiveMastersData, setFiveMastersData] = useState(() => {
        const saved = localStorage.getItem('AG_FIVE_MASTERS_V1');
        return saved ? JSON.parse(saved) : {
          // ① 레이 달리오 《원칙 (Principles)》 기계론적 5단계 & If-Then
          dalio: {
            goals: "월 100만 원 자동화 부업 파이프라인 확립",
            problems: "완벽주의로 인한 집필/기획 시작 지연 및 마찰",
            diagnosis5Why: "평가에 대한 두려움 ➔ 실패 회피 본능 ➔ 활성화 에너지 과다",
            systemDesign: "비공개 3분 마이크로 메모장 선작성 루프 설계",
            execution: "매일 아침 7시 타이머 3분 동안 단어 3개 기록",
            ifThenRule: "IF 기획을 앞두고 미루고 싶을 때, THEN 비공개 메모장에 3분간 단어 3개만 적는다."
          },
          // ② 토니 로빈스 《네 안에 잠든 거인을 깨워라》 NAC 신경연합조건화
          robbins: {
            coreDriver: "타인에게 종속되지 않는 경제적·시간적 절대 자립",
            painOfFailure: "현재의 삶에 안주하여 5년 뒤에도 후회와 피로를 반복하는 고통",
            pleasureOfSuccess: "원하는 시간에 원하는 프로젝트를 주도하며 얻는 성취감과 자유",
            valueHierarchy: ["자유 (Freedom)", "유능감 (Competence)", "성장 (Growth)", "안정 (Stability)"],
            powerQuestion: "이 목표를 달성함으로써 내 삶의 가치관 중 무엇이 가장 극대화되는가?"
          },
          // ③ 티아고 포르테 《세컨드 브레인》 CODE & PARA 체계
          forte: {
            projects: "2026 1인 지식 엔터프라이즈 런칭 (마감 90일)",
            areas: "지식 자산화 / 콘텐츠 시스템 / 건강 루틴",
            resources: "시장 조사 데이터, 프레임워크 템플릿, 고객 인터뷰 로그",
            archives: "완료된 이전 메모 및 아이디어 원초 스케치",
            distilledEssence: "고객의 진짜 페인포인트 1가지만 3분 안에 해결하는 최소 기능 제품(MVP)"
          },
          // ④ 나폴레온 힐 《생각하라 그리고 부자가 되어라》 DCA & 잠재의식 주입
          hill: {
            definiteChiefAim: "나는 2026년 12월 31일까지 1인 지식 시스템을 통해 월 100만 원의 지속적인 가치를 창출한다.",
            exactAmount: "월 100만 원 (연 1,200만 원 추가 수익)",
            deadline: "2026년 12월 31일",
            sacrifice: "퇴근 후 의미 없는 스마트폰 숏폼 시청 1시간 포기",
            immediatePlan: "매일 3분씩 핵심 지식 노하우를 구조화하여 기록",
            affirmationStatement: "나는 매일 더 명확해지고, 나의 실행은 무의식적인 습관이 되어 목표를 현실로 끌어당긴다."
          },
          // ⑤ 데이비드 앨런 《GTD》 6단계 수직 고도 모델
          gtd: {
            altitude50k: "50,000ft (존재 목적): 세상에 가치 있는 지식을 전달하고 온전한 자기 결정권을 누린다.",
            altitude40k: "40,000ft (3~5년 비전): 독립된 지식 크리에이터로서 자동화된 비즈니스 생태계 운영",
            altitude30k: "30,000ft (1~2년 중단기 목표): 첫 1,000명의 진성 구독자 확보 및 유료 파이프라인 안착",
            altitude20k: "20,000ft (책임 영역 Areas): 건강 유지, 지속적인 학습 및 집필, 비즈니스 파이프라인 관리",
            altitude10k: "10,000ft (현재 프로젝트): 첫 번째 지식 가이드북 초안 완성 (2주 스프린트)",
            runway: "지상 (Runway): 스마트폰 메모장에 아이디어 핵심 3단어 적기 (소요 3분)"
          }
        };
      });

      // 실시간 대화 및 답변 백업 로그
      const [qaBackupLogs, setQaBackupLogs] = useState(() => {
        const saved = localStorage.getItem('AG_QA_BACKUP_LOGS_V3');
        return saved ? JSON.parse(saved) : [
          {
            id: 1,
            type: 'GOAL',
            question: '🎯 나의 핵심 목표',
            answer: '월 100만 원 부업 수익 만들기',
            time: '기본 등록'
          }
        ];
      });

      // 3분 미션 타이머
      const [timeLeft, setTimeLeft] = useState(180);
      const [timerOn, setTimerOn] = useState(false);
      const [showStampPopup, setShowStampPopup] = useState(false);

      // 메시지 목록 (AI 성공 코치가 맨 위에서 시작)
      const [messages, setMessages] = useState([
        {
          id: 1,
          sender: 'coach',
          text: `안녕하세요! 반갑습니다 😊\n\n저는 당신의 대화를 **세계 5대 성공학 거장(레이 달리오, 토니 로빈스, 티아고 포르테, 나폴레온 힐, 데이비드 앨런)의 프레임워크로 실시간 분석·체계화**해 드리는 AI 성공 파트너예요.\n\n대화를 나누거나 아래 **4대 소크라테스 질문**에 답변하시면 우측 상단 5대 탭에 모든 분석이 실시간으로 구조화됩니다! 👇`,
          time: '지금'
        }
      ]);

      const [inputMsg, setInputMsg] = useState("");
      const [isThinking, setIsThinking] = useState(false);
      const chatEndRef = useRef(null);

      // 30분 연속 음성 인식 상태
      const [isRecording, setIsRecording] = useState(false);
      const [recordDuration, setRecordDuration] = useState(0);
      const recognitionRef = useRef(null);
      const isExplicitStopRef = useRef(false);
      const recordTimerRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('AG_FIVE_MASTERS_V1', JSON.stringify(fiveMastersData));
        localStorage.setItem('AG_QA_BACKUP_LOGS_V3', JSON.stringify(qaBackupLogs));
        localStorage.setItem('AG_SPLIT_PERCENT', leftWidthPercent.toString());
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [messages, fiveMastersData, qaBackupLogs, leftWidthPercent, fontSize, isRecording, recordDuration, selectedQuestion, inputHeightPx, activeMasterTab]);

      // 타이머 카운트다운
      useEffect(() => {
        let timer = null;
        if (timerOn && timeLeft > 0) {
          timer = setInterval(() => setTimeLeft(t => t - 1), 1000);
        } else if (timeLeft === 0 && timerOn) {
          setTimerOn(false);
          playSound('cheer');
          if (window.confetti) {
            window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
          }
          setShowStampPopup(true);
        }
        return () => clearInterval(timer);
      }, [timerOn, timeLeft]);

      // 음성 녹음 시간 카운터
      useEffect(() => {
        if (isRecording) {
          recordTimerRef.current = setInterval(() => {
            setRecordDuration(sec => sec + 1);
          }, 1000);
        } else {
          clearInterval(recordTimerRef.current);
          setRecordDuration(0);
        }
        return () => clearInterval(recordTimerRef.current);
      }, [isRecording]);

      // 가로 리사이징 마우스 드래그 핸들러
      const handleMouseDown = (e) => {
        setIsDragging(true);
      };

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!isDragging) return;
          const containerWidth = window.innerWidth;
          const newPercent = (e.clientX / containerWidth) * 100;
          if (newPercent >= 25 && newPercent <= 80) {
            setLeftWidthPercent(parseFloat(newPercent.toFixed(1)));
          }
        };

        const handleMouseUp = () => {
          setIsDragging(false);
        };

        if (isDragging) {
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);
        }
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [isDragging]);

      // Web Speech API 30분 연속 음성 인식
      const toggleVoiceRecording = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("현재 브라우저가 음성 인식을 지원하지 않습니다. Chrome 또는 Edge 브라우저를 사용해 주세요.");
          return;
        }

        if (isRecording) {
          isExplicitStopRef.current = true;
          setIsRecording(false);
          if (recognitionRef.current) recognitionRef.current.stop();
          playSound('pop');
        } else {
          isExplicitStopRef.current = false;
          playSound('pop');

          const recognition = new SpeechRecognition();
          recognition.lang = 'ko-KR';
          recognition.continuous = true;
          recognition.interimResults = true;

          recognition.onstart = () => {
            setIsRecording(true);
          };

          recognition.onresult = (event) => {
            for (let i = event.resultIndex; i < event.results.length; ++i) {
              if (event.results[i].isFinal) {
                const finalPiece = event.results[i][0].transcript.trim();
                setInputMsg(prev => (prev ? prev + " " : "") + finalPiece);
              }
            }
          };

          recognition.onerror = (event) => {
            if (event.error === 'not-allowed') {
              alert("마이크 권한을 허용해 주세요.");
              setIsRecording(false);
              isExplicitStopRef.current = true;
            }
          };

          recognition.onend = () => {
            if (!isExplicitStopRef.current) {
              try { recognition.start(); } catch (e) {}
            }
          };

          recognitionRef.current = recognition;
          try { recognition.start(); } catch (e) {}
        }
      };

      const changeFontSize = (scale) => {
        const val = Math.min(1.8, Math.max(0.8, parseFloat(scale.toFixed(1))));
        setFontSize(val);
        localStorage.setItem('AG_COMPACT_FONT', val.toString());
        playSound('pop');
      };

      const handleSelectQuestion = (q) => {
        setSelectedQuestion(q);
        playSound('pop');
      };

      // 전송 및 5대 프레임워크 실시간 동기화 분석 로직
      const sendChat = () => {
        const text = inputMsg.trim();
        if (!text || isThinking) return;

        if (isRecording) {
          isExplicitStopRef.current = true;
          setIsRecording(false);
          if (recognitionRef.current) recognitionRef.current.stop();
        }

        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        if (selectedQuestion) {
          const qObj = selectedQuestion;
          const userMsg = {
            id: Date.now(),
            sender: 'user',
            text: `[${qObj.title} 답변]\n${text}`,
            time: timeStr
          };

          setMessages(prev => [...prev, userMsg]);

          // 우측 하단 백업 로그 기록
          setQaBackupLogs(prev => [
            ...prev,
            {
              id: Date.now(),
              type: 'QNA',
              question: `${qObj.title}: ${qObj.text}`,
              answer: text,
              time: timeStr
            }
          ]);

          // 🌟 5대 거장 프레임워크 실시간 심층 분석 매핑
          setFiveMastersData(prev => {
            const next = { ...prev };
            if (qObj.slot === 'endState') {
              next.robbins.coreDriver = text;
              next.hill.definiteChiefAim = `2026년 중심 목표: [${text}] 완성`;
              next.gtd.altitude50k = `50,000ft (궁극적 가치): ${text}`;
              next.dalio.goals = text;
            } else if (qObj.slot === 'bottleneck') {
              next.dalio.problems = text;
              next.dalio.diagnosis5Why = `표면 저항: [${text}] ➔ 마찰 최소화 필요`;
              next.robbins.painOfFailure = `${text}를 극복하지 못할 경우 정체되는 고통`;
            } else if (qObj.slot === 'leverage') {
              next.dalio.ifThenRule = `IF [${text}] 레버리지 가동 시, THEN 실행 마찰을 제로화한다.`;
              next.forte.distilledEssence = `핵심 레버리지: ${text}`;
              next.gtd.altitude10k = `10,000ft 프로젝트: ${text} 기반 스프린트`;
            } else if (qObj.slot === 'microAction') {
              next.dalio.execution = text;
              next.gtd.runway = `지상 (Runway): ${text} (3분 착수)`;
              next.hill.immediatePlan = `오늘 당장 착수: ${text}`;
            }
            return next;
          });

          setInputMsg("");
          setSelectedQuestion(null);
          playSound('cheer');
          setIsThinking(true);

          setTimeout(() => {
            const coachMsg = {
              id: Date.now() + 1,
              sender: 'coach',
              text: `✅ **"${qObj.title}"**에 대한 답변이 분석되어 우측 상단 **5대 프레임워크(레이 달리오, 토니 로빈스, 티아고 포르테, 나폴레온 힐, 데이비드 앨런) 탭**에 실시간 구조화되었습니다! 🌟`,
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            setMessages(prev => [...prev, coachMsg]);
            setIsThinking(false);
          }, 400);

          return;
        }

        // 일반 목표/계획 입력인 경우
        const userMsg = {
          id: Date.now(),
          sender: 'user',
          text,
          time: timeStr
        };

        setMessages(prev => [...prev, userMsg]);
        
        setQaBackupLogs(prev => [
          ...prev,
          {
            id: Date.now(),
            type: 'STATEMENT',
            question: '💬 자유 발언 / 목표 기획',
            answer: text,
            time: timeStr
          }
        ]);

        setInputMsg("");
        playSound('pop');
        setIsThinking(true);

        setTimeout(() => {
          const questions = generateSocratic4Questions(text);
          setActiveQuestions(questions);

          // 5대 마스터 프레임워크 초기 동기화
          setFiveMastersData(prev => ({
            ...prev,
            dalio: {
              ...prev.dalio,
              goals: text,
              ifThenRule: `IF [${text}] 시작이 망설여질 때, THEN 3분 마이크로 액션을 먼저 수행한다.`
            },
            robbins: {
              ...prev.robbins,
              coreDriver: `${text}을 통한 자기 결정권과 성장`
            },
            forte: {
              ...prev.forte,
              projects: `[진행 중] ${text} 완성 프로젝트`
            },
            hill: {
              ...prev.hill,
              definiteChiefAim: `나는 2026년까지 [${text}]을(를) 완벽히 달성하여 가치를 창출한다.`
            },
            gtd: {
              ...prev.gtd,
              altitude30k: `30,000ft 중단기 목표: ${text}`,
              runway: `지상 Runway: ${text.substring(0, 15)} 3분 즉시 착수`
            }
          }));

          const coachMsg = {
            id: Date.now() + 1,
            sender: 'coach',
            text: `말씀해 주신 내용(**"${text.length > 20 ? text.substring(0, 20) + '…' : text}"**)을 바탕으로 **4대 소크라테스 질문** 및 **5대 거장 분석 탭**이 업데이트되었습니다. 질문을 클릭하여 답변해 보세요! 👇`,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };

          setMessages(prev => [...prev, coachMsg]);
          setIsThinking(false);
          playSound('pop');

      const downloadTextFile = (filename, content) => {
        const blob = new Blob([content], { type: 'text/markdown;charset=utf-8;' });

                    5대 거장 성공관리시스템

              <button 
                onClick={() => setLeftWidthPercent(60)}

              <button

              <button

                className={`px-2 py-1 rounded-lg transition text-xs ${leftWidthPercent === 40 ? 'bg-cyan-500 text-black font-extrabold' : 'hover:text-white'}`}>

            {/* Font Controller */}
            <div className="flex items-center space-x-1.5 bg-space-900 border border-slate-700 rounded-xl px-2.5 py-1 shadow-sm">
              <span className="text-[11px] font-bold text-slate-300 mr-0.5">글씨:</span>
              <button

                A-
              </button>
              <span className="text-xs font-bold font-mono text-cyan-300 px-1 min-w-[42px] text-center">
                {Math.round(fontSize * 100)}%
              </span>
              <button
                onClick={() => changeFontSize(fontSize + 0.1)}
                className="w-7 h-7 rounded-lg bg-space-800 hover:bg-space-700 text-slate-200 font-bold text-xs flex items-center justify-center border border-slate-700">
                A+
              </button>
            </div>
          </header>

          {/* Main Split Layout */}
          <div className="flex-1 flex overflow-hidden relative">
            
            {/* LEFT PANE: AI 성공코치 상단 ➔ 4대 질문 대화창 위 ➔ 높이조절 답변창 */}
            <section 
              className="flex flex-col bg-space-950/80 border-r border-cyan-500/10 relative overflow-hidden"
              style={{ width: `${leftWidthPercent}%` }}>
              
              {/* 🌟 1. [맨 위] AI 성공 코치 대화 영역 */}
              <div className="flex-1 overflow-y-auto p-4 space-y-4">
                {messages.map(m => (
                  <div key={m.id} className={`flex flex-col w-full ${m.sender === 'user' ? 'items-end' : 'items-start'}`}>
                    <div className="flex items-center gap-1.5 mb-1 px-1">
                      <span className="text-[11px] font-bold text-cyan-400">
                        {m.sender === 'coach' ? '🌱 AI 성공 코치' : '👤 나'}
                      </span>
                      <span className="text-[10px] text-slate-500">{m.time}</span>
                    </div>

                    <div className={`w-full max-w-[98%] rounded-2xl p-4 leading-relaxed shadow-md ${
                      m.sender === 'user'
                        ? 'bg-gradient-to-r from-cyan-950/90 to-indigo-950/95 border border-cyan-500/40 text-white rounded-tr-none'
                        : 'glass-box-active text-slate-100 border-l-4 border-l-cyan-400 rounded-tl-none'
                    }`} style={{ fontSize: `${currentFontPx}px`, lineHeight: '1.65' }}>
                      <p className="whitespace-pre-line font-medium">{m.text}</p>
                    </div>
                  </div>
                ))}

                {isThinking && (
                  <div className="flex items-center space-x-2 text-cyan-300 text-xs font-medium p-2.5 glass-box rounded-xl w-fit">
                    <i data-lucide="loader-2" className="w-3.5 h-3.5 animate-spin"></i>
                    <span>5대 거장 프레임워크로 실시간 분석하고 있어요...</span>
                  </div>
                )}
                <div ref={chatEndRef} />
              </div>

              {/* 🌟 2. [대화창 바로 위] 4대 전문 방향성 질문 카드 바 */}
              <div className="px-4 py-2 bg-space-900/95 border-t border-b border-cyan-500/20 shadow-md">
                <div className="flex items-center justify-between mb-1">
                  <span className="text-xs font-bold text-cyan-300 flex items-center gap-1">
                    <span>🧭</span> 4대 전문 방향성 질문 (클릭하여 아래 답변창에 작성):
                  </span>
                  <span className="text-[10px] font-mono text-gold-300 bg-space-850 px-2 py-0.5 rounded-full">
                    Socratic Question Cards
                  </span>
                </div>

                <div className="grid grid-cols-2 gap-1.5">
                  {activeQuestions.map((q, idx) => {
                    const isSelected = selectedQuestion?.id === q.id;
                    return (
                      <button
                        key={q.id}
                        onClick={() => handleSelectQuestion(q)}
                        className={`p-2 rounded-xl text-left border transition shadow-sm ${
                          isSelected 
                            ? 'bg-cyan-500/25 border-cyan-300 ring-2 ring-cyan-400/40' 
                            : 'bg-space-800 hover:bg-cyan-500/15 border-slate-700 hover:border-cyan-400'

                          <span className="text-[9.5px] text-slate-400 px-1 py-0.2 rounded bg-space-900">{idx + 1}</span>

                    );

                </div>
              </div>

              {/* 🌟 3. 선택된 질문 고정 바 */}
              {selectedQuestion && (
                <div className="px-4 py-1.5 bg-cyan-950/90 border-b border-cyan-400 flex items-center justify-between animate-fadeIn">
                  <div className="flex items-center gap-2">
                    <span className="text-base">🎯</span>
                    <div>
                      <div className="text-xs font-bold text-cyan-300 font-mono">선택된 질문: {selectedQuestion.title}</div>
                      <div className="text-xs font-medium text-white">{selectedQuestion.text}</div>
                    </div>
                  </div>
                  <button

                    className="text-xs text-slate-400 hover:text-white px-2 py-0.5 rounded bg-space-900 border border-slate-700">
                    취소 ✕
                  </button>
                </div>
              )}

              {/* Voice Floating Banner */}
              {isRecording && (
                <div className="px-5 py-1.5 bg-rose-950/90 border-t border-rose-500/40 flex items-center justify-between text-xs font-bold text-rose-200 animate-pulse">
                  <div className="flex items-center gap-2">
                    <span className="w-2 h-2 rounded-full bg-rose-500 mic-pulse inline-block"></span>
                    <span>🎙️ 30분 연속 음성 인식 중... (말씀하시면 실시간 입력됩니다)</span>
                  </div>
                  <div className="font-mono text-gold-300 bg-space-900 px-2 py-0.5 rounded-lg border border-rose-500/30">
                    ⏱️ {formatTime(recordDuration)} / 30:00+
                  </div>
                </div>
              )}

              {/* 🌟 4. [위아래 높이 조절 가능한 답변창] */}
              <div className="p-3 bg-space-900/95 border-t border-cyan-500/20">
                <form onSubmit={(e) => { e.preventDefault(); sendChat(); }} className="flex flex-col gap-2">
                  <textarea

                      <button

                        <i data-lucide={isRecording ? "mic-off" : "mic"} className="w-3.5 h-3.5"></i>
                        <span>{isRecording ? "녹음 중지" : "🎙️ 30분 음성"}</span>
                      </button>

                      <div className="flex items-center bg-space-800 rounded-xl border border-slate-700 p-0.5 text-xs font-bold text-slate-300">

                        <button

                        </button>
                        <button

                        </button>

            {/* RIGHT PANE: [상단: 5대 거장 프레임워크 탭 메인보드] & [하단: 실시간 대화 백업] */}

              className="flex-1 flex flex-col bg-space-950/95 overflow-hidden"
              style={{ width: `${100 - leftWidthPercent}%` }}>
              
              {/* 🌟 5. [우측 상단 55% 높이] 5대 거장 프레임워크 실시간 분석 메인보드 */}
              <div className="h-[56%] border-b-2 border-slate-800 p-3.5 flex flex-col overflow-hidden space-y-2.5">
                
                {/* 메인보드 헤더 & 다운로드 버튼 */}
                <div className="flex items-center justify-between pb-1">
                  <div className="flex items-center gap-1.5">
                    <span className="text-base">📊</span>
                    <h2 className="text-xs md:text-sm font-black text-white">5대 성공관리 마스터 분석 시스템</h2>
                  </div>
                  <button
                    onClick={() => {
                      const doc = `# 🌌 [Anti-Gravity 5대 거장 성공관리시스템 종합 분석]\n\n` +
                        `## ① 레이 달리오 《원칙 (Principles)》 기계론적 알고리즘\n- 목표: ${fiveMastersData.dalio.goals}\n- 문제 진단: ${fiveMastersData.dalio.problems}\n- 5-Whys 근본 원인: ${fiveMastersData.dalio.diagnosis5Why}\n- 의사결정 규칙: ${fiveMastersData.dalio.ifThenRule}\n- 실행: ${fiveMastersData.dalio.execution}\n\n` +
                        `## ② 토니 로빈스 《거인을 깨워라 (NAC)》 신경연합조건화\n- 잠재의식적 핵심 동기: ${fiveMastersData.robbins.coreDriver}\n- 미달성 시 고통: ${fiveMastersData.robbins.painOfFailure}\n- 달성 시 쾌락: ${fiveMastersData.robbins.pleasureOfSuccess}\n- 가치 계층: ${fiveMastersData.robbins.valueHierarchy.join(' > ')}\n\n` +
                        `## ③ 티아고 포르테 《세컨드 브레인》 PARA 체계\n- Projects: ${fiveMastersData.forte.projects}\n- Areas: ${fiveMastersData.forte.areas}\n- Resources: ${fiveMastersData.forte.resources}\n- 정제된 본질: ${fiveMastersData.forte.distilledEssence}\n\n` +
                        `## ④ 나폴레온 힐 《생각하라 부자가 되어라》 DCA\n- 중심 목표 (DCA): ${fiveMastersData.hill.definiteChiefAim}\n- 대가 (Sacrifice): ${fiveMastersData.hill.sacrifice}\n- 기한: ${fiveMastersData.hill.deadline}\n- 즉시 계획: ${fiveMastersData.hill.immediatePlan}\n\n` +
                        `## ⑤ 데이비드 앨런 《GTD》 6단계 수직 고도 모델\n- ${fiveMastersData.gtd.altitude50k}\n- ${fiveMastersData.gtd.altitude40k}\n- ${fiveMastersData.gtd.altitude30k}\n- ${fiveMastersData.gtd.altitude20k}\n- ${fiveMastersData.gtd.altitude10k}\n- ${fiveMastersData.gtd.runway}`;
                      downloadTextFile('5대_거장_성공관리시스템_종합분석.md', doc);
                    }}
                    className="px-2.5 py-1 rounded-lg font-bold text-xs bg-cyan-500/20 text-cyan-300 border border-cyan-400 hover:bg-cyan-500/30 flex items-center gap-1 shadow-sm">
                    <i data-lucide="download" className="w-3 h-3"></i>
                    <span>5대 마스터 다운로드</span>
                  </button>
                </div>

                {/* 🌟 메인보드 상단 5대 거장 탭 내비게이션 */}
                <div className="flex items-center gap-1 overflow-x-auto pb-1 border-b border-slate-800">
                  {[
                    { id: 'PRINCIPLES', label: '① 레이 달리오 (원칙)', icon: 'cpu' },
                    { id: 'NAC', label: '② 토니 로빈스 (NAC)', icon: 'zap' },
                    { id: 'SECOND_BRAIN', label: '③ 세컨드브레인 (PARA)', icon: 'database' },
                    { id: 'DCA', label: '④ 나폴레온 힐 (DCA)', icon: 'target' },
                    { id: 'GTD', label: '⑤ GTD (6단계 고도)', icon: 'plane' }
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => { setActiveMasterTab(tab.id); playSound('pop'); }}
                      className={`px-2.5 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap transition flex items-center gap-1 ${
                        activeMasterTab === tab.id
                          ? 'bg-cyan-500 text-black shadow-md font-black'
                          : 'bg-space-800 text-slate-300 hover:text-white border border-slate-750'
                      }`}>
                      <span>{tab.label}</span>
                    </button>
                  ))}
                </div>

                {/* 🌟 5개 탭별 동적 상세 분석 콘텐츠 */}
                <div className="flex-1 overflow-y-auto space-y-2 text-xs">
                  
                  {/* ① 레이 달리오 《원칙》 5단계 기계론적 프로세스 & If-Then */}
                  {activeMasterTab === 'PRINCIPLES' && (
                    <div className="space-y-2">
                      <div className="glass-box-active rounded-xl p-3 border border-cyan-400/40">
                        <span className="text-cyan-300 block font-bold text-xs mb-1">⚡ Ray Dalio If-Then 의사결정 알고리즘</span>
                        <p className="text-white font-bold text-xs bg-space-900 p-2 rounded-lg border border-slate-800">
                          {fiveMastersData.dalio.ifThenRule}
                        </p>
                      </div>

                      <div className="glass-box rounded-xl p-3 border border-slate-800 space-y-1.5">
                        <span className="text-slate-300 font-bold block text-xs">⚙️ 기계론적 5단계 루프 (Machine Loop)</span>
                        <div className="grid grid-cols-1 gap-1 text-[11.5px]">
                          <div className="p-1.5 bg-space-900 rounded-lg">
                            <span className="text-cyan-400 font-bold">1. 목표(Goals):</span> {fiveMastersData.dalio.goals}
                          </div>
                          <div className="p-1.5 bg-space-900 rounded-lg">
                            <span className="text-rose-400 font-bold">2. 문제(Problems):</span> {fiveMastersData.dalio.problems}
                          </div>
                          <div className="p-1.5 bg-space-900 rounded-lg">
                            <span className="text-purple-400 font-bold">3. 5-Whys 원인(Diagnosis):</span> {fiveMastersData.dalio.diagnosis5Why}
                          </div>
                          <div className="p-1.5 bg-space-900 rounded-lg">
                            <span className="text-gold-400 font-bold">4. 시스템 설계(Design):</span> {fiveMastersData.dalio.systemDesign}
                          </div>
                          <div className="p-1.5 bg-space-900 rounded-lg">
                            <span className="text-emerald-400 font-bold">5. 실행(Execution):</span> {fiveMastersData.dalio.execution}
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* ② 토니 로빈스 《네 안에 잠든 거인을 깨워라》 NAC 신경연합조건화 */}

                    <div className="space-y-2">
                      <div className="glass-box rounded-xl p-3 border border-rose-500/30 space-y-1.5">
                        <span className="text-rose-300 font-bold text-xs block">🔥 무의식적 핵심 욕망 & 가치 계층 (Value Hierarchy)</span>
                        <div className="p-2 bg-space-900 rounded-lg">
                          <span className="text-slate-400 block text-[10.5px]">심층 동기 (Core Driver):</span>
                          <strong className="text-rose-200">{fiveMastersData.robbins.coreDriver}</strong>
                        </div>
                        <div className="flex gap-1.5 text-[11px] font-mono">
                          {fiveMastersData.robbins.valueHierarchy.map((v, i) => (
                            <span key={i} className="px-2 py-0.5 rounded bg-space-900 text-gold-300 border border-slate-800">
                              #{i + 1} {v}
                            </span>
                          ))}
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-2 text-[11px]">
                        <div className="glass-box rounded-xl p-2.5 border border-rose-500/40">
                          <span className="text-rose-400 font-bold block mb-0.5">🛑 미달성 시 고통 (Pain)</span>
                          <p className="text-slate-200">{fiveMastersData.robbins.painOfFailure}</p>
                        </div>
                        <div className="glass-box rounded-xl p-2.5 border border-emerald-500/40">
                          <span className="text-emerald-400 font-bold block mb-0.5">✨ 달성 시 쾌락 (Pleasure)</span>
                          <p className="text-slate-200">{fiveMastersData.robbins.pleasureOfSuccess}</p>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* ③ 티아고 포르테 《세컨드 브레인》 CODE & PARA 체계 */}
                  {activeMasterTab === 'SECOND_BRAIN' && (
                    <div className="space-y-2">
                      <div className="glass-box rounded-xl p-3 border border-purple-500/30 space-y-1.5">
                        <div className="flex justify-between items-center text-xs font-bold text-purple-300">
                          <span>📂 PARA 지식 체계화 모델</span>
                          <span className="text-[10px] font-mono text-purple-400">CODE Framework</span>
                        </div>
                        <div className="grid grid-cols-2 gap-1.5 text-[11px]">
                          <div className="p-2 bg-space-900 rounded-lg border border-purple-500/30">
                            <span className="text-purple-300 font-bold block">Projects (핵심 목표):</span>
                            <span className="text-slate-200">{fiveMastersData.forte.projects}</span>
                          </div>
                          <div className="p-2 bg-space-900 rounded-lg border border-slate-800">
                            <span className="text-slate-400 font-bold block">Areas (관리 영역):</span>
                            <span className="text-slate-200">{fiveMastersData.forte.areas}</span>
                          </div>
                          <div className="p-2 bg-space-900 rounded-lg border border-slate-800">
                            <span className="text-slate-400 font-bold block">Resources (지식 자원):</span>
                            <span className="text-slate-200">{fiveMastersData.forte.resources}</span>
                          </div>
                          <div className="p-2 bg-space-900 rounded-lg border border-slate-800">
                            <span className="text-slate-400 font-bold block">Archives (보관소):</span>
                            <span className="text-slate-200">{fiveMastersData.forte.archives}</span>
                          </div>
                        </div>
                      </div>

                      <div className="p-2.5 bg-space-900 rounded-xl border border-cyan-500/30 text-[11px]">
                        <span className="text-cyan-300 font-bold block mb-0.5">💎 정제된 본질 (Distilled Essence):</span>
                        <p className="text-slate-200">{fiveMastersData.forte.distilledEssence}</p>
                      </div>
                    </div>
                  )}

                  {/* ④ 나폴레온 힐 《생각하라 그리고 부자가 되어라》 DCA & 무의식 주입 */}
                  {activeMasterTab === 'DCA' && (
                    <div className="space-y-2">
                      <div className="glass-box-active rounded-xl p-3 border-2 border-gold-400/50 space-y-1.5">
                        <span className="text-gold-300 font-bold text-xs block">🧭 명확한 중심 목표 (Definite Chief Aim: DCA)</span>
                        <p className="text-white font-extrabold text-xs leading-relaxed bg-space-900 p-2.5 rounded-lg border border-gold-500/40">
                          "{fiveMastersData.hill.definiteChiefAim}"
                        </p>
                      </div>

                      <div className="grid grid-cols-2 gap-1.5 text-[11px]">
                        <div className="p-2 bg-space-900 rounded-lg border border-slate-800">
                          <span className="text-gold-400 font-bold block">💰 명확한 목표/금액:</span>
                          <span className="text-slate-200">{fiveMastersData.hill.exactAmount}</span>
                        </div>
                        <div className="p-2 bg-space-900 rounded-lg border border-slate-800">
                          <span className="text-gold-400 font-bold block">⏳ 달성 기한:</span>
                          <span className="text-slate-200">{fiveMastersData.hill.deadline}</span>
                        </div>
                        <div className="p-2 bg-space-900 rounded-lg border border-slate-800">
                          <span className="text-rose-400 font-bold block">⚖️ 지불할 대가 (Sacrifice):</span>
                          <span className="text-slate-200">{fiveMastersData.hill.sacrifice}</span>
                        </div>
                        <div className="p-2 bg-space-900 rounded-lg border border-slate-800">
                          <span className="text-emerald-400 font-bold block">🚀 즉시 실행 계획:</span>
                          <span className="text-slate-200">{fiveMastersData.hill.immediatePlan}</span>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* ⑤ 데이비드 앨런 《GTD》 6단계 수직 고도 모델 */}
                  {activeMasterTab === 'GTD' && (
                    <div className="space-y-1.5">
                      <div className="glass-box rounded-xl p-2.5 border border-cyan-500/30 space-y-1 text-[11px]">
                        <span className="text-cyan-300 font-bold block text-xs mb-1">🛫 6단계 고도 모델 (Horizons of Focus)</span>
                        <div className="p-1.5 bg-space-900 rounded border-l-2 border-purple-400">
                          <strong className="text-purple-300">{fiveMastersData.gtd.altitude50k}</strong>
                        </div>
                        <div className="p-1.5 bg-space-900 rounded border-l-2 border-indigo-400">
                          <strong className="text-indigo-300">{fiveMastersData.gtd.altitude40k}</strong>
                        </div>
                        <div className="p-1.5 bg-space-900 rounded border-l-2 border-cyan-400">
                          <strong className="text-cyan-300">{fiveMastersData.gtd.altitude30k}</strong>
                        </div>
                        <div className="p-1.5 bg-space-900 rounded border-l-2 border-emerald-400">
                          <strong className="text-emerald-300">{fiveMastersData.gtd.altitude20k}</strong>
                        </div>
                        <div className="p-1.5 bg-space-900 rounded border-l-2 border-gold-400">
                          <strong className="text-gold-300">{fiveMastersData.gtd.altitude10k}</strong>
                        </div>
                        <div className="p-2 bg-cyan-950/80 rounded border border-cyan-400 flex justify-between items-center">
                          <strong className="text-cyan-200">{fiveMastersData.gtd.runway}</strong>
                          <button
                            onClick={() => { setTimerOn(true); playSound('pop'); }}
                            className="px-2 py-0.5 rounded bg-cyan-500 text-black font-black text-xs">
                            3분 시작
                          </button>
                        </div>
                      </div>
                    </div>
                  )}

                </div>

              </div>

              {/* 🌟 6. [우측 하단 44% 높이] 실시간 대화 & 답변 백업 기록 (상시 확인 및 다운로드) */}
              <div className="flex-1 p-3.5 overflow-y-auto space-y-2 bg-space-900/60">
                <div className="flex items-center justify-between border-b border-slate-800 pb-1.5">
                  <div className="flex items-center gap-1.5">
                    <span className="text-sm">📒</span>
                    <h3 className="text-xs md:text-sm font-bold text-emerald-400">실시간 대화 & 답변 백업 기록</h3>
                  </div>
                  <button
                    onClick={() => {
                      const doc = `# 📒 [Anti-Gravity 대화 & 답변 실시간 백업 로그]\n\n` +
                        qaBackupLogs.map((log, idx) => `### ${idx + 1}. [${log.type}] ${log.question} (${log.time})\n- 답변 내용: ${log.answer}\n`).join('\n');
                      downloadTextFile('대화내용_답변_백업로그.md', doc);
                    }}
                    className="px-2 py-0.5 rounded-lg font-bold text-xs bg-emerald-500/20 text-emerald-300 border border-emerald-400 hover:bg-emerald-500/30 flex items-center gap-1 shadow-sm">
                    <i data-lucide="download" className="w-3 h-3"></i>
                    <span>백업 다운로드 (.md)</span>
                  </button>
                </div>

                <div className="space-y-1.5 w-full">
                  {qaBackupLogs.map((log, idx) => (
                    <div key={log.id} className="w-full p-2.5 rounded-xl bg-space-850 border border-slate-800 space-y-0.5">
                      <div className="flex justify-between items-center text-[10px] text-slate-400">
                        <span className="font-bold text-cyan-300 font-mono">#{idx + 1} {log.question}</span>
                        <span>{log.time}</span>
                      </div>
                      <p className="text-xs text-slate-100 font-medium whitespace-pre-line leading-relaxed">
                        {log.answer}
                      </p>
                    </div>
                  ))}
                </div>
              </div>

            </aside>

          </div>

          {/* 3-Minute Stamp Complete Modal */}
          {showStampPopup && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-box-active rounded-3xl max-w-md w-full p-6 text-center border-2 border-cyan-400 shadow-2xl">
                <div className="w-16 h-16 rounded-full bg-emerald-500/20 text-emerald-400 mx-auto flex items-center justify-center mb-3">
                  <span className="text-3xl">🎉</span>
                </div>
                <h3 className="text-xl font-black text-white mb-1.5">3분 미션 성공 완료!</h3>
                <p className="text-xs text-slate-200 mb-5 leading-relaxed">
                  오늘의 귀차니즘을 멋지게 이겨내셨어요!<br/>
                  오른편 <strong>5대 마스터 시스템</strong>에 실행 데이터가 안전하게 누적되었습니다.
                </p>
                <button
                  onClick={() => setShowStampPopup(false)}
                  className="w-full py-3 rounded-xl font-bold text-sm bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-lg">
                  확인
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
