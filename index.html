<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>안티그레비티 (AG-OS) - 나를 학습하는 개인 성공관리 AI</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            space: {
              950: '#030508',
              900: '#070B12',
              850: '#0D1422',
              800: '#141E33',
              700: '#1D2A47',
            },
            cyan: {
              300: '#67E8F9',
              400: '#22D3EE',
              500: '#06B6D4',
              glow: '#00F0FF',
            },
            gold: {
              300: '#FDE047',
              400: '#FACC15',
              500: '#EAB308',
              glow: '#FFD700',
            }
          },
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #030508;
      color: #F8FAFC;
      font-family: 'Pretendard', sans-serif;
      overflow-x: hidden;
      font-size: 18px;
      line-height: 1.75;
      transition: font-size 0.15s ease;
    }
    
    .bg-soft-pattern {
      background-image: 
        linear-gradient(to right, rgba(34, 211, 238, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(34, 211, 238, 0.03) 1px, transparent 1px);
      background-size: 36px 36px;
    }
    
    .glass-box {
      background: rgba(13, 20, 34, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid rgba(34, 211, 238, 0.22);
    }

    .glass-box-active {
      background: rgba(13, 20, 34, 0.96);
      backdrop-filter: blur(22px);
      border: 2px solid rgba(0, 240, 255, 0.55);
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.18);
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #070B12;
    }
    ::-webkit-scrollbar-thumb {
      background: #1D2A47;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00F0FF;
    }
  </style>
</head>
<body class="bg-soft-pattern min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const playSound = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.06);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.06);
        } else if (type === 'cheer') {
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.06);
            gain.gain.setValueAtTime(0.06, ctx.currentTime + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.06 + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.06);
            osc.stop(ctx.currentTime + i * 0.06 + 0.25);
          });
        }
      } catch (e) {}
    };

    // --- 기분 선택 칩 ---
    const MOODS = [
      { id: 'tired', icon: '😫', label: '힘들어요' },
      { id: 'neutral', icon: '😐', label: '그냥요' },
      { id: 'okay', icon: '🙂', label: '괜찮아요' },
      { id: 'fire', icon: '🔥', label: '하고싶어요' }
    ];

    // --- 카테고리 칩 ---
    const CATEGORIES = [
      { id: 'work', icon: '💼', label: '일/업무' },
      { id: 'study', icon: '📖', label: '공부/시험' },
      { id: 'money', icon: '💰', label: '부업/돈' },
      { id: 'health', icon: '🏃', label: '운동/건강' },
      { id: 'write', icon: '✍️', label: '글쓰기/책' },
      { id: 'etc', icon: '💬', label: '기타' }
    ];

    function App() {
      // 폰트 배율 (기본 1.6)
      const [fontSize, setFontSize] = useState(() => {
        return parseFloat(localStorage.getItem('AG_V1_FONT') || '1.6');
      });

      // 탭: 'COACH'(대화), 'TIMER'(3분 타이머), 'MANUAL'(성공 매뉴얼)
      const [activeTab, setActiveTab] = useState('COACH');

      // 3대 핵심 상태 축 (Clarity, Friction, Momentum)
      const [metrics, setMetrics] = useState(() => {
        const saved = localStorage.getItem('AG_V1_METRICS');
        return saved ? JSON.parse(saved) : {
          clarity: 82,     // 방향 (0~100)
          friction: 35,    // 저항 (0~100, 낮을수록 가벼움)
          momentum: 74,    // 실행탄력 (0~100)
          selectedMood: null,
          selectedCategory: null,
          currentGoal: '월 100만 원 부업 수익 만들기',
          realBlocker: '완성도에 대한 부담으로 시작을 미루는 완벽주의',
          microAction: '스마트폰 메모장을 열고 상품 아이디어 단어 3개만 적기',
          completedToday: false
        };
      });

      // 3분 타이머
      const [timeLeft, setTimeLeft] = useState(180);
      const [timerOn, setTimerOn] = useState(false);
      const [showModal, setShowModal] = useState(false);

      // 메시지
      const [messages, setMessages] = useState([
        {
          id: 1,
          sender: 'ai',
          text: `안녕하세요! 반갑습니다 😊\n\n저는 당신이 **'왜 자꾸 미루는지 원인을 찾아주고, 지금 당장 할 수 있는 가장 작은 행동을 정해주는 AI'**예요.\n\n오늘 기분이나 시작하고 싶은 일을 위에서 가볍게 선택해 보세요!`,
          time: '지금'
        }
      ]);
      const [inputMsg, setInputMsg] = useState("");
      const [isThinking, setIsThinking] = useState(false);
      const chatEndRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('AG_V1_METRICS', JSON.stringify(metrics));
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [messages, metrics, activeTab, fontSize]);

      useEffect(() => {
        let timer = null;
        if (timerOn && timeLeft > 0) {
          timer = setInterval(() => setTimeLeft(t => t - 1), 1000);
        } else if (timeLeft === 0 && timerOn) {
          setTimerOn(false);
          playSound('cheer');
          if (window.confetti) {
            window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
          }
          setMetrics(prev => ({
            ...prev,
            momentum: Math.min(100, prev.momentum + 12),
            friction: Math.max(10, prev.friction - 20),
            completedToday: true
          }));
          setShowModal(true);
        }
        return () => clearInterval(timer);
      }, [timerOn, timeLeft]);

      const changeFontSize = (scale) => {
        const val = Math.min(2.4, Math.max(1.1, parseFloat(scale.toFixed(1))));
        setFontSize(val);
        localStorage.setItem('AG_V1_FONT', val.toString());
        playSound('pop');
      };

      const sendChat = (textToSend) => {
        const text = (textToSend || inputMsg).trim();
        if (!text || isThinking) return;

        const userMsg = {
          id: Date.now(),
          sender: 'user',
          text,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setMessages(prev => [...prev, userMsg]);
        setInputMsg("");
        playSound('pop');
        setIsThinking(true);

        setTimeout(() => {
          let reply = "";
          if (messages.length === 1) {
            reply = `알려주셔서 고마워요! 👏\n\n그런데 그 일을 하려고 할 때, 머리로는 해야 한다고 생각하면서도 자꾸 유튜브를 보거나 딴짓을 하게 만드는 **'진짜 속마음'**은 무엇인가요?\n\n- [1] 잘하려다 보니 시작이 두려워서\n- [2] 양이 너무 많고 막막해서\n- [3] 실패하면 속상할까 봐\n- [4] 그냥 피곤해서\n\n편하게 번호나 생각나는 문장을 적어주세요.`;
            setMetrics(prev => ({ ...prev, currentGoal: text }));
          } else if (messages.length === 3) {
            reply = `그 마음 충분히 이해해요. 완벽하게 잘하고 싶은 마음이 크다 보니 시작 순간의 심리적 부담감(저항)이 높아진 거예요.\n\n그렇다면 오늘 그 일을 다 끝내려 하지 마세요!\n\n**'${metrics.microAction}'**만 해보겠습니다.\n\n상단의 **[⏱️ 3분 시작 타이머]**를 누르고 3분만 가볍게 해볼까요? 3분 후엔 바로 덮으셔도 됩니다! 😊`;
            setMetrics(prev => ({ ...prev, realBlocker: text, friction: 20, clarity: 90 }));
            playSound('cheer');
            if (window.confetti) {
              window.confetti({ particleCount: 70, spread: 60, origin: { y: 0.65 } });
            }
          } else {
            reply = `아주 훌륭해요! 3분으로 시작한 작은 행동이 뇌의 저항을 허물고 자연스러운 집중으로 이어집니다. 당신의 성공 패턴을 기록장에 저장했어요! 🌟`;
          }

          const aiMsg = {
            id: Date.now() + 1,
            sender: 'ai',
            text: reply,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };

          setMessages(prev => [...prev, aiMsg]);
          setIsThinking(false);
        }, 450);
      };

      const currentFontPx = Math.max(18, 14 * fontSize);

      return (
        <div className="flex flex-col h-screen max-h-screen">
          
          {/* Header */}
          <header className="h-24 border-b border-cyan-500/20 glass-box px-4 md:px-8 flex items-center justify-between z-20">
            
            <div className="flex items-center space-x-4">
              <div className="w-12 h-12 md:w-14 md:h-14 rounded-2xl bg-gradient-to-br from-cyan-400 via-indigo-600 to-purple-600 flex items-center justify-center shadow-lg shadow-cyan-500/30">
                <span className="text-3xl">🌱</span>
              </div>
              <div>
                <div className="flex items-center gap-2.5">
                  <h1 className="text-xl md:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-white to-gold-300 tracking-tight">
                    안티그레비티 OS
                  </h1>
                  <span className="text-sm font-bold px-3 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/40">
                    v1.0
                  </span>
                </div>
                <p className="text-sm md:text-base text-slate-300 font-medium">나를 학습하고 변화시키는 개인 성공관리 AI</p>
              </div>
            </div>

            {/* Navigation Tabs */}
            <nav className="hidden md:flex items-center space-x-2 bg-space-900 border border-slate-800 rounded-2xl p-1.5">
              {[
                { id: 'COACH', label: '💬 AI 원인 코칭', icon: 'message-square' },
                { id: 'TIMER', label: '⏱️ 3분 시작 타이머', icon: 'zap' },
                { id: 'MANUAL', label: '📘 My Success Manual', icon: 'book-open' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => { setActiveTab(tab.id); playSound('pop'); }}
                  className={`px-4 py-2.5 rounded-xl text-sm md:text-base font-bold flex items-center gap-2 transition ${
                    activeTab === tab.id
                      ? 'bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-md shadow-cyan-500/30'
                      : 'text-slate-300 hover:text-white hover:bg-space-800'
                  }`}>
                  <i data-lucide={tab.icon} className="w-5 h-5"></i>
                  <span>{tab.label}</span>
                </button>
              ))}
            </nav>

            {/* Font Controller */}
            <div className="flex items-center space-x-2 bg-space-900 border border-slate-700 rounded-2xl px-3 py-1.5 shadow-md">
              <span className="text-sm font-bold text-slate-300 mr-1 hidden sm:inline">글씨 크기:</span>
              
              <button
                onClick={() => changeFontSize(fontSize - 0.2)}
                title="글씨 작게"
                className="w-9 h-9 rounded-xl bg-space-800 hover:bg-space-700 text-slate-200 font-bold text-base flex items-center justify-center transition border border-slate-700">
                A-
              </button>
              
              <span className="text-sm md:text-base font-bold font-mono text-cyan-300 px-2 min-w-[55px] text-center">
                {Math.round(fontSize * 100)}%
              </span>
              
              <button
                onClick={() => changeFontSize(fontSize + 0.2)}
                title="글씨 크게"
                className="w-9 h-9 rounded-xl bg-space-800 hover:bg-space-700 text-slate-200 font-bold text-base flex items-center justify-center transition border border-slate-700">
                A+
              </button>

              <div className="hidden lg:flex items-center gap-1.5 border-l border-slate-800 pl-2 ml-1">
                {[
                  { label: '보통', scale: 1.3 },
                  { label: '크게', scale: 1.6 },
                  { label: '아주크게', scale: 2.0 }
                ].map(p => (
                  <button
                    key={p.scale}
                    onClick={() => changeFontSize(p.scale)}
                    className={`px-2.5 py-1 text-sm font-bold rounded-lg transition ${
                      Math.abs(fontSize - p.scale) < 0.15 ? 'bg-cyan-400 text-black font-extrabold' : 'text-slate-300 hover:text-white bg-space-800'
                    }`}>
                    {p.label}
                  </button>
                ))}
              </div>
            </div>

          </header>

          {/* Main Layout */}
          <div className="flex-1 flex overflow-hidden">
            
            {/* TAB 1: AI COACH */}
            {activeTab === 'COACH' && (
              <div className="flex-1 flex overflow-hidden">
                
                {/* Chat Section */}
                <section className="flex-1 flex flex-col bg-space-950/80 border-r border-cyan-500/10 relative">
                  
                  {/* 3-Axis Status Bar */}
                  <div className="bg-space-900/95 border-b border-cyan-500/10 px-6 py-3 flex flex-wrap items-center justify-between gap-3 text-sm md:text-base font-medium">
                    <div className="flex items-center gap-4">
                      <span className="flex items-center gap-1.5 text-cyan-300">
                        🎯 <strong>방향:</strong> {metrics.clarity}%
                      </span>
                      <span className="flex items-center gap-1.5 text-rose-300">
                        🧱 <strong>저항:</strong> {metrics.friction}%
                      </span>
                      <span className="flex items-center gap-1.5 text-emerald-300">
                        🚀 <strong>탄력:</strong> {metrics.momentum}%
                      </span>
                    </div>
                    <div className="text-slate-300 text-xs md:text-sm font-bold">
                      💡 <strong>핵심:</strong> 오늘 딱 3분 미션으로 시작 비용을 제거합니다
                    </div>
                  </div>

                  {/* Message Stream */}
                  <div className="flex-1 overflow-y-auto p-5 md:p-8 space-y-7">
                    {messages.map(m => (
                      <div key={m.id} className={`flex flex-col ${m.sender === 'user' ? 'items-end' : 'items-start'}`}>
                        <div className="flex items-center gap-2 mb-1.5 px-1">
                          <span className="text-sm font-bold text-cyan-400">
                            {m.sender === 'ai' ? '🌱 안티그레비티 코치' : '👤 나'}
                          </span>
                          <span className="text-xs text-slate-400">{m.time}</span>
                        </div>

                        <div className={`max-w-[94%] md:max-w-[88%] rounded-3xl p-6 leading-relaxed shadow-lg ${
                          m.sender === 'user'
                            ? 'bg-gradient-to-r from-cyan-950/90 to-indigo-950/95 border-2 border-cyan-500/40 text-white rounded-tr-none'
                            : 'glass-box-active text-slate-100 border-l-[6px] border-l-cyan-400 rounded-tl-none'
                        }`} style={{ fontSize: `${currentFontPx}px`, lineHeight: '1.75' }}>
                          <p className="whitespace-pre-line font-medium">{m.text}</p>
                        </div>
                      </div>
                    ))}

                    {isThinking && (
                      <div className="flex items-center space-x-3 text-cyan-300 text-base font-medium p-4 glass-box rounded-2xl w-fit">
                        <i data-lucide="loader-2" className="w-5 h-5 animate-spin"></i>
                        <span>당신의 미루는 원인을 분석하고 있어요...</span>
                      </div>
                    )}
                    <div ref={chatEndRef} />
                  </div>

                  {/* 1초 무공백 스타터 칩 (1턴째) */}
                  {messages.length === 1 && (
                    <div className="px-5 md:px-8 py-4 bg-space-900/95 border-t border-cyan-500/20 space-y-3">
                      
                      {/* Mood Picker */}
                      <div>
                        <span className="text-xs md:text-sm font-bold text-slate-300 block mb-1.5">오늘 마음 상태:</span>
                        <div className="flex flex-wrap gap-2">
                          {MOODS.map(m => (
                            <button
                              key={m.id}
                              onClick={() => {
                                setMetrics(prev => ({ ...prev, selectedMood: m.label }));
                                playSound('pop');
                              }}
                              className={`px-3.5 py-1.5 rounded-xl text-sm font-bold border transition ${
                                metrics.selectedMood === m.label
                                  ? 'bg-cyan-500 text-black border-cyan-400 font-extrabold shadow-md'
                                  : 'bg-space-800 text-slate-200 border-slate-700 hover:border-cyan-400'
                              }`}>
                              {m.icon} {m.label}
                            </button>
                          ))}
                        </div>
                      </div>

                      {/* Category Chips */}
                      <div>
                        <span className="text-xs md:text-sm font-bold text-slate-300 block mb-1.5">어떤 일을 시작하고 싶나요?</span>
                        <div className="grid grid-cols-3 md:grid-cols-6 gap-2">
                          {CATEGORIES.map(c => (
                            <button
                              key={c.id}
                              onClick={() => sendChat(`[${c.label}] 관련해서 해야 하는데 자꾸 미루고 있어요.`)}
                              className="p-2.5 rounded-xl bg-space-800 hover:bg-cyan-500/20 text-center border border-slate-700 hover:border-cyan-400 transition shadow-sm">
                              <span className="text-lg block mb-0.5">{c.icon}</span>
                              <span className="text-xs md:text-sm font-bold text-slate-100">{c.label}</span>
                            </button>
                          ))}
                        </div>
                      </div>

                    </div>
                  )}

                  {/* Input Box */}
                  <div className="p-5 md:p-6 bg-space-900/95 border-t border-cyan-500/20">
                    <form onSubmit={(e) => { e.preventDefault(); sendChat(); }} className="relative flex items-center">
                      <textarea
                        rows="2"
                        value={inputMsg}
                        onChange={(e) => setInputMsg(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            sendChat();
                          }
                        }}
                        placeholder="해야 하는데 미루고 있는 일을 편하게 적어주세요..."
                        className="w-full bg-space-950 border-2 border-slate-700 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400 rounded-2xl px-6 py-4 text-white placeholder-slate-400 focus:outline-none resize-none pr-32 font-sans leading-relaxed"
                        style={{ fontSize: `${currentFontPx}px` }}
                      />
                      <button
                        type="submit"
                        disabled={!inputMsg.trim() || isThinking}
                        className={`absolute right-3.5 bottom-4 px-6 py-3 rounded-xl font-bold text-base flex items-center gap-2 transition ${
                          inputMsg.trim() && !isThinking
                            ? 'bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-lg shadow-cyan-500/40 hover:scale-105'
                            : 'bg-space-800 text-slate-500 cursor-not-allowed'
                        }`}>
                        <span>전송</span>
                        <i data-lucide="send" className="w-5 h-5"></i>
                      </button>
                    </form>
                  </div>
                </section>

                {/* Right Side Status Panel */}
                <aside className="hidden lg:flex w-4/12 flex-col bg-space-950/90 p-7 space-y-6 overflow-y-auto">
                  
                  {/* Today 3-Min Action Card */}
                  <div className="glass-box-active rounded-3xl p-7 border-2 border-cyan-400/40 text-center">
                    <span className="inline-block text-sm font-bold text-cyan-300 bg-cyan-500/20 px-3.5 py-1.5 rounded-full mb-3.5">
                      ⚡ 오늘의 최소 실행 양자 (3분 미션)
                    </span>
                    <p className="text-lg md:text-xl font-bold text-white mb-5 leading-snug">
                      "{metrics.microAction}"
                    </p>
                    <button
                      onClick={() => { setActiveTab('TIMER'); playSound('pop'); }}
                      className="w-full py-4 rounded-2xl font-black text-base bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-lg hover:scale-105 transition flex items-center justify-center gap-2">
                      <i data-lucide="play" className="w-5 h-5"></i>
                      <span>지금 3분 타이머 켜기</span>
                    </button>
                  </div>

                  {/* 3-Axis Metric Breakdown */}
                  <div className="glass-box rounded-3xl p-6 border border-slate-800 space-y-4">
                    <h3 className="text-base font-bold text-slate-200">나의 현재 성공 3대 축</h3>

                    <div className="space-y-3">
                      <div>
                        <div className="flex justify-between text-xs md:text-sm font-bold mb-1">
                          <span className="text-cyan-300">🎯 방향 (Clarity)</span>
                          <span>{metrics.clarity}%</span>
                        </div>
                        <div className="w-full bg-space-900 h-2.5 rounded-full overflow-hidden">
                          <div className="bg-cyan-400 h-full" style={{ width: `${metrics.clarity}%` }}></div>
                        </div>
                      </div>

                      <div>
                        <div className="flex justify-between text-xs md:text-sm font-bold mb-1">
                          <span className="text-rose-300">🧱 시작 저항 (Friction)</span>
                          <span>{metrics.friction}%</span>
                        </div>
                        <div className="w-full bg-space-900 h-2.5 rounded-full overflow-hidden">
                          <div className="bg-rose-400 h-full" style={{ width: `${metrics.friction}%` }}></div>
                        </div>
                      </div>

                      <div>
                        <div className="flex justify-between text-xs md:text-sm font-bold mb-1">
                          <span className="text-emerald-300">🚀 실행 탄력 (Momentum)</span>
                          <span>{metrics.momentum}%</span>
                        </div>
                        <div className="w-full bg-space-900 h-2.5 rounded-full overflow-hidden">
                          <div className="bg-emerald-400 h-full" style={{ width: `${metrics.momentum}%` }}></div>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* AI Learning Observation Box */}
                  <div className="glass-box rounded-3xl p-6 border border-slate-800 space-y-2">
                    <span className="text-xs font-bold text-purple-400 block font-mono">AI OBSERVATION & LEARNING</span>
                    <p className="text-xs md:text-sm text-slate-300 leading-relaxed">
                      "당신은 큰 과제를 마주할 때 완성도 기준이 높아져 시작을 미루는 경향이 78%의 확률로 관찰되었습니다. 따라서 '비공개 3분 초안 적기'가 가장 효과적입니다."
                    </p>
                  </div>

                </aside>

              </div>
            )}

            {/* TAB 2: 3-MINUTE TIMER */}
            {activeTab === 'TIMER' && (
              <section className="flex-1 flex flex-col items-center justify-center p-6 text-center bg-space-950/90">
                <div className="max-w-lg w-full glass-box-active rounded-3xl p-10 border-2 border-cyan-400/50 shadow-2xl">
                  
                  <span className="inline-block text-sm font-bold text-cyan-300 bg-cyan-500/20 px-4 py-1.5 rounded-full mb-4">
                    ⏱️ 심리적 진입장벽 제로화
                  </span>

                  <h2 className="text-xl md:text-2xl font-black text-white mb-3 leading-relaxed">
                    "{metrics.microAction}"
                  </h2>
                  <p className="text-sm md:text-base text-slate-300 mb-8">
                    완벽하게 끝내지 않아도 됩니다. 딱 3분 동안만 미완성 상태로 시작해 보세요!
                  </p>

                  <div className="bg-space-900 py-8 rounded-3xl border-2 border-cyan-500/30 mb-8 shadow-inner">
                    <span className="text-6xl md:text-7xl font-black font-mono text-cyan-300 tracking-wider">
                      {Math.floor(timeLeft / 60)}:{(timeLeft % 60).toString().padStart(2, '0')}
                    </span>
                  </div>

                  {!timerOn ? (
                    <button
                      onClick={() => { setTimerOn(true); playSound('pop'); }}
                      className="w-full py-4 rounded-2xl font-black text-lg bg-gradient-to-r from-cyan-500 via-indigo-600 to-purple-600 text-white shadow-xl shadow-cyan-500/40 hover:scale-105 transition flex items-center justify-center gap-2">
                      <i data-lucide="play" className="w-6 h-6"></i>
                      <span>⏱️ 3분 타이머 시작하기</span>
                    </button>
                  ) : (
                    <div className="flex gap-4">
                      <button
                        onClick={() => { setTimerOn(false); playSound('pop'); }}
                        className="flex-1 py-4 rounded-2xl font-bold text-base bg-space-800 hover:bg-space-700 text-slate-200 border border-slate-700 transition">
                        잠깐 멈춤
                      </button>
                      <button
                        onClick={() => setTimeLeft(0)}
                        className="flex-1 py-4 rounded-2xl font-bold text-base bg-emerald-600 hover:bg-emerald-500 text-white transition">
                        ✓ 완료했어요!
                      </button>
                    </div>
                  )}
                </div>
              </section>
            )}

            {/* TAB 3: MY SUCCESS MANUAL (14-DAY REVERSE ENGINEERING) */}
            {activeTab === 'MANUAL' && (
              <section className="flex-1 overflow-y-auto p-6 md:p-12 max-w-5xl mx-auto space-y-7">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-2xl md:text-3xl font-black text-white">📘 My Success Manual (개인 성공 매뉴얼)</h2>
                    <p className="text-sm md:text-base text-slate-300 mt-1">대화와 실제 행동 데이터를 학습하여 도출된 나만의 성공 알고리즘입니다.</p>
                  </div>
                  <button
                    onClick={() => {
                      const doc = `# 📘 My Success Manual (나만의 성공 매뉴얼)\n\n1. 나는 [새로운 프로젝트를 시작할 때]\n   [완성도에 대한 과도한 기대와 평가 공포] 때문에 멈추는 경향이 있습니다.\n\n2. 그럴 때는 [계획을 더 세우기보다]\n   ['비공개 1인 모드에서 3분간 거친 초안 적기'] 방식으로 시작하는 것이 85%의 확률로 효과적이었습니다.\n\n3. 나에게 가장 잘 맞는 첫 행동 단위는\n   ['스마트폰 메모장을 켜고 단어 3개 메모']입니다.\n\n4. 나의 절대 행동 원칙:\n   "완벽하게 끝내려 하지 말고, 3분 동안 미완성 상태를 시작한다."`;
                      const blob = new Blob([doc], { type: 'text/markdown;charset=utf-8;' });
                      const url = URL.createObjectURL(blob);
                      const a = document.createElement('a');
                      a.href = url;
                      a.download = `My_Success_Manual.md`;
                      a.click();
                      playSound('cheer');
                    }}
                    className="px-5 py-3 rounded-xl font-bold text-sm md:text-base bg-cyan-500/20 text-cyan-300 border border-cyan-400 hover:bg-cyan-500/30 flex items-center gap-2 shadow-md">
                    <i data-lucide="download" className="w-5 h-5"></i>
                    <span>매뉴얼 마크다운 저장</span>
                  </button>
                </div>

                {/* Manual Box */}
                <div className="glass-box-active rounded-3xl p-8 border-2 border-cyan-400/40 space-y-6">
                  <div className="p-5 bg-space-900 rounded-2xl border border-slate-800">
                    <span className="text-xs font-bold text-slate-400 block mb-1">1. 나의 반복 정지 패턴 (Pattern)</span>
                    <p className="text-base font-semibold text-rose-300 leading-relaxed">
                      "새로운 목표를 시작할 때, 완성도에 대한 과도한 기대와 평가 공포로 인해 시작을 지연시키는 패턴이 발견되었습니다."
                    </p>
                  </div>

                  <div className="p-5 bg-space-900 rounded-2xl border border-slate-800">
                    <span className="text-xs font-bold text-slate-400 block mb-1">2. 가장 효과적인 시작 방식 (Best Strategy)</span>
                    <p className="text-base font-semibold text-cyan-300 leading-relaxed">
                      "계획을 더 세우기보다 '비공개 1인 로컬 모드에서 3분간 초안 적기'로 시작했을 때 완수율이 85% 상승했습니다."
                    </p>
                  </div>

                  <div className="p-5 bg-space-900 rounded-2xl border border-slate-800">
                    <span className="text-xs font-bold text-slate-400 block mb-1">3. 나만의 1등 절대 행동 원칙 (Personal Rule)</span>
                    <p className="text-lg font-bold text-gold-300 leading-relaxed">
                      "완벽하게 끝내려 하지 말고, 3분 동안 미완성 상태를 견디며 시작한다."
                    </p>
                  </div>
                </div>
              </section>
            )}

          </div>

          {/* Modal */}
          {showModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-box-active rounded-3xl max-w-md w-full p-8 text-center border-2 border-cyan-400 shadow-2xl">
                <div className="w-20 h-20 rounded-full bg-emerald-500/20 text-emerald-400 mx-auto flex items-center justify-center mb-4">
                  <span className="text-4xl">🎉</span>
                </div>
                <h3 className="text-2xl font-black text-white mb-2">3분 미션 완료!</h3>
                <p className="text-base text-slate-200 mb-6 leading-relaxed">
                  오늘의 시작 저항을 멋지게 돌파하셨어요!<br/>
                  <strong>실행 탄력(Momentum) +12%</strong>가 적립되었습니다.
                </p>

                <button
                  onClick={() => setShowModal(false)}
                  className="w-full py-4 rounded-xl font-bold text-base bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-lg">
                  확인
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
