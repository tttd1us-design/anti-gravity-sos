    const { useState, useEffect, useRef } = React;

    // --- Web Audio Synthesizer ---
    const playAudio = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (type === 'tick') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(750, ctx.currentTime);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.06);
        } else if (type === 'stage') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(320, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(850, ctx.currentTime + 0.16);
          gain.gain.setValueAtTime(0.07, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.22);
        } else if (type === 'celebrate') {
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.05);
            gain.gain.setValueAtTime(0.06, ctx.currentTime + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.05 + 0.22);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.05);
            osc.stop(ctx.currentTime + i * 0.05 + 0.22);
          });
        }
      } catch (e) {}
    };

    // --- PIPELINE STAGES ---

        { id: 3, text: '오늘 당장 10분 내 착수할 수 있는 최소 단위 실행 착수', completed: false, timestamp: '오늘 중' },

        },

        },

          rule: "50,000피트 존재 이유를 복기하고 현재 활주로(Runway)의 1순위 태스크에만 시야를 좁힌다",
          tag: "MINDSET",
          date: "2026-08-31"
        }
      ]
    };

    function processSocraticStep(userInput, currentData, messageHistory) {
      const text = userInput.trim();
      let updated = JSON.parse(JSON.stringify(currentData));
      let reply = "";

      if (updated.dialogueDepth === 1) {
        updated.dialogueDepth = 2;
        updated.pipelineStage = 'STAGE_1';
        reply = `당신의 발화 속에서 감지된 핵심 열망은 **'스스로 설계한 시스템을 통해 현실의 불확실성을 통제하고 대체 불가능한 성취를 증명하는 것'**입니다.\n\n이것을 백데이터 1호 코어 욕망으로 등록했습니다.\n\n그렇다면 질문합니다. 이 목표를 현실로 만들었을 때 당신이 느끼게 될 **'가장 순수한 내면의 쾌감'**은 무엇이며, 반대로 지금껏 이것을 가로막아온 **'내부의 가장 익숙한 핑계나 두려움(Gravity)'**은 무엇입니까?`;
        
        updated.desires.unshift({
          id: Date.now(),
          label: `발굴된 핵심 열망: "${text.slice(0, 35)}..." 기반 자기결정권`,
          weight: 95,
          category: 'DISCOVERED'
        });
      } else if (updated.dialogueDepth === 2) {
        updated.dialogueDepth = 3;
        updated.pipelineStage = 'STAGE_2';
        reply = `당신의 무의식 속에 잠재되어 있던 **'내면의 저항(Gravity)'**이 데이터로 포착되었습니다. 저항을 직면하는 순간 그것은 더 이상 무의식적 장애물이 아닌 통제 가능한 변수가 됩니다.\n\n이제 [2단계: 데이터 축적 및 패턴화]로 진입하여 모호한 열망을 나폴레온 힐의 **명확한 중심 목표(DCA)** 공식으로 수렴시킵니다.\n\n당신이 정확히 몇 년 몇 월까지 달성할 **'측정 가능한 정량적 수치(자산, 매출, 출시, 유저 수)'**는 얼마이며, 이를 위해 기꺼이 포기할 **'기회비용(유흥, 안주, 나태)'**은 무엇입니까?`;
        
        updated.gravityFrictions.unshift({
          id: Date.now(),
          label: `포착된 저항 패턴: ${text.slice(0, 40)}...`,
          severity: 'HIGH'
        });
      } else if (updated.dialogueDepth === 3) {
        updated.dialogueDepth = 4;
        updated.pipelineStage = 'STAGE_3';
        reply = `명확한 중심 목표(DCA)가 백데이터 엔진에 수식화되어 저장되었습니다.\n\n이제 [3단계: 행동 원칙 및 실행 엔진]을 가동합니다. 50,000피트의 거대한 목표를 오늘의 물리적 'Runway(활주로)'로 수직 정렬합니다.\n\n오늘 당신이 당장 10분 이내에 물리적으로 착수하여 끝낼 수 있는 **'단 하나의 1순위 최소 단위 행동(Runway Next Action)'**을 선언하십시오.`;
        
        updated.dca.statement = text.length > 15 ? text : updated.dca.statement;
        updated.horizons.runway = `오늘 즉시 착수할 1순위 행동: ${text.slice(0, 35)}`;
        updated.runwayTasks.push({
          id: Date.now(),
          text: `[선언된 Runway 액션] ${text.slice(0, 45)}`,
          completed: false,
          timestamp: '오늘 즉시'
        });
      } else {
        updated.dialogueDepth = 5;
        updated.pipelineStage = 'STAGE_3';
        reply = `훌륭합니다! 소크라테스식 탐색 ➔ 백데이터 구조화 ➔ 실행 엔진 정렬의 3단계 파이프라인 1회차 루프가 성공적으로 완료되었습니다.\n\n성공은 기분이 아니라 **'If-Then 의사결정 알고리즘'**의 누적으로 완성됩니다. 방금 도출된 원칙을 시스템 원칙집에 영구 기록했습니다.\n\n우측 대시보드에서 백데이터 맵을 확인하시고, 지금 즉시 활주로(Runway)의 1순위 행동을 실행하십시오!`;
        
        updated.principles.unshift({
          id: Date.now(),
          condition: `[트리거 상황] 실행이 지연되거나 불확실성을 마주할 때`,
          rule: `타협하지 않고 사전에 정의된 DCA와 Runway 2분 행동으로 즉각 돌입한다 (${text.slice(0, 30)})`,
          tag: 'ALGORITHM',
          date: new Date().toISOString().split('T')[0]
        });
      }

      return { reply, updated };
    }

    function App() {
      const [backdata, setBackdata] = useState(() => {
        const saved = localStorage.getItem('AG_SMS_BACKDATA_V2');
        return saved ? JSON.parse(saved) : DEFAULT_BACKDATA;
      });

      const [messages, setMessages] = useState([
        {
          id: 'init-1',
          sender: 'system',
          text: `안티그레비티 성공관리시스템(AG-SMS) 코어 엔진에 접속하셨습니다.\n\n이 시스템은 3단계 파이프라인('소크라테스식 탐색' ➔ '백데이터 축적/패턴화' ➔ '행동원칙 실행엔진')으로 작동합니다.\n\n당신이 현재 가장 강렬하게 원하지만, 아직 명확한 숫자로 정의하지 못했거나 직면을 미루고 있는 **'가장 중요한 목표 1가지'**는 무엇입니까?`,
          timestamp: new Date().toLocaleTimeString()
        }
      ]);

      const [inputText, setInputText] = useState("");
      const [activeTab, setActiveTab] = useState('pipeline');
      const [isThinking, setIsThinking] = useState(false);
      const [fontSizeScale, setFontSizeScale] = useState(backdata.fontSizeScale || 2.0);
      const [showGitHubModal, setShowGitHubModal] = useState(false);
      const chatScrollRef = useRef(null);

      useEffect(() => {
        const updated = { ...backdata, fontSizeScale };
        localStorage.setItem('AG_SMS_BACKDATA_V2', JSON.stringify(updated));
        chatScrollRef.current?.scrollIntoView({ behavior: 'smooth' });
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [messages, backdata, activeTab, fontSizeScale]);

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!inputText.trim() || isThinking) return;

        const userMsg = {
          id: `u-${Date.now()}`,
          sender: 'user',
          text: inputText.trim(),
          timestamp: new Date().toLocaleTimeString()
        };

        setMessages(prev => [...prev, userMsg]);
        const currentInput = inputText.trim();
        setInputText("");
        playAudio('tick');
        setIsThinking(true);

        setTimeout(() => {
          const { reply, updated } = processSocraticStep(currentInput, backdata, messages);
          setBackdata(updated);

          const systemMsg = {
            id: `s-${Date.now()}`,
            sender: 'system',
            text: reply,
            timestamp: new Date().toLocaleTimeString()
          };

          setMessages(prev => [...prev, systemMsg]);
          setIsThinking(false);

          if (updated.dialogueDepth >= 4) {
            playAudio('celebrate');
            if (window.confetti) {
              window.confetti({ particleCount: 80, spread: 70, origin: { y: 0.65 } });
            }
          } else {
            playAudio('stage');
          }
        }, 500);
      };

      const toggleRunwayTask = (id) => {
        setBackdata(prev => ({
          ...prev,
          runwayTasks: prev.runwayTasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t)
        }));
        playAudio('tick');
      };

      const exportSuccessReport = () => {
        const doc = `# 🚀 ANTI-GRAVITY 개인 맞춤형 성공관리시스템 (AG-SMS) 백데이터 보고서
생성 시각: ${new Date().toLocaleString()}
GitHub 저장소: https://github.com/${backdata.githubRepo}

### 2. 내면의 저항 및 중력 요인 (Gravity Friction)

                    <button 
                      onClick={() => {
                        const condition = prompt("원칙의 발생 상황(IF)을 입력하십시오 (예: 피로로 인해 집중이 흐트러질 때)");
                        const rule = condition ? prompt("이에 대응할 실행 규칙(THEN)을 입력하십시오 (예: 2분 딥워크 루틴으로 강제 진입한다)") : null;
                        if (condition && rule) {
                          setBackdata(prev => ({
                            ...prev,
                            principles: [{ id: Date.now(), condition, rule, tag: 'CUSTOM', date: new Date().toISOString().split('T')[0] }, ...prev.principles]
                          }));
                          playAudio('tick');
                        }
                      }}
                      className="px-3.5 py-1.5 text-xs font-mono font-bold bg-cyan-500/25 text-cyan-300 border border-cyan-500/50 rounded-xl hover:bg-cyan-500/40">
                      + 신규 원칙
                    </button>
                  </div>

                  <div className="space-y-4">
                    {backdata.principles.map((p, idx) => (
                      <div key={p.id || idx} className="glass-panel p-5 rounded-2xl border border-slate-800 hover:border-cyan-500/40 transition">
                        <div className="flex items-center justify-between text-xs font-mono text-slate-400 mb-2.5">
                          <span className="px-2.5 py-0.5 rounded-md bg-space-900 text-cyan-400 font-bold">ALGORITHM #{idx + 1}</span>
                          <span>[{p.tag}] {p.date}</span>
                        </div>
                        <div className="space-y-2.5">
                          <div className="bg-space-900/90 p-3.5 rounded-xl border border-slate-800">
                            <span className="text-slate-500 font-mono block text-xs mb-1 font-bold">IF (트리거 상황 / 감정)</span>
                            <span className="text-rose-300 font-medium text-base">{p.condition}</span>
                          </div>
                          <div className="bg-space-900/90 p-3.5 rounded-xl border border-cyan-500/30">
                            <span className="text-cyan-400 font-mono block text-xs mb-1 font-bold">THEN (기계적 실행 알고리즘)</span>
                            <span className="text-cyan-100 font-bold leading-relaxed text-base">{p.rule}</span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

            </aside>
          </div>

          {/* GitHub Sync Modal */}
          {showGitHubModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-panel-glow rounded-3xl max-w-lg w-full p-6 border-2 border-cyan-500/50 shadow-2xl">
                <div className="flex items-center justify-between mb-4">
                  <div className="flex items-center gap-2.5">
                    <i data-lucide="github" className="w-6 h-6 text-white"></i>
                    <h3 className="text-lg font-bold font-mono text-white">GitHub 저장소 연동 상태</h3>
                  </div>
                  <button onClick={() => setShowGitHubModal(false)} className="text-slate-400 hover:text-white">
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                <div className="space-y-4 text-sm font-mono">
                  <div className="bg-space-900 p-4 rounded-2xl border border-slate-800">
                    <span className="text-xs text-slate-500 block mb-1">연동된 원격 저장소 (Remote URL)</span>
                    <a href={`https://github.com/${backdata.githubRepo}`} target="_blank" rel="noreferrer" className="text-cyan-400 font-bold hover:underline break-all">
                      https://github.com/{backdata.githubRepo}
                    </a>
                  </div>

                  <div className="bg-space-900 p-4 rounded-2xl border border-slate-800">
                    <span className="text-xs text-slate-500 block mb-1">로컬 Git 상태</span>
                    <p className="text-emerald-400 font-bold">✓ Git 초기화 및 커밋 완료 (Branch: main)</p>
                    <p className="text-slate-400 text-xs mt-1">소크라테스 대화 데이터와 백데이터가 GitHub에 영구 동기화됩니다.</p>
                  </div>

                  <button
                    onClick={() => {
                      exportSuccessReport();
                      setShowGitHubModal(false);
                      alert("GitHub에 동기화할 최신 성공 보고서 Markdown이 다운로드되었습니다.");
                    }}
                    className="w-full py-3 rounded-xl font-bold bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-lg shadow-cyan-500/30 hover:opacity-90">
                    최신 보고서 MD 내보내기 & 확인
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
