<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANTI-GRAVITY OS (AG-OS) - 누구나 쉽게 쓰는 성공 OS</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=JetBrains+Mono:wght@400;600;700&family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            space: {
              950: '#030508',
              900: '#070B12',
              850: '#0D1422',
              800: '#141E33',
              700: '#1D2A47',
              600: '#2A3C63',
            },
            cyan: {
              400: '#22D3EE',
              500: '#06B6D4',
              glow: '#00F0FF',
            },
            gold: {
              400: '#FACC15',
              500: '#EAB308',
              glow: '#FFD700',
            },
            gravity: {
              red: '#FF3366',
              purple: '#8B5CF6',
              emerald: '#10B981'
            }
          },
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
            serif: ['Cinzel', 'serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #030508;
      color: #F1F5F9;
      font-family: 'Pretendard', sans-serif;
      overflow-x: hidden;
      transition: font-size 0.2s ease;
    }
    
    .bg-grid-pattern {
      background-image: 
        linear-gradient(to right, rgba(34, 211, 238, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(34, 211, 238, 0.04) 1px, transparent 1px);
      background-size: 36px 36px;
    }
    
    .glass-panel {
      background: rgba(13, 20, 34, 0.85);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(34, 211, 238, 0.2);
    }

    .glass-panel-glow {
      background: rgba(13, 20, 34, 0.94);
      backdrop-filter: blur(22px);
      border: 1.5px solid rgba(0, 240, 255, 0.5);
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.15);
    }

    .neon-border-cyan {
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3), inset 0 0 20px rgba(0, 240, 255, 0.15);
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #070B12;
    }
    ::-webkit-scrollbar-thumb {
      background: #1D2A47;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00F0FF;
    }
  </style>
</head>
<body class="bg-grid-pattern min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Web Audio Synthesizer ---
    const playAudio = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (type === 'tick') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(750, ctx.currentTime);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'magic') {
          [440, 554.37, 659.25, 880].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.06);
            gain.gain.setValueAtTime(0.05, ctx.currentTime + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.06 + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.06);
            osc.stop(ctx.currentTime + i * 0.06 + 0.2);
          });
        } else if (type === 'bell') {
          [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.06);
            gain.gain.setValueAtTime(0.06, ctx.currentTime + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.06 + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.06);
            osc.stop(ctx.currentTime + i * 0.06 + 0.25);
          });
        }
      } catch (e) {}
    };

    // --- QUICK CHIPS (일반인용 1초 답변 버튼) ---
    const GOAL_CHIPS = [
      { id: 'diet', label: '🏋️ 다이어트 / 매일 운동', text: '올해 5kg 감량하고 매일 20분씩 운동하는 습관을 만들고 싶어요.' },
      { id: 'side', label: '💰 월 100만원 부업 벌기', text: '월급 외에 부업이나 자동화 수익으로 월 100만 원을 더 벌고 싶어요.' },
      { id: 'exam', label: '📚 자격증 / 시험 합격', text: '올해 안에 목표로 하는 자격증 시험에 꼭 합격하고 싶어요.' },
      { id: 'sns', label: '📱 유튜브 / 블로그 시작', text: '나만의 콘텐츠로 유튜브나 블로그를 꾸준히 운영하고 싶어요.' },
      { id: 'job', label: '💼 이직 / 포트폴리오 완성', text: '더 좋은 조건의 회사로 이직하기 위해 포트폴리오를 완성하고 싶어요.' }
    ];

    const EXCUSE_CHIPS = [
      { label: '완벽하게 하려다 시작을 못 해요', text: '완벽하게 준비해서 잘하고 싶은 마음에 자꾸 시작을 미루게 돼요.' },
      { label: '막막해서 어디서부터 할지 몰라요', text: '양이 너무 많고 막막해서 어디서부터 손대야 할지 엄두가 안 나요.' },
      { label: '실패하면 창피할까 봐 두려워요', text: '열심히 했는데 결과가 안 좋거나 남들에게 비판받을까 봐 두려워요.' },
      { label: '퇴근하고 오면 기운이 없어서 폰만 봐요', text: '하루 종일 일하고 오면 에너지가 다 떨어져서 유튜브 쇼츠만 보게 돼요.' }
    ];

    function App() {
      // Font Scale (1.0 = 100%, 1.3 = 130%, 1.6 = 160%, 2.0 = 200%)
      const [fontScale, setFontScale] = useState(() => {
        const saved = localStorage.getItem('AG_FONT_SCALE');
        return saved ? parseFloat(saved) : 1.6; // 기본값을 아주 편안하고 큰 1.6x로 설정
      });

      // View Mode: 'EASY' (일반인/초심자용) vs 'PRO' (전문가/공학용)
      const [viewMode, setViewMode] = useState('EASY');

      // Mind State
      const [mindState, setMindState] = useState({
        burdenScore: 85, // 시작하기 귀찮은 정도 (0~100)
        fearScore: 78,   // 실패 걱정 점수 (0~100)
        momentum: 1,     // 연속 달성 횟수
        todayMission: "스마트폰 메모장을 열고 제목 딱 1줄만 적기",
        isEasyModeActive: false,
        streakDays: 3
      });

      // Timer state
      const [timerSeconds, setTimerSeconds] = useState(180); // 3분 타이머
      const [isTimerRunning, setIsTimerRunning] = useState(false);

      // Chat Messages
      const [messages, setMessages] = useState([
        {
          id: 'msg-1',
          sender: 'coach',
          text: `안녕하세요! 반갑습니다 😊\n\n저는 당신이 **'귀찮음과 두려움'을 이겨내고 원하는 목표를 쉽게 이루도록 돕는 든든한 AI 성공 코치**예요.\n\n거창한 계획을 세워도 자꾸 미루게 되는 건 당신이 게을러서가 아니라, 뇌가 마음에 큰 부담을 느끼기 때문이에요!\n\n현재 가장 이루고 싶은 목표가 무엇인가요? 아래 버튼을 누르시거나 편하게 말씀해 주세요.`,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }
      ]);

      const [inputText, setInputText] = useState("");
      const [isThinking, setIsThinking] = useState(false);
      const chatEndRef = useRef(null);

      // Save Font Scale
      const handleFontScaleChange = (newScale) => {
        const clamped = Math.min(2.5, Math.max(1.0, parseFloat(newScale.toFixed(1))));
        setFontScale(clamped);
        localStorage.setItem('AG_FONT_SCALE', clamped.toString());
        playAudio('tick');
      };

      // Timer Effect
      useEffect(() => {
        let interval = null;
        if (isTimerRunning && timerSeconds > 0) {
          interval = setInterval(() => {
            setTimerSeconds(prev => prev - 1);
          }, 1000);
        } else if (timerSeconds === 0 && isTimerRunning) {
          setIsTimerRunning(false);
          playAudio('bell');
          if (window.confetti) {
            window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          }
          alert("🎉 3분 집중 미션 완료! 오늘의 성공 도장을 획득하셨습니다!");
          setMindState(prev => ({
            ...prev,
            burdenScore: Math.max(10, prev.burdenScore - 40),
            momentum: prev.momentum + 1
          }));
        }
        return () => clearInterval(interval);
      }, [isTimerRunning, timerSeconds]);

      useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [messages, viewMode, fontScale]);

      // Message Handling
      const handleSendMessage = (textToSend) => {
        const text = (textToSend || inputText).trim();
        if (!text || isThinking) return;

        const userMsg = {
          id: `u-${Date.now()}`,
          sender: 'user',
          text,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setMessages(prev => [...prev, userMsg]);
        setInputText("");
        playAudio('tick');
        setIsThinking(true);

        setTimeout(() => {
          let reply = "";
          if (messages.length === 1) {
            reply = `좋은 목표예요! 그런데 이 목표를 시작하려고 할 때, 마음에 브레이크가 걸리거나 자꾸 딴짓을 하게 만드는 **'진짜 속마음(이유)'**은 무엇인가요?\n\n솔직하게 아래 버튼을 선택해 보세요.`;
            setMindState(prev => ({ ...prev, burdenScore: 75 }));
          } else if (messages.length === 3) {
            reply = `맞아요, 그 마음 100% 이해해요! 😊\n\n완벽하게 잘하고 싶은 마음이 크다 보니 뇌가 너무 큰 에너지가 든다고 착각해서 시작을 망설이는 거예요.\n\n그래서 지금 이 순간, **'마음 편한 3분 초간단 시작 모드'**를 선물해 드릴게요!\n\n오늘 딱 3분 동안만 **"${mindState.todayMission}"** 해볼까요? 아래 [⏱️ 3분 타이머 시작]을 누르시면 같이 시작해 드릴게요!`;
            setMindState(prev => ({ ...prev, isEasyModeActive: true, burdenScore: 20 }));
            playAudio('magic');
            if (window.confetti) {
              window.confetti({ particleCount: 60, spread: 60, origin: { y: 0.7 } });
            }
          } else {
            reply = `정말 대단해요! 한 걸음씩 가볍게 나아갈 때 뇌는 도파민을 뿜어내며 점점 더 몰입하게 돼요.\n\n오늘 해낸 작은 3분의 성공이 내일의 거대한 성공을 만듭니다. 지금 기분이 어떠신가요?`;
          }

          const coachMsg = {
            id: `c-${Date.now()}`,
            sender: 'coach',
            text: reply,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };

          setMessages(prev => [...prev, coachMsg]);
          setIsThinking(false);
        }, 500);
      };

      // Base font size calculations
      const baseFontSizePx = 15 * fontScale;

      return (
        <div className="flex flex-col h-screen max-h-screen">
          
          {/* Top Header */}
          <header className="h-20 border-b border-cyan-500/20 glass-panel px-4 md:px-8 flex items-center justify-between z-20">
            <div className="flex items-center space-x-3 md:space-x-4">
              <div className="w-11 h-11 md:w-12 md:h-12 rounded-2xl bg-gradient-to-br from-cyan-400 via-indigo-500 to-purple-600 flex items-center justify-center neon-border-cyan shadow-lg">
                <i data-lucide="sparkles" className="w-6 h-6 text-white animate-spin" style={{ animationDuration: '15s' }}></i>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-lg md:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-white to-gold-300 font-sans tracking-tight">
                    안티그레비티 OS
                  </h1>
                  <span className="hidden sm:inline-block text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-cyan-500/20 text-cyan-300 border border-cyan-500/30">
                    성공 습관 코치
                  </span>
                </div>
                <p className="text-xs md:text-sm text-slate-400 font-medium">
                  {viewMode === 'EASY' ? '🌱 누구나 쉽게 시작하는 마음 편한 성공 관리' : '⚡ 5-Layer Why & 인지 활성화 물리 모델'}
                </p>
              </div>
            </div>

            {/* Controls: Easy/Pro Mode + Font Size Controller */}
            <div className="flex items-center space-x-2 md:space-x-4">
              
              {/* Mode Toggle */}
              <div className="bg-space-900 border border-cyan-500/30 rounded-2xl p-1 flex items-center">
                <button
                  onClick={() => { setViewMode('EASY'); playAudio('tick'); }}
                  className={`px-3 py-1.5 text-xs md:text-sm font-bold rounded-xl flex items-center gap-1.5 transition ${
                    viewMode === 'EASY' ? 'bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'
                  }`}>
                  <span>🌱 쉬운 모드</span>
                </button>
                <button
                  onClick={() => { setViewMode('PRO'); playAudio('tick'); }}
                  className={`px-3 py-1.5 text-xs md:text-sm font-bold rounded-xl flex items-center gap-1.5 transition ${
                    viewMode === 'PRO' ? 'bg-gradient-to-r from-purple-500 to-indigo-600 text-white shadow-md' : 'text-slate-400 hover:text-white'
                  }`}>
                  <span>⚡ 프로 모드</span>
                </button>
              </div>

              {/* Intuitive Font Size Controller (A- / A+ / Presets) */}
              <div className="bg-space-900 border border-slate-700/80 rounded-2xl px-2 py-1 flex items-center gap-1 shadow-inner">
                <button 
                  onClick={() => handleFontScaleChange(fontScale - 0.2)}
                  title="글씨 축소"
                  className="w-7 h-7 md:w-8 md:h-8 rounded-lg bg-space-800 hover:bg-space-700 text-slate-300 font-bold text-sm flex items-center justify-center transition">
                  A-
                </button>
                
                <span className="text-xs md:text-sm font-bold font-mono text-cyan-300 px-1.5 min-w-[50px] text-center">
                  {Math.round(fontScale * 100)}%
                </span>

                <button 
                  onClick={() => handleFontScaleChange(fontScale + 0.2)}
                  title="글씨 확대"
                  className="w-7 h-7 md:w-8 md:h-8 rounded-lg bg-space-800 hover:bg-space-700 text-slate-300 font-bold text-sm flex items-center justify-center transition">
                  A+
                </button>

                {/* Quick Presets */}
                <div className="hidden lg:flex items-center gap-1 ml-1 border-l border-slate-800 pl-1">
                  {[
                    { label: '보통', scale: 1.0 },
                    { label: '크게', scale: 1.4 },
                    { label: '아주크게', scale: 1.8 },
                    { label: '2배', scale: 2.0 }
                  ].map(p => (
                    <button
                      key={p.scale}
                      onClick={() => handleFontScaleChange(p.scale)}
                      className={`px-2 py-1 text-xs font-bold rounded-lg transition ${
                        Math.abs(fontScale - p.scale) < 0.1 ? 'bg-cyan-400 text-black font-extrabold' : 'text-slate-400 hover:text-white'
                      }`}>
                      {p.label}
                    </button>
                  ))}
                </div>
              </div>

            </div>
          </header>

          {/* Main Layout Container */}
          <div className="flex-1 flex overflow-hidden">
            
            {/* LEFT: Socratic Dialogue Stream */}
            <section className={`flex flex-col bg-space-950/80 relative transition-all duration-300 ${
              viewMode === 'EASY' ? 'w-full md:w-7/12 lg:w-8/12 border-r border-cyan-500/10' : 'w-full md:w-1/2 border-r border-cyan-500/10'
            }`}>
              
              {/* Quick Status Bar */}
              <div className="bg-space-900/90 border-b border-cyan-500/10 px-5 py-2.5 flex items-center justify-between text-xs md:text-sm text-slate-300 font-medium">
                <div className="flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span>AI 코치 실시간 연결 중</span>
                </div>
                <div className="flex items-center gap-3 text-slate-400">
                  <span>🔥 {mindState.streakDays}일 연속 성공 중</span>
                  <span>|</span>
                  <span className="text-cyan-400 font-bold">마음 부담감: {mindState.burdenScore > 50 ? '⚠️ 높음' : '✨ 가벼움'}</span>
                </div>
              </div>

              {/* Chat Message Stream */}
              <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
                {messages.map((m) => (
                  <div key={m.id} className={`flex flex-col ${m.sender === 'user' ? 'items-end' : 'items-start'}`}>
                    <div className="flex items-center gap-2 mb-1 px-1">
                      <span className="text-xs font-bold uppercase tracking-wider text-cyan-400">
                        {m.sender === 'coach' ? '🌱 안티그레비티 AI 코치' : '👤 나 (사용자)'}
                      </span>
                      <span className="text-xs text-slate-500 font-mono">{m.timestamp}</span>
                    </div>

                    <div className={`max-w-[92%] md:max-w-[85%] rounded-3xl p-5 leading-relaxed shadow-lg ${
                      m.sender === 'user'
                        ? 'bg-gradient-to-r from-cyan-950/90 to-indigo-950/95 border-2 border-cyan-500/40 text-white rounded-tr-none'
                        : 'glass-panel-glow text-slate-100 border-l-[6px] border-l-cyan-400 rounded-tl-none'
                    }`} style={{ fontSize: `${baseFontSizePx}px` }}>
                      <p className="whitespace-pre-line font-sans font-medium leading-relaxed">{m.text}</p>
                    </div>
                  </div>
                ))}

                {isThinking && (
                  <div className="flex items-center space-x-3 text-cyan-400 text-sm font-medium p-4 glass-panel rounded-2xl w-fit">
                    <i data-lucide="loader-2" className="w-5 h-5 animate-spin"></i>
                    <span>당신의 마음을 편안하게 돕는 답변을 준비하고 있어요...</span>
                  </div>
                )}
                <div ref={chatEndRef} />
              </div>

              {/* Quick Choice Chips (1초 원클릭 선택지) */}
              {messages.length === 1 && (
                <div className="px-5 py-3 bg-space-900/90 border-t border-cyan-500/10 flex flex-wrap gap-2">
                  <span className="text-xs font-bold text-slate-400 w-full mb-1">💡 원클릭 빠른 선택:</span>
                  {GOAL_CHIPS.map(chip => (
                    <button
                      key={chip.id}
                      onClick={() => handleSendMessage(chip.text)}
                      className="px-3.5 py-2 rounded-xl text-xs md:text-sm font-semibold bg-space-800 hover:bg-cyan-500/20 text-slate-200 hover:text-cyan-300 border border-slate-700 hover:border-cyan-400 transition shadow-sm">
                      {chip.label}
                    </button>
                  ))}
                </div>
              )}

              {messages.length === 2 && (
                <div className="px-5 py-3 bg-space-900/90 border-t border-cyan-500/10 flex flex-wrap gap-2">
                  <span className="text-xs font-bold text-slate-400 w-full mb-1">💡 왜 시작이 망설여지나요?</span>
                  {EXCUSE_CHIPS.map((chip, idx) => (
                    <button
                      key={idx}
                      onClick={() => handleSendMessage(chip.text)}
                      className="px-3.5 py-2 rounded-xl text-xs md:text-sm font-semibold bg-space-800 hover:bg-rose-500/20 text-slate-200 hover:text-rose-300 border border-slate-700 hover:border-rose-400 transition shadow-sm">
                      {chip.label}
                    </button>
                  ))}
                </div>
              )}

              {/* Input Area */}
              <div className="p-4 md:p-5 bg-space-900/95 border-t border-cyan-500/20">
                <form onSubmit={(e) => { e.preventDefault(); handleSendMessage(); }} className="relative flex items-center">
                  <textarea
                    rows="2"
                    value={inputText}
                    onChange={(e) => setInputText(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        handleSendMessage();
                      }
                    }}
                    placeholder="생각나는 대로 편하게 이야기해 주세요..."
                    className="w-full bg-space-950 border-2 border-slate-700 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400 rounded-2xl px-5 py-3.5 text-white placeholder-slate-500 focus:outline-none resize-none pr-28 font-sans leading-relaxed"
                    style={{ fontSize: `${baseFontSizePx}px` }}
                  />
                  <button
                    type="submit"
                    disabled={!inputText.trim() || isThinking}
                    className={`absolute right-3 bottom-3.5 px-5 py-2.5 rounded-xl font-bold text-sm flex items-center gap-1.5 transition ${
                      inputText.trim() && !isThinking
                        ? 'bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-lg shadow-cyan-500/40 hover:scale-105'
                        : 'bg-space-800 text-slate-600 cursor-not-allowed'
                    }`}>
                    <span>보내기</span>
                    <i data-lucide="send" className="w-4 h-4"></i>
                  </button>
                </form>
              </div>
            </section>

            {/* RIGHT: Dashboard Panel */}
            <aside className={`hidden md:flex flex-col bg-space-950/95 overflow-y-auto p-6 space-y-6 ${
              viewMode === 'EASY' ? 'w-5/12 lg:w-4/12' : 'w-1/2'
            }`}>
              
              {/* EASY MODE DASHBOARD */}
              {viewMode === 'EASY' && (
                <div className="space-y-6">
                  
                  {/* 3-Minute Focus Mission & Timer Card */}
                  <div className="glass-panel-glow rounded-3xl p-6 border-2 border-cyan-400/40 text-center">
                    <div className="flex items-center justify-center gap-2 text-cyan-400 font-bold text-sm mb-2">
                      <i data-lucide="zap" className="w-5 h-5"></i>
                      <span>오늘의 부담 없는 3분 미션</span>
                    </div>

                    <p className="text-base font-bold text-white mb-4 leading-snug">
                      "{mindState.todayMission}"
                    </p>

                    {/* Big Countdown Timer */}
                    <div className="bg-space-900 p-5 rounded-2xl border border-cyan-500/30 mb-4">
                      <span className="text-xs text-slate-400 block mb-1 font-mono">남은 집중 시간</span>
                      <span className="text-4xl font-black font-mono text-cyan-300">
                        {Math.floor(timerSeconds / 60)}:{(timerSeconds % 60).toString().padStart(2, '0')}
                      </span>
                    </div>

                    {/* Timer Trigger Button */}
                    {!isTimerRunning ? (
                      <button
                        onClick={() => { setIsTimerRunning(true); playAudio('tick'); }}
                        className="w-full py-3.5 rounded-2xl font-black text-sm md:text-base bg-gradient-to-r from-cyan-500 via-indigo-600 to-purple-600 text-white shadow-xl shadow-cyan-500/30 hover:scale-105 transition flex items-center justify-center gap-2">
                        <i data-lucide="play" className="w-5 h-5"></i>
                        <span>⏱️ 3분 타이머 시작하기</span>
                      </button>
                    ) : (
                      <button
                        onClick={() => { setIsTimerRunning(false); playAudio('tick'); }}
                        className="w-full py-3.5 rounded-2xl font-black text-sm bg-rose-600/80 hover:bg-rose-600 text-white transition flex items-center justify-center gap-2">
                        <i data-lucide="pause" className="w-5 h-5"></i>
                        <span>일시 정지</span>
                      </button>
                    )}
                  </div>

                  {/* Mind Burden Gauge (친절한 마음 게이지) */}
                  <div className="glass-panel rounded-3xl p-5 border border-slate-800 space-y-4">
                    <h3 className="text-sm font-bold text-slate-300 flex items-center gap-2">
                      <i data-lucide="heart-pulse" className="w-4 h-4 text-purple-400"></i>
                      <span>내 마음의 부담감 상태</span>
                    </h3>

                    <div>
                      <div className="flex justify-between text-xs font-semibold mb-1">
                        <span className="text-slate-400">시작하기 귀찮은 정도</span>
                        <span className="text-cyan-400">{mindState.burdenScore}점</span>
                      </div>
                      <div className="w-full bg-space-900 h-2.5 rounded-full overflow-hidden border border-slate-800">
                        <div className="bg-gradient-to-r from-cyan-500 to-rose-500 h-full transition-all duration-500" style={{ width: `${mindState.burdenScore}%` }}></div>
                      </div>
                    </div>

                    <div className="p-3 bg-space-900 rounded-xl border border-slate-800 text-xs text-slate-300 leading-relaxed">
                      💡 <strong>AI 코치의 조언:</strong> 목표가 너무 거창하면 마음이 무거워져요. 오늘 딱 3분만 끝내면 부담감이 20점 밑으로 뚝 떨어집니다!
                    </div>
                  </div>

                </div>
              )}

              {/* PRO MODE DASHBOARD */}
              {viewMode === 'PRO' && (
                <div className="space-y-6">
                  <div className="glass-panel-glow rounded-3xl p-6 border-2 border-cyan-400/50">
                    <h3 className="text-sm font-bold font-mono text-cyan-300 mb-2">ACTIVATION ENERGY FORMULA</h3>
                    <p className="text-xs font-mono text-slate-300 mb-3">E_act = ( E_base × C_f ) / ( M + ε )</p>
                    <div className="p-3 bg-space-900 rounded-xl border border-slate-800 text-xs font-mono">
                      <div>E_base (복잡도): 8.0 ➔ 0.1 (Bypass)</div>
                      <div>C_f (마찰계수): 8.5</div>
                      <div>Momentum: {mindState.momentum}</div>
                    </div>
                  </div>
                </div>
              )}

            </aside>
          </div>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
