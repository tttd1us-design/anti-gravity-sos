    const playSound = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'cheer') {
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.05);
            gain.gain.setValueAtTime(0.05, ctx.currentTime + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.05 + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.05);
            osc.stop(ctx.currentTime + i * 0.05 + 0.2);
          });
        }
      } catch (e) {}
    };

        localStorage.setItem('AG_FIVE_MASTERS_V2', JSON.stringify(fiveMastersData));
        localStorage.setItem('AG_QA_BACKUP_LOGS_V4', JSON.stringify(qaBackupLogs));
        localStorage.setItem('AG_SPLIT_PERCENT', leftWidthPercent.toString());
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [messages, fiveMastersData, qaBackupLogs, leftWidthPercent, fontSize, isRecording, recordDuration, selectedQuestion, inputHeightPx, activeMasterTab, mainViewMode]);

      // 타이머
      useEffect(() => {
        let timer = null;
        if (timerOn && timeLeft > 0) {
          timer = setInterval(() => setTimeLeft(t => t - 1), 1000);
        } else if (timeLeft === 0 && timerOn) {
          setTimerOn(false);
          playSound('cheer');
          if (window.confetti) {
            window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
          }
          setShowStampPopup(true);
        }
        return () => clearInterval(timer);
      }, [timerOn, timeLeft]);

      // 음성 녹음 타이머
      useEffect(() => {
        if (isRecording) {
          recordTimerRef.current = setInterval(() => {
            setRecordDuration(sec => sec + 1);
          }, 1000);
        } else {
          clearInterval(recordTimerRef.current);
          setRecordDuration(0);
        }
        return () => clearInterval(recordTimerRef.current);
      }, [isRecording]);

      // 가로 리사이징 드래그
      const handleMouseDown = (e) => {
        setIsDragging(true);
      };

      useEffect(() => {
        const handleMouseMove = (e) => {
          if (!isDragging) return;
          const containerWidth = window.innerWidth;
          const newPercent = (e.clientX / containerWidth) * 100;
          if (newPercent >= 25 && newPercent <= 80) {
            setLeftWidthPercent(parseFloat(newPercent.toFixed(1)));
          }
        };

        const handleMouseUp = () => {
          setIsDragging(false);
        };

        if (isDragging) {
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);
        }
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseup', handleMouseUp);
        };
      }, [isDragging]);

      // 30분 연속 음성 인식
      const toggleVoiceRecording = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("Chrome 또는 Edge 브라우저를 사용해 주세요.");
          return;
        }

        if (isRecording) {
          isExplicitStopRef.current = true;
          setIsRecording(false);
          if (recognitionRef.current) recognitionRef.current.stop();
          playSound('pop');
        } else {
          isExplicitStopRef.current = false;
          playSound('pop');

          const recognition = new SpeechRecognition();
          recognition.lang = 'ko-KR';
          recognition.continuous = true;
          recognition.interimResults = true;

          recognition.onstart = () => setIsRecording(true);

          recognition.onresult = (event) => {
            for (let i = event.resultIndex; i < event.results.length; ++i) {
              if (event.results[i].isFinal) {
                const finalPiece = event.results[i][0].transcript.trim();
                setInputMsg(prev => (prev ? prev + " " : "") + finalPiece);
              }
            }
          };

          recognition.onerror = (event) => {
            if (event.error === 'not-allowed') {
              alert("마이크 권한을 허용해 주세요.");
              setIsRecording(false);
              isExplicitStopRef.current = true;
            }
          };

          recognition.onend = () => {
            if (!isExplicitStopRef.current) {
              try { recognition.start(); } catch (e) {}
            }
          };

          recognitionRef.current = recognition;
          try { recognition.start(); } catch (e) {}
        }
      };

      const changeFontSize = (scale) => {
        const val = Math.min(1.8, Math.max(0.8, parseFloat(scale.toFixed(1))));
        setFontSize(val);
        localStorage.setItem('AG_COMPACT_FONT', val.toString());
        playSound('pop');
      };

      const handleSelectQuestion = (q) => {
        setSelectedQuestion(q);
        playSound('pop');
      };

      // 대화 전송 및 5대 시스템 자동 분석
      const sendChat = () => {
        const text = inputMsg.trim();
        if (!text || isThinking) return;

        if (isRecording) {
          isExplicitStopRef.current = true;
          setIsRecording(false);
          if (recognitionRef.current) recognitionRef.current.stop();
        }

        const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        if (selectedQuestion) {
          const qObj = selectedQuestion;
          const userMsg = {
            id: Date.now(),
            sender: 'user',
            text: `[${qObj.title} 답변]\n${text}`,

          setQaBackupLogs(prev => [

              answer: text,
              time: timeStr

          setFiveMastersData(prev => {

            if (qObj.slot === 'endState') {

              next.hill.definiteChiefAim = `2026년 중심 목표: [${text}] 완성`;
              next.gtd.altitude50k = `50,000ft (궁극적 가치): ${text}`;
              next.dalio.goals = text;
            } else if (qObj.slot === 'bottleneck') {
              next.dalio.problems = text;
              next.dalio.diagnosis5Why = `표면 저항: [${text}] ➔ 마찰 최소화 필요`;
              next.robbins.painOfFailure = `${text}를 극복하지 못할 경우 정체되는 고통`;
            } else if (qObj.slot === 'leverage') {
              next.dalio.ifThenRule = `IF [${text}] 레버리지 가동 시, THEN 실행 마찰을 제로화한다.`;
              next.forte.distilledEssence = `핵심 레버리지: ${text}`;
              next.gtd.altitude10k = `10,000ft 프로젝트: ${text} 기반 스프린트`;
            } else if (qObj.slot === 'microAction') {
              next.dalio.execution = text;
              next.gtd.runway = `지상 (Runway): ${text} (3분 착수)`;
              next.hill.immediatePlan = `오늘 당장 착수: ${text}`;
            }
            return next;
          });

          setInputMsg("");
          setSelectedQuestion(null);
          playSound('cheer');
          setIsThinking(true);

          setTimeout(() => {
            const coachMsg = {
              id: Date.now() + 1,
              sender: 'coach',
              text: `✅ **"${qObj.title}"**에 대한 답변이 분석되어 **5대 거장 시스템(레이 달리오, 토니 로빈스, 티아고 포르테, 나폴레온 힐, 데이비드 앨런) 분석실**에 완벽하게 체계화되었습니다! 🌟`,
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            setMessages(prev => [...prev, coachMsg]);
            setIsThinking(false);
          }, 400);

          return;
        }

        const userMsg = {
          id: Date.now(),
          sender: 'user',
          text,
          time: timeStr
        };

        setMessages(prev => [...prev, userMsg]);
        
        setQaBackupLogs(prev => [
          ...prev,
          {
            id: Date.now(),
            type: 'STATEMENT',
            question: '💬 자유 발언 / 목표 기획',
            answer: text,
            time: timeStr
          }

        setInputMsg("");
        playSound('pop');
        setIsThinking(true);

        setTimeout(() => {

            ...prev,

              ...prev.dalio,

            },
            robbins: {
              ...prev.robbins,
              coreDriver: `${text}을 통한 자기 결정권과 성장`
            },
            forte: {
              ...prev.forte,
              projects: `[진행 중] ${text} 완성 프로젝트`
            },
            hill: {
              ...prev.hill,
              definiteChiefAim: `나는 2026년까지 [${text}]을(를) 완벽히 달성하여 가치를 창출한다.`
            },
            gtd: {
              ...prev.gtd,
              altitude30k: `30,000ft 중단기 목표: ${text}`,
              runway: `지상 Runway: ${text.substring(0, 15)} 3분 즉시 착수`
            }
          }));

          const coachMsg = {
            id: Date.now() + 1,
            sender: 'coach',
            text: `말씀해 주신 내용(**"${text.length > 20 ? text.substring(0, 20) + '…' : text}"**)을 바탕으로 **4대 소크라테스 질문** 및 **5대 분석실**이 업데이트되었습니다. 질문을 클릭하여 답변해 보세요! 👇`,

          {/* 🌟 메인보드 최상단 5대 거장 전용 페이지 탭 바 */}

              <button

              <button

            </div>

            <button

                  `## 1. 레이 달리오 《원칙》\n- 5단계 루프: ${fiveMastersData.dalio.goals} -> ${fiveMastersData.dalio.problems} -> ${fiveMastersData.dalio.diagnosis5Why} -> ${fiveMastersData.dalio.systemDesign} -> ${fiveMastersData.dalio.execution}\n- If-Then: ${fiveMastersData.dalio.ifThenRule}\n\n` +

              className="hidden sm:flex items-center gap-1 px-3 py-1 rounded-xl text-xs font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-400 hover:bg-cyan-500/30">
