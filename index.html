  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Web Audio Synthesizer ---
    const playAudio = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (type === 'tick') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(750, ctx.currentTime);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.06);
        } else if (type === 'bypass') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'celebrate') {
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.05);
            gain.gain.setValueAtTime(0.06, ctx.currentTime + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.05 + 0.22);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.05);
            osc.stop(ctx.currentTime + i * 0.05 + 0.22);
          });
        }
      } catch (e) {}
    };

    // --- 5-LAYER WHY LADDERING SPEC ---
    const WHY_LAYERS = [
      { layer: 1, name: 'Layer 1: Surface Want', desc: '표면적 목표 및 가시적 욕망', color: 'text-slate-300' },

        { id: 2, label: '누구도 나를 통제할 수 없는 절대적 자립과 지적 통제권', weight: 95, layer: 3, category: 'EMOTIONAL_DRIVER' },

          tag: "NEUTRALIZER",
          date: "2026-08-31"
        }
      ]
    };

    // --- Socratic 5-Layer Why Engine ---
    function processSocraticPRD(userInput, currentData, history) {
      const text = userInput.trim();
      let updated = JSON.parse(JSON.stringify(currentData));
      let reply = "";

      // Cognitive Defense Detection (Rationalization Check)
      const isExcuse = text.includes("시간") || text.includes("바빠") || text.includes("피곤") || text.includes("다음에") || text.includes("나중에");

      if (isExcuse && updated.dialogueDepth <= 3) {
        reply = `[인지 방어기제 무력화: Cognitive Defense Neutralizer]\n\n"시간이나 피로는 표면적 핑계일 뿐입니다. 시스템 로그상 당신은 피로한 상태에서도 본인이 통제권을 느끼는 게임이나 투자 분석에는 몇 시간씩 몰입할 수 있습니다.\n\n이 과제를 앞두고 당신의 무의식이 회피하고자 했던 진짜 불쾌한 감정이나 공포(Gravity)는 정확히 무엇입니까?"`;
        updated.physics.cf = Math.min(10.0, updated.physics.cf + 0.5);
      } else if (updated.dialogueDepth === 1) {
        updated.dialogueDepth = 2;
        updated.currentLayer = 2;
        reply = `[Layer 1 ➔ Layer 2: Strategic Outcome 진입]\n\n당신의 표면적 욕망 뒤에 숨겨진 결과적 기대를 포착했습니다.\n\n이 목표가 실현되어 세상에 당신의 시스템이 자리 잡았을 때, 당신이 구축하게 될 **'10조 규모의 비즈니스 제국 혹은 지적 독점권'**의 구체적인 모습은 무엇입니까?`;
        updated.desires.unshift({
          id: Date.now(),
          label: `발굴된 전략적 기대: "${text.slice(0, 30)}..."`,
          weight: 94,
          layer: 2,
          category: 'STRATEGIC_OUTCOME'
        });
      } else if (updated.dialogueDepth === 2) {
        updated.dialogueDepth = 3;
        updated.currentLayer = 3;
        reply = `[Layer 2 ➔ Layer 3: Emotional Driver 진입]\n\n그 거대한 비즈니스 제국을 완성했을 때 당신이 얻게 될 **'누구도 침범할 수 없는 절대적 자립과 자유'**라는 근원적 감정에 도달했습니다.\n\n그렇다면 반대로 질문합니다. 이것을 시도했다가 세상의 냉소나 실패를 마주했을 때, 당신이 감당하기 가장 두려운 **'무의식적 수치심이나 손실(Shadow Probing)'**은 무엇입니까?`;
      } else if (updated.dialogueDepth === 3) {
        updated.dialogueDepth = 4;
        updated.currentLayer = 4;
        reply = `[Layer 3 ➔ Layer 4: Shadow Probing 저항 해체]\n\n당신의 뇌가 브레이크를 밟았던 진짜 원인인 **'평가 공포와 완벽주의적 저항(Gravity Score: 8.5)'**이 데이터로 규명되었습니다. 당신이 게으른 것이 아니라, 무의식이 당신의 자존감을 보호하기 위해 회피를 선택했던 것입니다.\n\n지금 이 순간 **'절대 비공개 1인 로컬 모드'**를 발동합니다.\n\n누구에게도 보여주지 않을, 가장 거칠고 엉망인 핵심 키워드 3개를 지금 적어보십시오.`;
        updated.gravityFrictions.unshift({
          id: Date.now(),
          label: `규명된 실존적 공포: ${text.slice(0, 35)}...`,
          severity: 'CRITICAL',
          score: 8.5
        });
      } else {
        updated.dialogueDepth = 5;
        updated.currentLayer = 5;
        updated.physics.momentum = 1.4;
        updated.physics.cf = 2.1;
        updated.physics.eAct = (0.1 * 2.1) / (1.4 + 0.00001);
        reply = `[Layer 5: Core Driver & Anchor 무마찰 가속 진입]\n\n마찰이 해제되었습니다! 모멘텀 지수(M)가 1.4로 급상승하고 인지 활성화 에너지(E_act)가 0.15로 극소화되었습니다.\n\n방금 추출된 인지 디버깅 규칙이 **Obsidian 로컬 볼트** 및 **Ray Dalio 의사결정 원칙집**에 영구 각인되었습니다. 지금 즉시 다음 7분 딥워크로 진입하십시오!`;
      }

      // Recalculate physics
      updated.physics.eAct = parseFloat(((updated.physics.eBase * updated.physics.cf) / (updated.physics.momentum + 0.00001)).toFixed(2));
      return { reply, updated };
    }

    function App() {
      const [data, setData] = useState(() => {
        const saved = localStorage.getItem('AG_OS_PRD_MASTER_V1');
        return saved ? JSON.parse(saved) : DEFAULT_DATA;
      });

      const [messages, setMessages] = useState([
        {
          id: 'init-1',
          sender: 'system',
          text: `[ANTI-GRAVITY OS: 인지 역설계 엔진 가동]\n\n이 시스템은 5-Layer Why Laddering을 통해 잠재의식의 공포와 마찰력(Gravity)을 해체하고 무마찰 실행 알고리즘으로 전환합니다.\n\n당신이 머리로는 간절히 원하지만, 실행 직전 자꾸만 딴짓을 하거나 미루게 되는 **'가장 중요한 단 하나의 과제나 목표'**는 무엇입니까?`,
          timestamp: new Date().toLocaleTimeString()
        }
      ]);

      const [inputText, setInputText] = useState("");
      const [activeTab, setActiveTab] = useState('physics'); // physics, why, ontology, asset, tier
      const [isThinking, setIsThinking] = useState(false);
      const [fontSizeScale, setFontSizeScale] = useState(data.fontSizeScale || 2.0);
      const chatScrollRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('AG_OS_PRD_MASTER_V1', JSON.stringify({ ...data, fontSizeScale }));
        chatScrollRef.current?.scrollIntoView({ behavior: 'smooth' });
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [messages, data, activeTab, fontSizeScale]);

      const handleSendMessage = (e) => {
        e.preventDefault();
        if (!inputText.trim() || isThinking) return;

        const userMsg = {
          id: `u-${Date.now()}`,
          sender: 'user',
          text: inputText.trim(),
          timestamp: new Date().toLocaleTimeString()
        };

        setMessages(prev => [...prev, userMsg]);
        const curInput = inputText.trim();
        setInputText("");
        playAudio('tick');
        setIsThinking(true);

        setTimeout(() => {
          const { reply, updated } = processSocraticPRD(curInput, data, messages);
          setData(updated);

          const sysMsg = {
            id: `s-${Date.now()}`,
            sender: 'system',
            text: reply,
            timestamp: new Date().toLocaleTimeString()
          };

          setMessages(prev => [...prev, sysMsg]);
          setIsThinking(false);

          if (updated.dialogueDepth >= 4) {
            playAudio('celebrate');
            if (window.confetti) {
              window.confetti({ particleCount: 80, spread: 70, origin: { y: 0.65 } });
            }
          }
        }, 500);
      };

      // PRD Section 4.3: Dynamic Task Downsizing (Bypass Logic)
      const triggerBypassLogic = () => {
        playAudio('bypass');
        setData(prev => {
          const newEbase = 0.1;
          const newCf = prev.physics.cf * 0.4;
          const newMomentum = prev.physics.momentum + 0.3;
          const newEact = parseFloat(((newEbase * newCf) / (newMomentum + 0.00001)).toFixed(2));
          return {
            ...prev,
            physics: {
              ...prev.physics,
              eBase: newEbase,
              cf: parseFloat(newCf.toFixed(1)),
              momentum: parseFloat(newMomentum.toFixed(1)),
              eAct: newEact,
              isBypassed: true
            }
          };
        });
        if (window.confetti) {
          window.confetti({ particleCount: 50, spread: 50, origin: { y: 0.7 } });
        }
      };

      const exportAssetEngine = (type) => {
        let content = "";
        let filename = "";

        if (type === 'blueprint') {
          content = `# 🛡️ THE ANTI-GRAVITY BLUEPRINT (개인 인지 설계도)
문서 식별 번호: AG-BLUEPRINT-2026-PRO
발행 일시: ${new Date().toLocaleString()}

- **지불할 기회비용**: ${data.dca.priceToPay}

## 2. 5-Layer Why 심층 욕망 & 저항 온톨로지
${data.desires.map(d => `- [Layer ${d.layer}] ${d.label} (가중치: ${d.weight}%)`).join('\n')}

### 무의식적 중력 저항 (Gravity Frictions):
${data.gravityFrictions.map(g => `- [${g.severity}] ${g.label} (마찰점수: ${g.score})`).join('\n')}

## 3. 물리적 인지 활성화 상태
- 과제 복잡도 (E_base): ${data.physics.eBase}
- 심리적 마찰 계수 (C_f): ${data.physics.cf}
- 축적된 모멘텀 (M): ${data.physics.momentum}
- 인지 활성화 에너지 (E_act): ${data.physics.eAct}
`;
          filename = `Anti_Gravity_Blueprint_${new Date().toISOString().slice(0,10)}.md`;
        } else {
          content = `# 📚 AUTOMATED BOOK MANUSCRIPT & IR FRAMEWORK
프로덕트: Anti-Gravity 100권 도서 & 10조 비즈니스 컴파일러
생성 일시: ${new Date().toLocaleString()}

## [Ch.1] 인지 역설계와 무의식의 마찰력 해체
1.1. 인간 의지력의 한계와 잠재의식 공포의 상관관계
