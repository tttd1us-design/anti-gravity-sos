<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3분 실험실 (3-Minute Lab) - 나를 실험해서 나의 사용설명서를 쓰는 앱</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            space: {
              950: '#030508',
              900: '#070B12',
              850: '#0D1422',
              800: '#141E33',
              700: '#1D2A47',
            },
            cyan: {
              300: '#67E8F9',
              400: '#22D3EE',
              500: '#06B6D4',
              glow: '#00F0FF',
            },
            gold: {
              300: '#FDE047',
              400: '#FACC15',
              500: '#EAB308',
              glow: '#FFD700',
            },
            emerald: {
              400: '#34D399',
              500: '#10B981',
            },
            purple: {
              400: '#C084FC',
              500: '#A855F7',
            }
          },
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #030508;
      color: #F8FAFC;
      font-family: 'Pretendard', sans-serif;
      overflow-x: hidden;
      font-size: 18px;
      line-height: 1.75;
      transition: font-size 0.15s ease;
    }
    
    .bg-soft-pattern {
      background-image: 
        linear-gradient(to right, rgba(34, 211, 238, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(34, 211, 238, 0.03) 1px, transparent 1px);
      background-size: 36px 36px;
    }
    
    .glass-box {
      background: rgba(13, 20, 34, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid rgba(34, 211, 238, 0.22);
    }

    .glass-box-active {
      background: rgba(13, 20, 34, 0.96);
      backdrop-filter: blur(22px);
      border: 2px solid rgba(0, 240, 255, 0.55);
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.18);
    }

    .glass-box-safe {
      background: rgba(10, 30, 25, 0.95);
      backdrop-filter: blur(22px);
      border: 2px solid rgba(16, 185, 129, 0.5);
      box-shadow: 0 0 35px rgba(16, 185, 129, 0.2);
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #070B12;
    }
    ::-webkit-scrollbar-thumb {
      background: #1D2A47;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00F0FF;
    }
  </style>
</head>
<body class="bg-soft-pattern min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const playSound = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.06);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.06);
        } else if (type === 'cheer') {
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.06);
            gain.gain.setValueAtTime(0.06, ctx.currentTime + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.06 + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.06);
            osc.stop(ctx.currentTime + i * 0.06 + 0.25);
          });
        } else if (type === 'calm') {
          [440, 554.37, 659.25].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.15);
            gain.gain.setValueAtTime(0.04, ctx.currentTime + i * 0.15);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.6);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.15);
            osc.stop(ctx.currentTime + i * 0.15 + 0.6);
          });
        }
      } catch (e) {}
    };

    function App() {
      // 폰트 크기 배율 (기본 1.5)
      const [fontSize, setFontSize] = useState(() => {
        return parseFloat(localStorage.getItem('AG_LAB_FONT') || '1.5');
      });

      // 탭: 'EXPERIMENT'(실험 카드), 'RECORD'(관찰 기록), 'MANUAL'(사용설명서), 'LANDING'(비상착륙)
      const [activeTab, setActiveTab] = useState('EXPERIMENT');

      // 전역 실험 상태
      const [labState, setLabState] = useState(() => {
        const saved = localStorage.getItem('AG_3MIN_LAB_STATE_V2');
        return saved ? JSON.parse(saved) : {
          experimentNumber: 17,
          isSafeLandingActive: false,
          currentExperiment: {
            id: 17,
            title: "보고서/기획서 작성 시작하기",
            hypothesis: "나는 '완성'을 목표로 삼으면 시작을 못 한다 (지금까지 6번 중 5번 그랬어요)",
            method: "보고서를 '일부러 형편없이' 3분만 쓰고, 3분이 지나면 무슨 일이 있어도 강제로 멈춘다 (프랭클 역설적 의도 실험)",
            ladderLevel: 2, // 1: 30초, 2: 3분, 3: 10분, 4: 25분
            durationSeconds: 180
          },
          manualStats: {
            discoveredCount: 7,
            totalLockedCount: 30,
            confirmedRules: [
              {
                id: 1,
                rule: "나는 오후 2시보다 오전 7시에 시작 성공 확률이 3배 높다.",
                evidence: "실험 14회 중 오전 82% vs 오후 27%",
                status: "CONFIRMED"
              },
              {
                id: 3,
                rule: "'완벽하게'라는 단어가 들어간 과제는 4일 이상 미루는 경향이 있다.",
                evidence: "실험 9회 중 8회 시작 지연 발생",
                status: "CONFIRMED"
              },
              {
                id: 5,
                rule: "3분 타이머로 '형편없이 쓰기'를 시도할 때 착수율이 88%로 급증한다.",
                evidence: "실험 8회 중 7회 완수",
                status: "CONFIRMED"
              }
            ],
            testingHypotheses: [
              {
                id: 8,
                hypothesis: "누군가에게 먼저 선언하면 시작 확률이 올라간다?",
                progress: "관찰 2/5회 진행 중"
              }
            ]
          },
          lastObservation: null
        };
      });

      // 타이머 상태
      const [timeLeft, setTimeLeft] = useState(180);
      const [timerOn, setTimerOn] = useState(false);
      const [showLadder, setShowLadder] = useState(false);
      const [showObservationSuccess, setShowObservationSuccess] = useState(false);
      const [observationNote, setObservationNote] = useState("");
      const [aiObservationFeedback, setAiObservationFeedback] = useState("");
      const [showPricingModal, setShowPricingModal] = useState(false);

      useEffect(() => {
        localStorage.setItem('AG_3MIN_LAB_STATE_V2', JSON.stringify(labState));
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [labState, activeTab, fontSize]);

      // 타이머 로직
      useEffect(() => {
        let timer = null;
        if (timerOn && timeLeft > 0) {
          timer = setInterval(() => setTimeLeft(t => t - 1), 1000);
        } else if (timeLeft === 0 && timerOn) {
          setTimerOn(false);
          playSound('cheer');
          if (window.confetti) {
            window.confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
          }
          setActiveTab('RECORD');
        }
        return () => clearInterval(timer);
      }, [timerOn, timeLeft]);

      const changeFontSize = (scale) => {
        const val = Math.min(2.4, Math.max(1.1, parseFloat(scale.toFixed(1))));
        setFontSize(val);
        localStorage.setItem('AG_LAB_FONT', val.toString());
        playSound('pop');
      };

      // 사다리 선택
      const selectLadder = (level, seconds, label) => {
        setTimeLeft(seconds);
        setLabState(prev => ({
          ...prev,
          currentExperiment: {
            ...prev.currentExperiment,
            ladderLevel: level,
            durationSeconds: seconds,
            method: `[${label}] 단위로 축소하여 시작 저항을 낮춘다.`
          }
        }));
        setShowLadder(false);
        playSound('pop');
      };

      // 관찰 결과 기록 (완료/미완료 삭제, 4가지 객관적 관찰)
      const recordObservation = (outcomeType) => {
        playSound('pop');
        let feedback = "";

        if (outcomeType === 'NOT_STARTED') {
          feedback = "💡 훌륭한 관찰 데이터예요! 자책하지 마세요. 이번이 3번째인데 세 번 모두 밤 10시 이후였어요. 밤에는 시작 자체가 어려운 뇌 상태일 가능성이 높습니다. 내일은 오전 시간대로 가설을 바꿔보겠습니다.";
        } else if (outcomeType === 'STOPPED_EARLY') {
          feedback = "💡 1분 만에 멈춘 것도 대단한 데이터입니다. 시작하는 문턱을 넘었다는 증거예요. 다음엔 첫 단계를 30초 파일 열기로 더 낮춰볼게요.";
        } else if (outcomeType === 'COMPLETED_3MIN') {
          feedback = "🎉 3분 역설 실험을 완벽하게 완수하셨습니다! 강제로 멈추는 연습이 뇌의 완벽주의 브레이크를 해체했습니다. 사용설명서에 데이터가 1건 추가되었습니다.";
          playSound('cheer');
        } else if (outcomeType === 'EXCEEDED_3MIN') {
          feedback = "🚀 3분으로 시작해 자연스러운 몰입(Flow) 상태에 진입하셨군요! '시작 비용만 제거하면 스스로 달리는 사람'이라는 패턴이 85%의 신뢰도로 검증되었습니다.";
          playSound('cheer');
        }

        setAiObservationFeedback(feedback);
        setShowObservationSuccess(true);

        setLabState(prev => ({
          ...prev,
          experimentNumber: prev.experimentNumber + 1,
          lastObservation: {
            outcome: outcomeType,
            note: observationNote,
            timestamp: new Date().toLocaleTimeString()
          }
        }));
      };

      // 비상착륙 토글
      const toggleSafeLanding = () => {
        playSound('calm');
        setLabState(prev => ({
          ...prev,
          isSafeLandingActive: !prev.isSafeLandingActive
        }));
      };

      const currentFontPx = Math.max(18, 14 * fontSize);

      return (
        <div className="flex flex-col h-screen max-h-screen">
          
          {/* Header */}
          <header className={`h-24 border-b px-4 md:px-8 flex items-center justify-between z-20 transition-colors ${
            labState.isSafeLandingActive ? 'bg-emerald-950/90 border-emerald-500/40 glass-box-safe' : 'border-cyan-500/20 glass-box'
          }`}>
            
            <div className="flex items-center space-x-4">
              <div className={`w-12 h-12 md:w-14 md:h-14 rounded-2xl flex items-center justify-center shadow-lg transition ${
                labState.isSafeLandingActive 
                  ? 'bg-gradient-to-br from-emerald-400 to-teal-700 shadow-emerald-500/30'
                  : 'bg-gradient-to-br from-cyan-400 via-indigo-600 to-purple-600 shadow-cyan-500/30'
              }`}>
                <span className="text-3xl">{labState.isSafeLandingActive ? '🛬' : '🧪'}</span>
              </div>
              <div>
                <div className="flex items-center gap-2.5">
                  <h1 className="text-xl md:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-white to-gold-300 tracking-tight">
                    3분 실험실
                  </h1>
                  <span className={`text-xs md:text-sm font-bold px-3 py-0.5 rounded-full border ${
                    labState.isSafeLandingActive 
                      ? 'bg-emerald-500/20 text-emerald-300 border-emerald-400' 
                      : 'bg-cyan-500/20 text-cyan-300 border-cyan-400'
                  }`}>
                    {labState.isSafeLandingActive ? '비상착륙 가동 중' : '나를 연구하는 과학자'}
                  </span>
                </div>
                <p className="text-xs md:text-sm text-slate-300 font-medium">MBTI가 말한 것이라면, 이 앱은 실제로 '행동한 것'으로 씁니다</p>
              </div>
            </div>

            {/* Navigation Tabs */}
            <nav className="hidden lg:flex items-center space-x-1.5 bg-space-900 border border-slate-800 rounded-2xl p-1.5">
              {[
                { id: 'EXPERIMENT', label: '🧪 오늘의 실험', icon: 'flask-conical' },
                { id: 'RECORD', label: '🔬 관찰 기록', icon: 'clipboard-list' },
                { id: 'MANUAL', label: `📕 나의 사용설명서 (${labState.manualStats.discoveredCount}/30)`, icon: 'book-open' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => { setActiveTab(tab.id); playSound('pop'); }}
                  className={`px-4 py-2.5 rounded-xl text-xs md:text-sm font-bold flex items-center gap-2 transition ${
                    activeTab === tab.id
                      ? 'bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-md shadow-cyan-500/30'
                      : 'text-slate-300 hover:text-white hover:bg-space-800'
                  }`}>
                  <i data-lucide={tab.icon} className="w-4 h-4"></i>
                  <span>{tab.label}</span>
                </button>
              ))}
            </nav>

            {/* Right Controls */}
            <div className="flex items-center space-x-3">
              
              {/* SOS 비상착륙 버튼 */}
              <button
                onClick={toggleSafeLanding}
                className={`px-3.5 py-2 rounded-2xl text-xs md:text-sm font-black flex items-center gap-1.5 transition border ${
                  labState.isSafeLandingActive
                    ? 'bg-emerald-500 text-black border-emerald-300 shadow-lg shadow-emerald-500/40 animate-pulse'
                    : 'bg-rose-500/20 text-rose-300 border-rose-500/40 hover:bg-rose-500/30'
                }`}>
                <span>{labState.isSafeLandingActive ? '🛬 비상착륙 해제' : '🚨 SOS 비상착륙'}</span>
              </button>

              {/* Pro Pricing Button */}
              <button
                onClick={() => { setShowPricingModal(true); playSound('pop'); }}
                className="hidden sm:flex px-3.5 py-2 rounded-2xl text-xs md:text-sm font-bold bg-gradient-to-r from-gold-400 to-amber-500 text-black shadow-md shadow-gold-500/20 hover:scale-105 transition items-center gap-1.5">
                <i data-lucide="crown" className="w-4 h-4"></i>
                <span>Pro ₩9,900</span>
              </button>

              {/* Font Size Controller */}
              <div className="flex items-center space-x-1 bg-space-900 border border-slate-700 rounded-2xl px-2.5 py-1">
                <button
                  onClick={() => changeFontSize(fontSize - 0.2)}
                  className="w-8 h-8 rounded-lg bg-space-800 hover:bg-space-700 text-slate-200 font-bold text-sm flex items-center justify-center">
                  A-
                </button>
                <span className="text-xs font-mono text-cyan-300 px-1 font-bold">
                  {Math.round(fontSize * 100)}%
                </span>
                <button
                  onClick={() => changeFontSize(fontSize + 0.2)}
                  className="w-8 h-8 rounded-lg bg-space-800 hover:bg-space-700 text-slate-200 font-bold text-sm flex items-center justify-center">
                  A+
                </button>
              </div>

            </div>

          </header>

          {/* Main Content Workspace */}
          <div className="flex-1 flex overflow-hidden">
            
            {/* 1. 오늘의 실험 카드 */}
            {activeTab === 'EXPERIMENT' && (
              <section className="flex-1 overflow-y-auto p-6 md:p-12 max-w-4xl mx-auto flex flex-col justify-center items-center text-center space-y-8">
                
                {labState.isSafeLandingActive ? (
                  <div className="w-full glass-box-safe rounded-3xl p-8 border-2 border-emerald-400 shadow-2xl text-left space-y-4">
                    <div className="flex items-center gap-3 text-emerald-300">
                      <span className="text-3xl">🛬</span>
                      <h2 className="text-2xl font-black">비상착륙 모드 (Safe Landing)</h2>
                    </div>
                    <p className="text-base text-slate-200 leading-relaxed">
                      "실험을 잠시 중단합니다. 데이터를 보니 지금은 방법의 문제가 아니라 <strong>연료의 문제</strong>예요. 자책하지 마세요."
                    </p>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                      <div className="p-4 bg-space-900 rounded-2xl border border-emerald-500/40 text-emerald-200 font-bold flex items-center gap-3">
                        <span className="text-2xl">☕</span> 오늘 유일한 미션: 따뜻한 물 한 잔
                      </div>
                      <div className="p-4 bg-space-900 rounded-2xl border border-emerald-500/40 text-emerald-200 font-bold flex items-center gap-3">
                        <span className="text-2xl">🛌</span> 오늘 밤 7시간 푹 자고 충전하기
                      </div>
                    </div>
                    <p className="text-xs text-slate-400 pt-2">
                      ※ 당신의 비법서는 그대로 안전하게 보관되어 있습니다. 없어지지 않아요. 내일 다시 만나요.
                    </p>
                    <button
                      onClick={toggleSafeLanding}
                      className="mt-2 px-6 py-3 rounded-xl font-bold text-sm bg-emerald-600 hover:bg-emerald-500 text-white transition">
                      충전 완료 후 일상 실험으로 복귀
                    </button>
                  </div>
                ) : (
                  <div className="w-full glass-box-active rounded-3xl p-8 md:p-12 border-2 border-cyan-400/50 shadow-2xl space-y-6 text-left">
                    
                    <div className="flex items-center justify-between border-b border-slate-800 pb-4 text-xs md:text-sm font-bold text-cyan-300">
                      <span className="flex items-center gap-2">
                        🧪 <strong>실험 #{labState.experimentNumber}</strong>
                      </span>
                      <span className="text-slate-400">연구자: 나 | 조수: AI</span>
                    </div>

                    <div className="p-5 bg-space-900 rounded-2xl border border-slate-800 space-y-2">
                      <span className="text-xs font-bold text-rose-300 block font-mono">가설 (Hypothesis)</span>
                      <p className="text-base font-bold text-white leading-relaxed">
                        "{labState.currentExperiment.hypothesis}"
                      </p>
                    </div>

                    <div className="p-5 bg-space-900 rounded-2xl border border-cyan-500/30 space-y-2">
                      <span className="text-xs font-bold text-cyan-300 block font-mono">오늘의 검증법 (Test Method)</span>
                      <p className="text-base font-medium text-slate-100 leading-relaxed">
                        {labState.currentExperiment.method}
                      </p>
                    </div>

                    {/* Timer Display */}
                    <div className="bg-space-900 py-8 rounded-3xl border-2 border-cyan-500/30 text-center shadow-inner">
                      <span className="text-6xl md:text-7xl font-black font-mono text-cyan-300 tracking-wider">
                        {Math.floor(timeLeft / 60)}:{(timeLeft % 60).toString().padStart(2, '0')}
                      </span>
                    </div>

                    {/* Action Buttons */}
                    <div className="space-y-3">
                      {!timerOn ? (
                        <div className="flex flex-col sm:flex-row gap-3">
                          <button
                            onClick={() => { setTimerOn(true); playSound('pop'); }}
                            className="flex-1 py-5 rounded-2xl font-black text-lg bg-gradient-to-r from-cyan-500 via-indigo-600 to-purple-600 text-white shadow-xl shadow-cyan-500/40 hover:scale-105 transition flex items-center justify-center gap-2">
                            <i data-lucide="play" className="w-6 h-6"></i>
                            <span>⏱️ 3분 실험 시작하기</span>
                          </button>
                          
                          <button
                            onClick={() => { setShowLadder(!showLadder); playSound('pop'); }}
                            className="py-5 px-6 rounded-2xl font-bold text-sm bg-space-800 hover:bg-space-700 text-slate-200 border border-slate-700 transition flex items-center justify-center gap-2">
                            <span>🪜 너무 부담돼요 (더 작게)</span>
                          </button>
                        </div>
                      ) : (
                        <div className="flex gap-4">
                          <button
                            onClick={() => { setTimerOn(false); playSound('pop'); }}
                            className="flex-1 py-4 rounded-2xl font-bold text-base bg-space-800 hover:bg-space-700 text-slate-200 border border-slate-700 transition">
                            잠깐 멈춤
                          </button>
                          <button
                            onClick={() => setTimeLeft(0)}
                            className="flex-1 py-4 rounded-2xl font-bold text-base bg-emerald-600 hover:bg-emerald-500 text-white transition">
                            ✓ 3분 실험 완료
                          </button>
                        </div>
                      )}
                    </div>

                    {/* Interactive Ladder Popup */}
                    {showLadder && (
                      <div className="p-5 bg-space-950 rounded-2xl border-2 border-cyan-400/40 space-y-3 mt-4">
                        <span className="text-xs font-bold text-slate-300 block">🪜 사다리 내려가기: 내 마음에 맞는 최소 크기를 골라보세요:</span>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                          {[
                            { level: 1, label: "1단계 (30초)", action: "파일/앱만 열고 쳐다보기", seconds: 30 },
                            { level: 2, label: "2단계 (3분)", action: "제목 한 줄 or 단어 3개 적기", seconds: 180 },
                            { level: 3, label: "3단계 (10분)", action: "목차 3개만 가볍게 적기", seconds: 600 },
                            { level: 4, label: "4단계 (25분)", action: "한 단락 집중해서 적기", seconds: 1500 }
                          ].map(ladder => (
                            <button
                              key={ladder.level}
                              onClick={() => selectLadder(ladder.level, ladder.seconds, ladder.action)}
                              className="p-3.5 rounded-xl bg-space-800 hover:bg-cyan-500/20 text-left border border-slate-700 hover:border-cyan-400 transition">
                              <span className="text-xs font-bold text-cyan-300 block">{ladder.label}</span>
                              <span className="text-sm font-medium text-slate-200">{ladder.action}</span>
                            </button>
                          ))}
                        </div>
                      </div>
                    )}

                  </div>
                )}

              </section>
            )}

            {/* 2. 관찰 기록 화면 (완료/미완료 버튼 삭제) */}
            {activeTab === 'RECORD' && (
              <section className="flex-1 overflow-y-auto p-6 md:p-12 max-w-4xl mx-auto space-y-8">
                
                <div>
                  <h2 className="text-2xl md:text-3xl font-black text-white">🔬 실험 #{labState.experimentNumber} 관찰 기록</h2>
                  <p className="text-sm md:text-base text-slate-300 mt-1">
                    이곳엔 '성공'도 '실패'도 없습니다. 무슨 일이 일어났는지 있는 그대로 관찰하고 데이터로 기록합니다.
                  </p>
                </div>

                <div className="glass-box-active rounded-3xl p-8 border-2 border-cyan-400/40 space-y-6">
                  
                  <span className="text-sm font-bold text-slate-200 block">무슨 일이 일어났나요? (선택해 주세요):</span>
                  
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {[
                      { id: 'NOT_STARTED', label: '🛑 시작도 못 함', desc: '의욕이 안 생기거나 다른 짓을 함 (유효한 데이터!)' },
                      { id: 'STOPPED_EARLY', label: '⏸️ 시작했다가 멈춤', desc: '1~2분 시도하다가 중단함' },
                      { id: 'COMPLETED_3MIN', label: '✅ 3분 완수 후 멈춤', desc: '3분 동안 형편없이 쓰고 정확히 멈춤' },
                      { id: 'EXCEEDED_3MIN', label: '🚀 3분 넘게 몰입함', desc: '시작하고 나니 탄력이 붙어 계속 함' }
                    ].map(opt => (
                      <button
                        key={opt.id}
                        onClick={() => recordObservation(opt.id)}
                        className="p-5 rounded-2xl bg-space-900 hover:bg-cyan-500/20 text-left border border-slate-700 hover:border-cyan-400 transition shadow-md group">
                        <span className="text-lg font-bold text-white group-hover:text-cyan-300 block mb-1">{opt.label}</span>
                        <span className="text-xs text-slate-400">{opt.desc}</span>
                      </button>
                    ))}
                  </div>

                  <div className="space-y-2 pt-2">
                    <span className="text-xs md:text-sm font-bold text-slate-300 block">그때 기분이 어땠나요? (선택 사항):</span>
                    <input
                      type="text"
                      value={observationNote}
                      onChange={(e) => setObservationNote(e.target.value)}
                      placeholder="예: '피곤해서 귀찮았음', '막상 시작하니 별거 아니었음'..."
                      className="w-full bg-space-950 border-2 border-slate-700 focus:border-cyan-400 rounded-2xl p-4 text-white placeholder-slate-500 focus:outline-none"
                    />
                  </div>

                </div>

                {/* AI Assistant Observation Feedback Box */}
                {showObservationSuccess && (
                  <div className="glass-box-active rounded-3xl p-8 border-2 border-gold-400/50 space-y-4 animate-fade-in">
                    <div className="flex items-center gap-2 text-gold-400 font-bold text-sm">
                      <i data-lucide="sparkles" className="w-5 h-5"></i>
                      <span>AI 실험 조수의 관찰 분석</span>
                    </div>
                    <p className="text-base font-semibold text-slate-100 leading-relaxed">
                      {aiObservationFeedback}
                    </p>
                    <button
                      onClick={() => { setActiveTab('MANUAL'); playSound('pop'); }}
                      className="px-6 py-3 rounded-xl font-bold text-sm bg-cyan-500/20 text-cyan-300 border border-cyan-400 hover:bg-cyan-500/30 transition">
                      📕 나의 사용설명서 확인하러 가기 ➔
                    </button>
                  </div>
                )}

              </section>
            )}

            {/* 3. 나의 사용설명서 (30개 잠금 해제 시스템) */}
            {activeTab === 'MANUAL' && (
              <section className="flex-1 overflow-y-auto p-6 md:p-12 max-w-5xl mx-auto space-y-8">
                
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-2xl md:text-3xl font-black text-white">📕 나의 사용설명서</h2>
                    <p className="text-sm md:text-base text-slate-300 mt-1">
                      실험 데이터가 쌓이며 하나씩 발견된 당신만의 과학적 행동 법칙입니다. ({labState.manualStats.discoveredCount}/30 발견됨)
                    </p>
                  </div>

                  <button
                    onClick={() => {
                      const doc = `# 📕 [나의 사용설명서: My User Manual]\n\n✅ 확정된 나의 법칙:\n1. 나는 오후 2시보다 오전 7시에 시작 성공 확률이 3배 높다 (근거: 실험 14회 중 오전 82% / 오후 27%)\n2. '완벽하게'라는 단어가 들어간 과제는 4일 이상 미룬다 (근거: 실험 9회 중 8회 지연)\n3. 3분 타이머로 '형편없이 쓰기'를 시도할 때 착수율이 88%로 급증한다\n\n"MBTI가 말한 것이라면, 이 설명서는 내가 실제로 '한 것'으로 쓰였습니다."`;
                      navigator.clipboard.writeText(doc);
                      playSound('cheer');
                      alert("사용설명서 카드 내용이 클립보드에 복사되었습니다! 인스타그램/스레드에 공유하세요.");
                    }}
                    className="px-5 py-3 rounded-xl font-bold text-sm md:text-base bg-gold-500/20 text-gold-300 border border-gold-400 hover:bg-gold-500/30 flex items-center gap-2 shadow-md">
                    <i data-lucide="share-2" className="w-5 h-5"></i>
                    <span>설명서 공유 카드 복사</span>
                  </button>
                </div>

                {/* Confirmed Rules */}
                <div className="space-y-4">
                  <h3 className="text-base font-bold text-emerald-400 flex items-center gap-2">
                    <span>✅ 실측 데이터로 확정된 법칙 ({labState.manualStats.confirmedRules.length}개)</span>
                  </h3>
                  
                  <div className="grid grid-cols-1 gap-4">
                    {labState.manualStats.confirmedRules.map(rule => (
                      <div key={rule.id} className="glass-box-active rounded-2xl p-6 border-2 border-emerald-500/40 space-y-2">
                        <div className="flex justify-between items-center">
                          <span className="text-xs font-mono font-bold text-emerald-300">법칙 #{rule.id.toString().padStart(2, '0')}</span>
                          <span className="text-xs text-slate-400">사용자 직접 확정 완료</span>
                        </div>
                        <p className="text-lg font-bold text-white leading-relaxed">
                          "{rule.rule}"
                        </p>
                        <span className="text-xs font-mono text-slate-400 block pt-1">
                          📊 실측 근거: {rule.evidence}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Testing Hypotheses */}
                <div className="space-y-4">
                  <h3 className="text-base font-bold text-cyan-400 flex items-center gap-2">
                    <span>🔍 현재 검증 중인 가설 ({labState.manualStats.testingHypotheses.length}개)</span>
                  </h3>
                  
                  <div className="grid grid-cols-1 gap-4">
                    {labState.manualStats.testingHypotheses.map(hypo => (
                      <div key={hypo.id} className="glass-box rounded-2xl p-6 border border-cyan-500/30 space-y-2">
                        <span className="text-xs font-mono font-bold text-cyan-300">가설 #{hypo.id.toString().padStart(2, '0')}</span>
                        <p className="text-base font-bold text-slate-200">
                          "{hypo.hypothesis}"
                        </p>
                        <span className="text-xs font-mono text-slate-400 block">
                          진행 상황: {hypo.progress}
                        </span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Locked Remaining Rules */}
                <div className="glass-box rounded-3xl p-8 border border-slate-800 text-center space-y-4">
                  <div className="text-3xl">🔒</div>
                  <h4 className="text-lg font-bold text-slate-300">아직 발견되지 않은 숨은 법칙 (23개 잠김)</h4>
                  <p className="text-xs md:text-sm text-slate-400 max-w-md mx-auto">
                    매일 3분 실험과 관찰 기록을 작성할 때마다 당신만의 행동 패턴이 하나씩 분석되어 잠금 해제됩니다.
                  </p>
                </div>

              </section>
            )}

          </div>

          {/* Pricing Modal (₩9,900 Pro) */}
          {showPricingModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-box-active rounded-3xl max-w-lg w-full p-8 border-2 border-gold-400 shadow-2xl space-y-6">
                
                <div className="flex justify-between items-center">
                  <span className="text-xs font-bold text-gold-400 bg-gold-500/20 px-3 py-1 rounded-full">
                    👑 3분 실험실 PRO
                  </span>
                  <button onClick={() => setShowPricingModal(false)} className="text-slate-400 hover:text-white font-bold">
                    ✕
                  </button>
                </div>

                <div className="text-center">
                  <h3 className="text-2xl md:text-3xl font-black text-white">월 9,900원의 나만의 사용설명서</h3>
                  <p className="text-sm text-slate-300 mt-1">나를 연구하고 행동 데이터로 평생 소장할 설명서를 쓰세요.</p>
                </div>

                <div className="space-y-3 text-sm text-slate-200">
                  <div className="p-3.5 bg-space-900 rounded-xl border border-slate-800 flex items-center gap-3">
                    <span className="text-emerald-400 font-bold">✓</span> 사용설명서 30개 법칙 무제한 잠금 해제
                  </div>
                  <div className="p-3.5 bg-space-900 rounded-xl border border-slate-800 flex items-center gap-3">
                    <span className="text-emerald-400 font-bold">✓</span> SOS 비상착륙 모드 & 번아웃 보호막
                  </div>
                  <div className="p-3.5 bg-space-900 rounded-xl border border-slate-800 flex items-center gap-3">
                    <span className="text-emerald-400 font-bold">✓</span> 주간 실험 리포트 및 소셜 공유 카드 발급
                  </div>
                </div>

                <button
                  onClick={() => {
                    alert("3분 실험실 Pro 사전 등록이 완료되었습니다!");
                    setShowPricingModal(false);
                    playSound('cheer');
                  }}
                  className="w-full py-4 rounded-xl font-black text-base bg-gradient-to-r from-gold-400 via-amber-500 to-yellow-500 text-black shadow-xl hover:scale-105 transition">
                  30일 챌린지 시작하기 (월 9,900원)
                </button>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
