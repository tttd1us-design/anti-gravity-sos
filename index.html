    const { useState, useEffect, useRef } = React;

    const playSound = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'bell') {
          [659.25, 880, 1046.5, 1318.51].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.08);
            gain.gain.setValueAtTime(0.06, ctx.currentTime + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.08);
            osc.stop(ctx.currentTime + i * 0.08 + 0.35);
          });
        } else if (type === 'cheer') {
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.05);
            gain.gain.setValueAtTime(0.05, ctx.currentTime + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.05 + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.05);
            osc.stop(ctx.currentTime + i * 0.05 + 0.2);
          });
        }
      } catch (e) {}
    };

          text: `[${shortAns}]을(를) 완성하기 위해 기꺼이 포기할 대가와 2026년 12월 31일의 구체적 성취 지표는?`,
          options: [

    // 하단 세트: 실시간 꼬꼬무 자아탐색 질문 & AI 행동 처방 생성기
    const generateDeepTailQuestionAndPrescription = (userInput, historyCount = 1) => {
      const text = (userInput || "").trim();

      if (!text) {
        return {
          tailQuestion: "작성자님께서 진정으로 이루고 싶은 목표나 현재 가장 큰 마음속 고민은 무엇인가요? 솔직하게 털어놓아 보세요.",
          aiPrescription: "👉 작성자님의 주관식 발화를 듣고 잠재의식의 본질을 파악하여, 지금 당장 해야 할 1가지 명확한 행동을 즉시 제시해 드립니다.",
          deepInsight: "내면의 욕망을 언어화하는 순간, 뇌는 해결책을 찾기 시작합니다."
        };
      }

      if (text.includes("돈") || text.includes("수익") || text.includes("월") || text.includes("부업") || text.includes("사업")) {
        return {
          tailQuestion: `말씀하신 "${text.substring(0, 22)}..."을(를) 달성하려는 '진짜 내면의 결핍'은 무엇인가요? (돈 그 자체가 아닌, 돈이 가져다줄 자유인가요, 아니면 인정 욕구인가요?)`,
          aiPrescription: `🎯 [AI 맞춤 처방]: 지금 당장 고객에게 판매할 '3분짜리 핵심 해결책(PDF/템플릿)' 1장의 제목을 정하고, 스마트폰 메모장에 3단어로 적으세요.`,
          deepInsight: `작성자님의 본질은 '수익 그 자체'보다 '타인에게 통제받지 않는 절대적인 시간의 주도권'을 갈망하고 계십니다.`
        };
      }

      if (text.includes("시간") || text.includes("피곤") || text.includes("퇴근") || text.includes("귀찮") || text.includes("미루")) {
        return {
          tailQuestion: `"${text.substring(0, 20)}..."라고 느끼게 만드는 가장 결정적인 에너지 누수 요인(스마트폰 숏폼, 불필요한 생각, 완벽주의)은 무엇이며, 왜 그것을 끊지 못하고 있을까요?`,
          aiPrescription: `⚡ [AI 맞춤 처방]: 1시간 작업하려 하지 말고, 지금 즉시 '3분 타이머'를 켜고 딱 1줄만 적고 작업을 멈추세요. 관성만 깨면 뇌가 알아서 몰입합니다.`,
          deepInsight: `의지력 부족이 아니라, 시작에 필요한 '마찰 에너지'가 너무 높게 설정되어 있습니다. 3분 단위로 마찰을 0으로 쪼개야 합니다.`
        };
      }

      return {
        tailQuestion: `방금 말씀하신 "${text.substring(0, 25)}..."이(가) 완전히 실현되었을 때, 1년 뒤 나의 하루 일과는 지금과 어떻게 달라져 있을까요? 구체적으로 상상해 보세요.`,
        aiPrescription: `🚀 [AI 맞춤 처방]: 지금 생각난 그 미래의 모습을 단 1문장의 [DCA 중심 확약문]으로 작성하여 우측 시스템에 저장하세요.`,
        deepInsight: `답변이 누적될수록 작성자님조차 미처 몰랐던 '본원적 자아와 핵심 가치관'이 선명한 성공 시스템으로 완성됩니다.`

      const [socraticRound, setSocraticRound] = useState(() => parseInt(localStorage.getItem('AG_SOCRATIC_ROUND') || '1', 10));
      const [activeQuestions, setActiveQuestions] = useState(() => generateChainedSocraticQuestions("월 100만 원 부업 수익 만들기", 1));

          return;

        if (isRecording) {
          isExplicitStopRef.current = true;
          setIsRecording(false);
          if (recognitionRef.current) recognitionRef.current.stop();
          playSound('pop');

          isExplicitStopRef.current = false;

          const recognition = new SpeechRecognition();
          recognition.lang = 'ko-KR';
          recognition.continuous = true;
          recognition.interimResults = true;

          recognition.onstart = () => setIsRecording(true);

          recognition.onresult = (event) => {
            for (let i = event.resultIndex; i < event.results.length; ++i) {
              if (event.results[i].isFinal) {
                const finalPiece = event.results[i][0].transcript.trim();
                setInputMsg(prev => (prev ? prev + " " : "") + finalPiece);

          };

          recognition.onerror = (event) => {
            if (event.error === 'not-allowed') {

              setIsRecording(false);
              isExplicitStopRef.current = true;
            }
          };

          recognition.onend = () => {
            if (!isExplicitStopRef.current) {
              try { recognition.start(); } catch (e) {}
            }
          };

          recognitionRef.current = recognition;

                    <div className={`p-4 rounded-2xl border transition space-y-2.5 ${socialAlarmSettings.enableTelegram ? 'bg-space-900/90 border-purple-400' : 'bg-space-950 border-slate-800 opacity-60'}`}>
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-black text-purple-300 flex items-center gap-1.5">
                          <span>✈️</span> 텔레그램 봇 푸시
                        </span>
                        <button
                          onClick={() => setSocialAlarmSettings({ ...socialAlarmSettings, enableTelegram: !socialAlarmSettings.enableTelegram })}
                          className={`w-10 h-5 rounded-full transition p-0.5 flex items-center ${socialAlarmSettings.enableTelegram ? 'bg-purple-500 justify-end' : 'bg-slate-700 justify-start'}`}>
                          <div className="w-4 h-4 rounded-full bg-white"></div>
                        </button>
                      </div>
                      <input
                        type="text"
                        value={socialAlarmSettings.telegramChatId}
                        onChange={(e) => setSocialAlarmSettings({ ...socialAlarmSettings, telegramChatId: e.target.value })}
                        placeholder="텔레그램 Chat ID / @사용자명"
                        className="w-full bg-space-950 border border-slate-700 rounded-xl px-2.5 py-1.5 text-xs text-purple-300 font-bold focus:border-purple-400 focus:outline-none"
                      />
                      <button
                        onClick={() => triggerChannelActionAlarm('✈️ 텔레그램', 'morning')}
                        className="w-full py-1.5 rounded-lg text-[11px] font-bold bg-purple-500/20 text-purple-300 border border-purple-400/60 hover:bg-purple-500/30">
                        ⚡ 텔레그램 행동지침 발송 테스트
                      </button>
                    </div>

                  </div>
                </div>

                {/* 2. 매일매일 정해진 시간 행동 유도 스케줄러 (Morning / Midday / Night) */}
                <div className="glass-box rounded-3xl p-6 md:p-7 border border-slate-800 space-y-5">
                  <div className="flex items-center justify-between">
                    <h3 className="text-base md:text-lg font-black text-white flex items-center gap-2">
                      <span>⏰</span> 매일매일 정해진 시간 행동 유도 스케줄러 (Daily Action Triggers)
                    </h3>
                    <span className="text-xs text-slate-400 font-mono">24시간 자동 가동 중</span>
                  </div>

                  <div className="space-y-3.5">
                    
                    {/* 1. 아침 07:00 행동 착수 알람 */}
                    <div className="p-4 bg-space-900 rounded-2xl border-l-4 border-cyan-400 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                      <div className="space-y-1">
                        <div className="flex items-center gap-2">
                          <span className="text-cyan-300 font-bold text-sm">☀️ [모닝 행동 착수 알람] ({socialAlarmSettings.morningAlarmTime})</span>
                          <span className="text-[10px] px-2 py-0.2 rounded bg-cyan-500/20 text-cyan-300 font-mono">GTD 3분 Runway 지침</span>
                        </div>
                        <p className="text-xs text-slate-200 leading-relaxed font-medium">
                          <strong>유도 메시지:</strong> "오늘 당장 3분 안에 할 1가지 행동: <strong>[{fiveMastersData.gtd.runway}]</strong>을 실행하세요!"
                        </p>
                        <div className="text-[11px] text-slate-400">
                          📌 연동 지침: {fiveMastersData.dalio.startDirectives}
                        </div>
                      </div>
                      <button
                        onClick={() => triggerChannelActionAlarm('전체 연동 채널', 'morning')}
                        className="px-3.5 py-2 rounded-xl text-xs font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-400 hover:bg-cyan-500/30 shrink-0">
                        🔔 모닝 지침 발송
                      </button>
                    </div>

                    {/* 2. 낮 13:00 마찰 방어 알람 */}
                    <div className="p-4 bg-space-900 rounded-2xl border-l-4 border-gold-400 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                      <div className="space-y-1">
                        <div className="flex items-center gap-2">
                          <span className="text-gold-300 font-bold text-sm">🌤️ [미드데이 모멘텀 부스터] ({socialAlarmSettings.middayAlarmTime})</span>
                          <span className="text-[10px] px-2 py-0.2 rounded bg-gold-500/20 text-gold-300 font-mono">Ray Dalio If-Then 방어</span>
                        </div>
                        <p className="text-xs text-slate-200 leading-relaxed font-medium">
                          <strong>유도 메시지:</strong> "{fiveMastersData.dalio.ifThenRule}"
                        </p>
                        <div className="text-[11px] text-slate-400">
                          📌 방어 지침: {fiveMastersData.dalio.stopDirectives}
                        </div>
                      </div>
                      <button
                        onClick={() => triggerChannelActionAlarm('전체 연동 채널', 'midday')}
                        className="px-3.5 py-2 rounded-xl text-xs font-bold bg-gold-500/20 text-gold-300 border border-gold-400 hover:bg-gold-500/30 shrink-0">
                        🔔 미드데이 지침 발송
                      </button>
                    </div>

                    {/* 3. 밤 22:00 데일리 결산 & 파트너 서약 알람 */}
                    <div className="p-4 bg-space-900 rounded-2xl border-l-4 border-purple-400 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                      <div className="space-y-1">
                        <div className="flex items-center gap-2">
                          <span className="text-purple-300 font-bold text-sm">🌙 [나이트 결산 & 파트너 상호 감시] ({socialAlarmSettings.nightAlarmTime})</span>
                          <span className="text-[10px] px-2 py-0.2 rounded bg-purple-500/20 text-purple-300 font-mono">Social Pledge</span>
                        </div>
                        <p className="text-xs text-slate-200 leading-relaxed font-medium">
                          <strong>유도 메시지:</strong> "오늘 3분 미션을 완수하셨나요? 미완수 시 파트너 {socialAlarmSettings.partnerName}님에게 {socialAlarmSettings.penaltyPerMiss}원이 청구됩니다."
                        </p>
                        <div className="text-[11px] text-slate-400">
                          🔗 서약 링크: {socialAlarmSettings.socialPledgeUrl}
                        </div>
                      </div>
                      <button
                        onClick={() => triggerChannelActionAlarm('전체 연동 채널', 'night')}
                        className="px-3.5 py-2 rounded-xl text-xs font-bold bg-purple-500/20 text-purple-300 border border-purple-400 hover:bg-purple-500/30 shrink-0">
                        🔔 나이트 결산 발송
                      </button>
                    </div>

                  </div>
                </div>

                {/* 3. 파트너 상호 감시 계약 설정 */}
                <div className="glass-box rounded-3xl p-6 border border-slate-800 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-rose-300 font-bold text-sm flex items-center gap-1.5">
                      <span>🤝</span> 파트너 상호 감시 및 벌금 계약 (Social Contract)
                    </span>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                    <div className="p-3 bg-space-950 rounded-xl border border-slate-800">
                      <label className="text-slate-400 block font-bold mb-1">감시 파트너 이름:</label>
                      <input
                        type="text"
                        value={socialAlarmSettings.partnerName}
                        onChange={(e) => setSocialAlarmSettings({ ...socialAlarmSettings, partnerName: e.target.value })}
                        className="w-full bg-space-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white font-bold focus:border-rose-400 focus:outline-none"
                      />
                    </div>
                    <div className="p-3 bg-space-950 rounded-xl border border-slate-800">
                      <label className="text-slate-400 block font-bold mb-1">미완수 1회당 벌금 (원):</label>
                      <input
                        type="text"
                        value={socialAlarmSettings.penaltyPerMiss}
                        onChange={(e) => setSocialAlarmSettings({ ...socialAlarmSettings, penaltyPerMiss: e.target.value })}
                        className="w-full bg-space-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-gold-300 font-bold focus:border-rose-400 focus:outline-none"
                      />
                    </div>
                  </div>
                </div>

              </div>
            )}

          </main>

          {/* 3-Minute Stamp Complete Modal */}
          {showStampPopup && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-box-active rounded-3xl max-w-md w-full p-8 text-center border-2 border-cyan-400 shadow-2xl">
                <div className="w-20 h-20 rounded-full bg-emerald-500/20 text-emerald-400 mx-auto flex items-center justify-center mb-4">
                  <span className="text-4xl">🎉</span>
                </div>
                <h3 className="text-2xl font-black text-white mb-2">3분 미션 성공 완료!</h3>
                <p className="text-sm text-slate-200 mb-6 leading-relaxed">
                  오늘의 귀차니즘을 멋지게 이겨내셨어요!<br/>
                  <strong>개인화된 성공관리시스템(AG-SMS)</strong>에 실행 데이터가 안전하게 누적되었습니다.
                </p>
                <button
                  onClick={() => setShowStampPopup(false)}
                  className="w-full py-4 rounded-xl font-bold text-base bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-lg">
                  확인
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
