    const { useState, useEffect, useRef } = React;

    const playSound = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'bell') {
          [659.25, 880, 1046.5, 1318.51].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.08);
            gain.gain.setValueAtTime(0.06, ctx.currentTime + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.08);
            osc.stop(ctx.currentTime + i * 0.08 + 0.35);
          });
        } else if (type === 'cheer') {
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.05);
            gain.gain.setValueAtTime(0.05, ctx.currentTime + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.05 + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.05);
            osc.stop(ctx.currentTime + i * 0.05 + 0.2);
          });
        }
      } catch (e) {}
    };

        if (isDragging) {
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);

        return () => {

                      </div>
                      {!set1Collapsed && (
                        <FontController label="세트1 글씨:" value={questionsFontSize} onChange={setQuestionsFontSize} />
                      )}
                    </div>

                    {!set1Collapsed && (
                      <div className="space-y-2 pt-1 animate-fadeIn">
                        <div className="flex flex-col gap-1.5" style={{ fontSize: `${questionsPx}px` }}>
                          {activeQuestions.map((q, idx) => {
                            const isSelected = selectedQuestion?.id === q.id;
                            return (
                              <button
                                key={q.id}
                                onClick={() => setSelectedQuestion(q)}
                                className={`w-full p-2.5 rounded-xl text-left border transition shadow-sm ${
                                  isSelected 
                                    ? 'bg-cyan-500/25 border-cyan-300 ring-2 ring-cyan-400/40' 
                                    : 'bg-space-850/80 hover:bg-cyan-500/15 border-slate-750 hover:border-cyan-400'
                                }`}>
                                <div className="flex items-center justify-between mb-0.5">
                                  <span className="font-black text-cyan-300 font-mono text-xs flex items-center gap-1.5">
                                    <span className="w-4 h-4 rounded bg-cyan-500/20 text-cyan-300 inline-flex items-center justify-center text-[10px] font-bold border border-cyan-500/40">
                                      {idx + 1}.
                                    </span>
                                    {q.title}
                                  </span>
                                  <span className="text-[9.5px] text-slate-300 px-1.5 py-0.2 rounded bg-space-900 border border-slate-800 font-medium">
                                    {q.pillar}
                                  </span>
                                </div>
                                <p className="text-slate-100 leading-snug font-medium pl-5 text-xs">
                                  {q.text}
                                </p>
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>

                  {/* SET 2 */}
                  <div className="p-3 bg-space-900/95 border-t border-cyan-500/30 space-y-2 shrink-0">
                    <div className="glass-box-active rounded-2xl p-3.5 border-2 border-indigo-400/60 bg-gradient-to-br from-space-900 via-indigo-950/40 to-purple-950/40 space-y-2 shadow-lg">
                      <div className="flex flex-wrap items-center justify-between gap-2">
                        <div className="flex items-center gap-2">
                          <button
                            onClick={() => { setSet2Collapsed(!set2Collapsed); playSound('pop'); }}
                            className="px-2 py-0.5 rounded-lg bg-space-800 hover:bg-purple-500/20 text-purple-300 text-xs font-bold border border-slate-700 hover:border-purple-400 flex items-center gap-1 transition shadow-sm">
                            <span>{set2Collapsed ? '▶ 세트2 펴기' : '▼ 세트2 접기'}</span>
                          </button>
                          <span className="text-xs font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-300 via-purple-300 to-indigo-300">
                            [세트 2] AI 실시간 꼬꼬무 자아탐색 & 행동 처방
                          </span>
                        </div>
                        {!set2Collapsed && (
                          <FontController label="세트2 글씨:" value={set2FontSize} onChange={setSet2FontSize} />
                        )}
                      </div>

                      {!set2Collapsed && (
                        <div className="space-y-2 pt-1 animate-fadeIn" style={{ fontSize: `${set2Px}px` }}>
                          <div className="p-2.5 bg-space-950/80 rounded-xl border border-purple-500/30">
                            <span className="text-[10.5px] text-pink-300 font-black block mb-0.5">
                              🔮 내 답변을 분석한 꼬리 질문 (본질 탐색):
                            </span>
                            <p className="text-white font-bold leading-relaxed">
                              "{currentTailInsight.tailQuestion}"
                            </p>
                          </div>
                          <div className="grid grid-cols-2 gap-2 text-xs">
                            <div className="p-2 bg-space-950/60 rounded-xl border border-emerald-500/30">
                              <span className="text-emerald-300 font-black block text-[10px] mb-0.5">⚡ AI 맞춤 행동 처방:</span>
                              <p className="text-slate-100 font-medium leading-snug">{currentTailInsight.aiPrescription}</p>
                            </div>
                            <div className="p-2 bg-space-950/60 rounded-xl border border-cyan-500/30">
                              <span className="text-cyan-300 font-black block text-[10px] mb-0.5">💎 잠재의식 통찰:</span>
                              <p className="text-slate-200 leading-snug">{currentTailInsight.deepInsight}</p>
                            </div>
                          </div>
                        </div>
                      )}
                    </div>

                    <form onSubmit={(e) => { e.preventDefault(); executeSend(inputMsg); }} className="flex flex-col gap-2">
                      <textarea
                        style={{ height: `${inputHeightPx}px`, fontSize: `${inputBoxPx}px` }}
                        value={inputMsg}
                        onChange={(e) => setInputMsg(e.target.value)}
                        placeholder="위 꼬리 질문에 대해 솔직한 생각이나 목표를 이야기해 보세요..."
                        className="w-full bg-space-950 border border-slate-700 focus:border-cyan-400 rounded-xl p-3 text-white placeholder-slate-400 focus:outline-none resize-y min-h-[50px]"
                      />
                      <button
                        type="submit"
                        disabled={!inputMsg.trim() || isThinking}
                        className="w-full py-2 bg-gradient-to-r from-cyan-500 to-indigo-600 text-white font-black rounded-xl text-xs md:text-sm">
                        🚀 꼬꼬무 탐색 & AI 처방 전송
                      </button>
                    </form>
                  </div>
                </section>

                <div onMouseDown={handleMouseDown} className={`resizer-bar ${isDragging ? 'dragging' : ''}`}></div>

                {/* 4대 계층 시스템 우측 뷰 */}
                <aside className="flex-1 p-6 overflow-y-auto space-y-4 bg-space-950/95" style={{ width: `${100 - leftWidthPercent}%`, fontSize: `${tierSystemPx}px` }}>
                  <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                    <h2 className="text-base font-black text-white">🏛️ 4개 계층 심층 성공관리시스템</h2>
                    <FontController label="4개 계층 글씨:" value={tierSystemFontSize} onChange={setTierSystemFontSize} />
                  </div>
                  <div className="glass-box-active p-5 rounded-3xl border-2 border-gold-400/50 space-y-2">
                    <strong className="text-gold-300 font-bold text-sm block">Tier 1. 잠재의식 & DCA</strong>
                    <p className="text-white font-bold text-sm">"{fiveMastersData.hill.definiteChiefAim}"</p>
                  </div>
                  <div className="glass-box p-5 rounded-3xl border border-emerald-500/40 space-y-2">
                    <strong className="text-emerald-300 font-bold text-sm block">Tier 3. GTD Runway</strong>
                    <p className="text-white font-bold text-sm">"{fiveMastersData.gtd.runway}"</p>
                  </div>
                </aside>
              </div>
            )}

            {/* 🌟 2. [대화&답변 백업로그] 탭 */}
            {mainNavTab === 'BACKUP_LOGS' && (
              <div className="flex-1 p-4 md:p-6 overflow-y-auto space-y-3.5 w-full max-w-5xl mx-auto" style={{ fontSize: `${backupPx}px` }}>
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h2 className="text-lg md:text-xl font-black text-teal-300">📒 실시간 대화 & 답변 백업로그 볼트 (Backup Vault)</h2>
                  <FontController label="백업 글씨:" value={backupFontSize} onChange={setBackupFontSize} />
                </div>
                <div className="space-y-2">
                  {qaBackupLogs.map((log, idx) => {
                    const isEditing = editingLogId === log.id;
                    return (
                      <div key={log.id} className="glass-box-active rounded-xl p-3 border border-slate-750 space-y-1.5">
                        <div className="flex justify-between items-center text-xs text-slate-400 border-b border-slate-800 pb-1.5">
                          <strong className="text-cyan-300 font-bold">#{idx + 1} {log.question}</strong>
                          <div className="flex items-center gap-1.5">
                            <span className="font-mono text-slate-500 text-[10.5px]">{log.time}</span>
                            {isEditing ? (
                              <button onClick={() => handleSaveEditBackupLog(log.id)} className="px-2 py-0.5 rounded bg-emerald-500 text-black font-black text-xs">💾 저장</button>
                            ) : (
                              <>
                                <button onClick={() => handleStartEditBackupLog(log)} className="px-2 py-0.5 rounded bg-space-800 text-cyan-300 font-bold text-[11px]">✏️ 수정</button>
                                <button onClick={() => handleDeleteBackupLog(log.id)} className="px-2 py-0.5 rounded bg-space-800 text-rose-400 font-bold text-[11px]">🗑️ 삭제</button>
                              </>
                            )}
                          </div>
                        </div>
                        {isEditing ? (
                          <textarea value={editAnswerText} onChange={(e) => setEditAnswerText(e.target.value)} rows={2} className="w-full bg-space-950 border border-emerald-400 rounded-lg p-2 text-white text-xs" />
                        ) : (
                          <p className="text-white font-medium pl-1.5 bg-space-950/70 p-2 rounded-lg text-xs leading-snug">{log.answer}</p>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* 🌟 3. [5대 시스템종합] 탭 */}
            {mainNavTab === 'MATRIX' && (
              <div className="flex-1 p-6 md:p-8 overflow-y-auto space-y-6 w-full max-w-7xl mx-auto" style={{ fontSize: `${analysisPx}px` }}>
                <h2 className="text-xl font-black text-white border-b border-slate-800 pb-4">📑 5대 시스템종합 데이터 아키텍처 매트릭스</h2>
                <div className="glass-box rounded-3xl overflow-hidden border border-cyan-500/30 shadow-2xl">
                  <table className="w-full text-left border-collapse text-xs md:text-sm">
                    <thead>
                      <tr className="bg-space-900 border-b border-cyan-500/40 text-cyan-300 font-black">
                        <th className="p-4 border-r border-slate-800">시스템 거장</th>
                        <th className="p-4 border-r border-slate-800">핵심 원리</th>
                        <th className="p-4">내 대화 기반 산출물</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {['dalio', 'robbins', 'forte', 'hill', 'gtd'].map(k => (
                        <tr key={k} className="hover:bg-space-900/60">
                          <td className="p-4 font-black text-white border-r border-slate-800">{MASTER_SYSTEMS_CANONICAL[k].bookTitle}</td>
                          <td className="p-4 text-slate-200 border-r border-slate-800">{MASTER_SYSTEMS_CANONICAL[k].corePrinciple}</td>
                          <td className="p-4 text-cyan-300 font-bold">{MASTER_SYSTEMS_CANONICAL[k].immutablePrinciple}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {/* 🌟 5. [행동연계] 탭 */}
            {mainNavTab === 'ACTION' && (
              <div className="flex-1 p-6 md:p-8 overflow-y-auto space-y-6 w-full max-w-5xl mx-auto" style={{ fontSize: `${actionPx}px` }}>
                <h2 className="text-xl font-black text-gold-300">⚡ 5대 시스템 행동연계 관제탑</h2>
                <div className="glass-box-active p-8 rounded-3xl border-2 border-cyan-400 space-y-4">
                  <strong className="text-cyan-300 block text-lg">오늘 지금 당장 3분 마이크로 실행 미션</strong>
                  <p className="text-white font-black text-xl">"{fiveMastersData.gtd.runway}"</p>
                  <button onClick={() => { setTimeLeft(180); setTimerOn(true); playSound('pop'); }} className="px-6 py-3 rounded-xl bg-cyan-500 text-black font-black">
                    🚀 3분 타이머 시작
                  </button>
                </div>
              </div>
            )}

            {/* 🌟 6. [소셜 알람] 탭 */}
            {mainNavTab === 'SOCIAL_ALARM' && (
              <div className="flex-1 p-6 md:p-8 overflow-y-auto space-y-6 w-full max-w-5xl mx-auto" style={{ fontSize: `${alarmPx}px` }}>
                <h2 className="text-xl font-black text-rose-300">🔔 소셜 알람 & 다채널 행동 유도 관제 센터</h2>
                <div className="glass-box p-6 rounded-3xl border border-slate-800 space-y-4">
                  <p className="text-slate-200 text-sm">메일, 카카오톡, 텔레그램을 통해 매일 정해진 시간(07:00 / 13:00 / 22:00)에 오늘 내가 해야 할 명확한 행동 지침을 전송합니다.</p>
                </div>
              </div>
            )}

          </main>

          {/* 3-Minute Stamp Complete Modal */}
          {showStampPopup && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-box-active rounded-3xl max-w-md w-full p-8 text-center border-2 border-cyan-400 shadow-2xl">
                <span className="text-4xl block mb-2">🎉</span>
                <h3 className="text-2xl font-black text-white mb-2">3분 미션 성공 완료!</h3>
                <button onClick={() => setShowStampPopup(false)} className="w-full py-3 bg-cyan-500 text-black font-bold rounded-xl mt-4">
                  확인
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
