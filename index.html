<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>안티그레비티 - 눈이 편안한 3분 성공 습관 (30분 연속 음성 인식 지원)</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            space: {
              950: '#030508',
              900: '#070B12',
              850: '#0D1422',
              800: '#141E33',
              700: '#1D2A47',
            },
            cyan: {
              300: '#67E8F9',
              400: '#22D3EE',
              500: '#06B6D4',
              glow: '#00F0FF',
            },
            gold: {
              300: '#FDE047',
              400: '#FACC15',
              500: '#EAB308',
              glow: '#FFD700',
            },
            rose: {
              400: '#FB7185',
              500: '#F43F5E',
              600: '#E11D48',
            }
          },
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #030508;
      color: #F8FAFC;
      font-family: 'Pretendard', sans-serif;
      overflow-x: hidden;
      font-size: 18px;
      line-height: 1.7;
      transition: font-size 0.15s ease;
    }
    
    .bg-soft-pattern {
      background-image: 
        linear-gradient(to right, rgba(34, 211, 238, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(34, 211, 238, 0.03) 1px, transparent 1px);
      background-size: 36px 36px;
    }
    
    .glass-box {
      background: rgba(13, 20, 34, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid rgba(34, 211, 238, 0.22);
    }

    .glass-box-active {
      background: rgba(13, 20, 34, 0.96);
      backdrop-filter: blur(22px);
      border: 2px solid rgba(0, 240, 255, 0.55);
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.18);
    }

    .mic-pulse {
      animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }

    @keyframes pulse-ring {
      0% {
        box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.7);
      }
      70% {
        box-shadow: 0 0 0 14px rgba(244, 63, 94, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(244, 63, 94, 0);
      }
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #070B12;
    }
    ::-webkit-scrollbar-thumb {
      background: #1D2A47;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00F0FF;
    }
  </style>
</head>
<body class="bg-soft-pattern min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const playSound = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.06);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.06);
        } else if (type === 'cheer') {
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.06);
            gain.gain.setValueAtTime(0.06, ctx.currentTime + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.06 + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.06);
            osc.stop(ctx.currentTime + i * 0.06 + 0.25);
          });
        }
      } catch (e) {}
    };

    const EASY_GOALS = [
      { id: 'diet', icon: '🏃', title: '운동 & 건강 관리', text: '매일 15분씩 가볍게 운동하고 건강한 몸을 만들고 싶어요.' },
      { id: 'money', icon: '💰', title: '월 100만원 더 벌기', text: '월급 외에 부업이나 온라인 수익으로 월 100만 원을 더 벌고 싶어요.' },
      { id: 'study', icon: '📖', title: '자격증 / 시험 합격', text: '미루지 않고 꾸준히 공부해서 목표 시험에 꼭 합격하고 싶어요.' },
      { id: 'book', icon: '✍️', title: '책 쓰기 / 블로그 시작', text: '나만의 생각과 경험을 정리해서 책이나 블로그를 운영하고 싶어요.' },
      { id: 'habit', icon: '✨', title: '아침 기상 & 좋은 습관', text: '아침에 상쾌하게 일어나서 나만의 알찬 하루를 시작하고 싶어요.' }
    ];

    const EASY_REASONS = [
      { label: '잘하려다 보니 시작이 무서워요', text: '완벽하게 잘하고 싶은 마음에 자꾸 망설이다가 시작을 못 해요.' },
      { label: '해야 할 양이 너무 많아 막막해요', text: '양이 너무 방대해서 어디서부터 손대야 할지 엄두가 안 나요.' },
      { label: '퇴근하면 피곤해서 폰만 보게 돼요', text: '하루 종일 일하고 오면 기운이 빠져서 유튜브만 보며 시간을 보내요.' },
      { label: '실패하면 속상할까 봐 걱정돼요', text: '열심히 했는데 결과가 안 좋을까 봐 불안해서 피하게 돼요.' }
    ];

    function App() {
      // 폰트 배율 (기본 1.6 = 눈이 편안한 큼직한 글씨)
      const [fontSize, setFontSize] = useState(() => {
        return parseFloat(localStorage.getItem('AG_EASY_FONT') || '1.6');
      });

      const [activeTab, setActiveTab] = useState('COACH');

      const [myProgress, setMyProgress] = useState(() => {
        const saved = localStorage.getItem('AG_EASY_PROGRESS_V1');
        return saved ? JSON.parse(saved) : {
          streakDays: 3,
          stampCount: 7,
          targetGoal: '월 100만 원 부업 수익 만들기',
          fearReason: '완벽하게 하려다 시작을 못 하는 마음',
          easyMission: '스마트폰 메모장을 켜고 아이디어 단어 3개만 적기',
          lazinessScore: 20
        };
      });

      const [timeLeft, setTimeLeft] = useState(180);
      const [timerOn, setTimerOn] = useState(false);
      const [showStampPopup, setShowStampPopup] = useState(false);

      const [messages, setMessages] = useState([
        {
          id: 1,
          sender: 'coach',
          text: `안녕하세요! 반갑습니다 😊\n\n저는 당신이 **'귀찮음과 두려움'을 이겨내고 원하는 것을 쉽게 이루도록 돕는 AI 성공 친구**예요.\n\n거창한 계획을 세워도 자꾸 미루게 되는 건 당신이 게을러서가 아니에요. 시작할 때 마음에 너무 큰 부담을 느끼기 때문이에요!\n\n현재 가장 이루고 싶은 목표는 무엇인가요? 아래 버튼을 누르거나 **🎙️ 음성 마이크 버튼**을 눌러 편하게 말씀해 보세요 👇`,
          time: '지금'
        }
      ]);
      const [inputMsg, setInputMsg] = useState("");
      const [isThinking, setIsThinking] = useState(false);
      const chatEndRef = useRef(null);

      // --- 30분 이상 연속 음성 인식(STT) 엔진 상태 ---
      const [isRecording, setIsRecording] = useState(false);
      const [recordDuration, setRecordDuration] = useState(0);
      const [speechSupported, setSpeechSupported] = useState(true);
      const recognitionRef = useRef(null);
      const isExplicitStopRef = useRef(false);
      const recordTimerRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('AG_EASY_PROGRESS_V1', JSON.stringify(myProgress));
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [messages, myProgress, activeTab, fontSize, isRecording, recordDuration]);

      // 3분 미션 타이머
      useEffect(() => {
        let timer = null;
        if (timerOn && timeLeft > 0) {
          timer = setInterval(() => setTimeLeft(t => t - 1), 1000);
        } else if (timeLeft === 0 && timerOn) {
          setTimerOn(false);
          playSound('cheer');
          if (window.confetti) {
            window.confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
          }
          setMyProgress(prev => ({
            ...prev,
            stampCount: prev.stampCount + 1,
            streakDays: prev.streakDays + 1,
            lazinessScore: 10
          }));
          setShowStampPopup(true);
        }
        return () => clearInterval(timer);
      }, [timerOn, timeLeft]);

      // 음성 녹음 시간 카운터
      useEffect(() => {
        if (isRecording) {
          recordTimerRef.current = setInterval(() => {
            setRecordDuration(sec => sec + 1);
          }, 1000);
        } else {
          clearInterval(recordTimerRef.current);
          setRecordDuration(0);
        }
        return () => clearInterval(recordTimerRef.current);
      }, [isRecording]);

      // --- Web Speech API 초기화 & 30분+ 무한 연속 자동 재연결 로직 ---
      const toggleVoiceRecording = () => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert("현재 브라우저가 음성 인식을 지원하지 않습니다. Chrome, Edge 또는 Safari 최신 버전을 사용해 주세요.");
          setSpeechSupported(false);
          return;
        }

        if (isRecording) {
          // 녹음 중지
          isExplicitStopRef.current = true;
          setIsRecording(false);
          if (recognitionRef.current) {
            recognitionRef.current.stop();
          }
          playSound('pop');
        } else {
          // 30분 연속 녹음 시작
          isExplicitStopRef.current = false;
          playSound('pop');

          const recognition = new SpeechRecognition();
          recognition.lang = 'ko-KR';
          recognition.continuous = true;
          recognition.interimResults = true;
          recognition.maxAlternatives = 1;

          recognition.onstart = () => {
            setIsRecording(true);
          };

          recognition.onresult = (event) => {
            let currentTranscript = "";
            for (let i = event.resultIndex; i < event.results.length; ++i) {
              if (event.results[i].isFinal) {
                const finalPiece = event.results[i][0].transcript.trim();
                setInputMsg(prev => {
                  const prefix = prev ? prev + " " : "";
                  return prefix + finalPiece;
                });
              }
            }
          };

          recognition.onerror = (event) => {
            console.warn("음성 인식 이벤트 알림:", event.error);
            if (event.error === 'not-allowed') {
              alert("마이크 사용 권한이 필요합니다. 브라우저 주소창 좌측 자물쇠 아이콘에서 마이크 권한을 허용해 주세요.");
              setIsRecording(false);
              isExplicitStopRef.current = true;
            }
          };

          // 30분 이상 유지를 위한 자동 재연결(Keep-Alive) 메커니즘
          recognition.onend = () => {
            if (!isExplicitStopRef.current) {
              // 브라우저 세션 타임아웃 발생 시 즉시 자동 재연결하여 끊김 없이 30분 이상 계속 작성
              try {
                recognition.start();
              } catch (e) {
                setTimeout(() => {
                  if (!isExplicitStopRef.current) {
                    try { recognition.start(); } catch (err) {}
                  }
                }, 300);
              }
            }
          };

          recognitionRef.current = recognition;
          try {
            recognition.start();
          } catch (e) {
            console.error("음성 인식 시작 오류:", e);
          }
        }
      };

      const changeFontSize = (scale) => {
        const val = Math.min(2.4, Math.max(1.1, parseFloat(scale.toFixed(1))));
        setFontSize(val);
        localStorage.setItem('AG_EASY_FONT', val.toString());
        playSound('pop');
      };

      const sendChat = (presetText) => {
        const text = (presetText || inputMsg).trim();
        if (!text || isThinking) return;

        // 전송 시 녹음 종료
        if (isRecording) {
          isExplicitStopRef.current = true;
          setIsRecording(false);
          if (recognitionRef.current) {
            recognitionRef.current.stop();
          }
        }

        const userMsg = {
          id: Date.now(),
          sender: 'user',
          text,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setMessages(prev => [...prev, userMsg]);
        setInputMsg("");
        playSound('pop');
        setIsThinking(true);

        setTimeout(() => {
          let reply = "";
          if (messages.length === 1) {
            reply = `정말 좋은 목표네요! 👏\n\n그런데 이 목표를 시작하려고 할 때, 마음에 브레이크가 걸리거나 자꾸 미루게 만드는 **'진짜 속마음'**은 무엇인가요?\n\n솔직한 내 마음을 아래에서 골라보거나 음성 마이크로 편하게 털어놓아 보세요.`;
            setMyProgress(prev => ({ ...prev, targetGoal: text }));
          } else if (messages.length === 3) {
            reply = `맞아요, 정말 많은 분들이 똑같은 고민을 해요.\n\n완벽하게 잘하고 싶은 마음이 크다 보니 뇌가 너무 큰 에너지가 든다고 착각해서 시작을 망설이는 거예요.\n\n그래서 지금 이 순간, **'마음 편한 3분 초간단 미션'**을 드릴게요!\n\n오늘 딱 3분만 **"${myProgress.easyMission}"** 해보는 거예요. 3분만 하고 바로 그만두셔도 돼요!\n\n상단의 **[⏱️ 3분 타이머]** 탭을 누르고 함께 3분을 시작해 볼까요?`;
            setMyProgress(prev => ({ ...prev, fearReason: text, lazinessScore: 20 }));
            playSound('cheer');
            if (window.confetti) {
              window.confetti({ particleCount: 70, spread: 60, origin: { y: 0.65 } });
            }
          } else {
            reply = `정말 훌륭해요! 3분의 작은 성공이 뇌를 깨우고 기분 좋은 도파민을 만들어냅니다. 오늘 해낸 성공을 기록장에 잘 보관했어요! 🌟`;
          }

          const coachMsg = {
            id: Date.now() + 1,
            sender: 'coach',
            text: reply,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };

          setMessages(prev => [...prev, coachMsg]);
          setIsThinking(false);
        }, 450);
      };

      const formatTime = (seconds) => {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const currentFontPx = Math.max(18, 14 * fontSize);

      return (
        <div className="flex flex-col h-screen max-h-screen">
          
          {/* Header */}
          <header className="h-24 border-b border-cyan-500/20 glass-box px-4 md:px-8 flex items-center justify-between z-20">
            
            <div className="flex items-center space-x-4">
              <div className="w-12 h-12 md:w-14 md:h-14 rounded-2xl bg-gradient-to-br from-cyan-400 via-indigo-600 to-purple-600 flex items-center justify-center shadow-lg shadow-cyan-500/30">
                <span className="text-3xl">🌱</span>
              </div>
              <div>
                <div className="flex items-center gap-2.5">
                  <h1 className="text-xl md:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-white to-gold-300 tracking-tight">
                    안티그레비티
                  </h1>
                  <span className="text-sm font-bold px-3 py-0.5 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/40">
                    쉬운 성공 습관
                  </span>
                </div>
                <p className="text-sm md:text-base text-slate-300 font-medium">30분 연속 음성 작성 & 3분 성공 실천</p>
              </div>
            </div>

            {/* Navigation Tabs */}
            <nav className="hidden md:flex items-center space-x-2 bg-space-900 border border-slate-800 rounded-2xl p-1.5">
              {[
                { id: 'COACH', label: '💬 AI 성공 대화', icon: 'message-circle' },
                { id: 'TIMER', label: '⏱️ 3분 시작 타이머', icon: 'zap' },
                { id: 'RECORD', label: '📒 나의 성공 기록장', icon: 'book-open' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => { setActiveTab(tab.id); playSound('pop'); }}
                  className={`px-4 py-2.5 rounded-xl text-sm md:text-base font-bold flex items-center gap-2 transition ${
                    activeTab === tab.id
                      ? 'bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-md shadow-cyan-500/30'
                      : 'text-slate-300 hover:text-white hover:bg-space-800'
                  }`}>
                  <i data-lucide={tab.icon} className="w-5 h-5"></i>
                  <span>{tab.label}</span>
                </button>
              ))}
            </nav>

            {/* Font Controller */}
            <div className="flex items-center space-x-2 bg-space-900 border border-slate-700 rounded-2xl px-3 py-1.5 shadow-md">
              <span className="text-sm font-bold text-slate-300 mr-1 hidden sm:inline">글씨 크기:</span>
              
              <button
                onClick={() => changeFontSize(fontSize - 0.2)}
                title="글씨 작게"
                className="w-9 h-9 rounded-xl bg-space-800 hover:bg-space-700 text-slate-200 font-bold text-base flex items-center justify-center transition border border-slate-700">
                A-
              </button>
              
              <span className="text-sm md:text-base font-bold font-mono text-cyan-300 px-2 min-w-[55px] text-center">
                {Math.round(fontSize * 100)}%
              </span>
              
              <button
                onClick={() => changeFontSize(fontSize + 0.2)}
                title="글씨 크게"
                className="w-9 h-9 rounded-xl bg-space-800 hover:bg-space-700 text-slate-200 font-bold text-base flex items-center justify-center transition border border-slate-700">
                A+
              </button>

              <div className="hidden lg:flex items-center gap-1.5 border-l border-slate-800 pl-2 ml-1">
                {[
                  { label: '보통', scale: 1.3 },
                  { label: '크게', scale: 1.6 },
                  { label: '아주크게', scale: 2.0 }
                ].map(p => (
                  <button
                    key={p.scale}
                    onClick={() => changeFontSize(p.scale)}
                    className={`px-2.5 py-1 text-sm font-bold rounded-lg transition ${
                      Math.abs(fontSize - p.scale) < 0.15 ? 'bg-cyan-400 text-black font-extrabold' : 'text-slate-300 hover:text-white bg-space-800'
                    }`}>
                    {p.label}
                  </button>
                ))}
              </div>
            </div>

          </header>

          {/* Main Layout */}
          <div className="flex-1 flex overflow-hidden">
            
            {/* TAB 1: COACH CHAT WITH 30-MIN VOICE INPUT */}
            {activeTab === 'COACH' && (
              <div className="flex-1 flex overflow-hidden">
                
                {/* Chat Area */}
                <section className="flex-1 flex flex-col bg-space-950/80 border-r border-cyan-500/10 relative">
                  
                  {/* Status Bar */}
                  <div className="bg-space-900/95 border-b border-cyan-500/10 px-6 py-3 flex items-center justify-between text-sm md:text-base font-medium">
                    <div className="flex items-center gap-2">
                      <span className="text-gold-300 font-bold flex items-center gap-1.5">
                        🔥 <strong>{myProgress.streakDays}일 연속</strong> 목표 달성 중!
                      </span>
                    </div>
                    <div className="text-slate-300">
                      참 잘했어요 도장: <strong className="text-cyan-300 text-base">{myProgress.stampCount}개</strong>
                    </div>
                  </div>

                  {/* Messages */}
                  <div className="flex-1 overflow-y-auto p-5 md:p-8 space-y-7">
                    {messages.map(m => (
                      <div key={m.id} className={`flex flex-col ${m.sender === 'user' ? 'items-end' : 'items-start'}`}>
                        <div className="flex items-center gap-2 mb-1.5 px-1">
                          <span className="text-sm font-bold text-cyan-400">
                            {m.sender === 'coach' ? '🌱 안티그레비티 AI 코치' : '👤 나'}
                          </span>
                          <span className="text-xs text-slate-400">{m.time}</span>
                        </div>

                        <div className={`max-w-[94%] md:max-w-[88%] rounded-3xl p-6 leading-relaxed shadow-lg ${
                          m.sender === 'user'
                            ? 'bg-gradient-to-r from-cyan-950/90 to-indigo-950/95 border-2 border-cyan-500/40 text-white rounded-tr-none'
                            : 'glass-box-active text-slate-100 border-l-[6px] border-l-cyan-400 rounded-tl-none'
                        }`} style={{ fontSize: `${currentFontPx}px`, lineHeight: '1.75' }}>
                          <p className="whitespace-pre-line font-medium">{m.text}</p>
                        </div>
                      </div>
                    ))}

                    {isThinking && (
                      <div className="flex items-center space-x-3 text-cyan-300 text-base font-medium p-4 glass-box rounded-2xl w-fit">
                        <i data-lucide="loader-2" className="w-5 h-5 animate-spin"></i>
                        <span>마음 편한 방법을 생각하고 있어요...</span>
                      </div>
                    )}
                    <div ref={chatEndRef} />
                  </div>

                  {/* Quick Goal Buttons (Turn 1) */}
                  {messages.length === 1 && (
                    <div className="px-5 md:px-8 py-4 bg-space-900/95 border-t border-cyan-500/20">
                      <span className="text-sm font-bold text-slate-300 block mb-2.5">👇 아래에서 원하는 목표를 누르거나 마이크로 말씀하세요:</span>
                      <div className="grid grid-cols-2 md:grid-cols-3 gap-2.5">
                        {EASY_GOALS.map(g => (
                          <button
                            key={g.id}
                            onClick={() => sendChat(g.text)}
                            className="p-3.5 rounded-2xl bg-space-800 hover:bg-cyan-500/20 text-left border border-slate-700 hover:border-cyan-400 transition shadow-md">
                            <div className="flex items-center gap-2 mb-1">
                              <span className="text-xl">{g.icon}</span>
                              <span className="text-sm md:text-base font-bold text-slate-100">{g.title}</span>
                            </div>
                            <span className="text-xs md:text-sm text-slate-300 truncate block">{g.text}</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Quick Reason Buttons (Turn 2) */}
                  {messages.length === 2 && (
                    <div className="px-5 md:px-8 py-4 bg-space-900/95 border-t border-cyan-500/20">
                      <span className="text-sm font-bold text-slate-300 block mb-2.5">👇 왜 시작이 망설여지시나요?</span>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-2.5">
                        {EASY_REASONS.map((r, i) => (
                          <button
                            key={i}
                            onClick={() => sendChat(r.text)}
                            className="p-4 rounded-2xl bg-space-800 hover:bg-rose-500/20 text-left border border-slate-700 hover:border-rose-400 transition shadow-md">
                            <span className="text-sm md:text-base font-semibold text-rose-200 block leading-snug">{r.label}</span>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Voice Recording Live Floating Banner */}
                  {isRecording && (
                    <div className="px-6 py-2.5 bg-rose-950/90 border-t border-rose-500/40 flex items-center justify-between text-sm md:text-base font-bold text-rose-200 animate-pulse">
                      <div className="flex items-center gap-2.5">
                        <span className="w-3 h-3 rounded-full bg-rose-500 mic-pulse inline-block"></span>
                        <span>🎙️ 30분 연속 음성 인식 중... (말씀하시면 실시간 입력됩니다)</span>
                      </div>
                      <div className="font-mono text-gold-300 bg-space-900 px-3 py-1 rounded-xl border border-rose-500/30">
                        ⏱️ {formatTime(recordDuration)} / 30:00+
                      </div>
                    </div>
                  )}

                  {/* Input Box with 30-Minute Continuous Mic Button */}
                  <div className="p-5 md:p-6 bg-space-900/95 border-t border-cyan-500/20">
                    <form onSubmit={(e) => { e.preventDefault(); sendChat(); }} className="relative flex items-center gap-3">
                      
                      <div className="relative flex-1">
                        <textarea
                          rows="2"
                          value={inputMsg}
                          onChange={(e) => setInputMsg(e.target.value)}
                          onKeyDown={(e) => {
                            if (e.key === 'Enter' && !e.shiftKey) {
                              e.preventDefault();
                              sendChat();
                            }
                          }}
                          placeholder={isRecording ? "마이크로 편하게 계속 말씀하세요 (실시간 30분 작성 가능)..." : "하고 싶은 말이나 고민을 편하게 적거나 마이크를 누르세요..."}
                          className={`w-full bg-space-950 border-2 rounded-2xl px-6 py-4 text-white placeholder-slate-400 focus:outline-none resize-none pr-36 font-sans leading-relaxed transition ${
                            isRecording ? 'border-rose-500 ring-2 ring-rose-500/30' : 'border-slate-700 focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400'
                          }`}
                          style={{ fontSize: `${currentFontPx}px` }}
                        />

                        {/* 🎙️ 30분 연속 음성 마이크 버튼 */}
                        <button
                          type="button"
                          onClick={toggleVoiceRecording}
                          title={isRecording ? "음성 인식 중지" : "30분 연속 음성 작성 시작"}
                          className={`absolute right-20 bottom-3.5 px-3.5 py-3 rounded-xl font-bold text-sm flex items-center gap-1.5 transition ${
                            isRecording
                              ? 'bg-rose-600 text-white mic-pulse shadow-lg shadow-rose-600/50 hover:bg-rose-500'
                              : 'bg-space-800 hover:bg-space-700 text-cyan-300 border border-slate-700 hover:border-cyan-400'
                          }`}>
                          <i data-lucide={isRecording ? "mic-off" : "mic"} className="w-5 h-5"></i>
                          <span className="hidden sm:inline">{isRecording ? "중지" : "음성"}</span>
                        </button>

                        {/* 전송 버튼 */}
                        <button
                          type="submit"
                          disabled={!inputMsg.trim() || isThinking}
                          className={`absolute right-3.5 bottom-3.5 px-5 py-3 rounded-xl font-bold text-base flex items-center gap-1.5 transition ${
                            inputMsg.trim() && !isThinking
                              ? 'bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-lg shadow-cyan-500/40 hover:scale-105'
                              : 'bg-space-800 text-slate-500 cursor-not-allowed'
                          }`}>
                          <span>전송</span>
                          <i data-lucide="send" className="w-4 h-4"></i>
                        </button>
                      </div>

                    </form>
                  </div>
                </section>

                {/* Right Side Panel */}
                <aside className="hidden lg:flex w-4/12 flex-col bg-space-950/90 p-7 space-y-7 overflow-y-auto">
                  
                  {/* Mission Card */}
                  <div className="glass-box-active rounded-3xl p-7 border-2 border-cyan-400/40 text-center">
                    <span className="inline-block text-sm font-bold text-cyan-300 bg-cyan-500/20 px-3.5 py-1.5 rounded-full mb-3.5">
                      ⚡ 부담 없는 오늘의 3분 미션
                    </span>
                    <p className="text-lg md:text-xl font-bold text-white mb-5 leading-snug">
                      "{myProgress.easyMission}"
                    </p>
                    <button
                      onClick={() => { setActiveTab('TIMER'); playSound('pop'); }}
                      className="w-full py-4 rounded-2xl font-black text-base bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-lg hover:scale-105 transition flex items-center justify-center gap-2">
                      <i data-lucide="play" className="w-5 h-5"></i>
                      <span>지금 3분 타이머 켜기</span>
                    </button>
                  </div>

                  {/* 30-Min Voice Assistant Guide */}
                  <div className="glass-box rounded-3xl p-6 border border-slate-800 space-y-2.5">
                    <span className="text-xs font-bold text-rose-300 block font-mono">🎙️ 30분 연속 음성 작성 팁</span>
                    <p className="text-xs md:text-sm text-slate-300 leading-relaxed">
                      타이핑할 필요 없이 마이크 버튼을 켜두고 생각을 30분 동안 자유롭게 말씀하세요. 중간에 쉬어가도 자동으로 끊김 없이 글자로 적어줍니다!
                    </p>
                  </div>

                  {/* Gauge */}
                  <div className="glass-box rounded-3xl p-6 border border-slate-800 space-y-3.5">
                    <div className="flex justify-between items-center text-sm md:text-base font-bold">
                      <span className="text-slate-300">내 마음의 시작 부담감</span>
                      <span className="text-cyan-300 font-extrabold">{myProgress.lazinessScore}점 (매우 가벼움)</span>
                    </div>
                    <div className="w-full bg-space-900 h-3 rounded-full overflow-hidden border border-slate-800">
                      <div className="bg-gradient-to-r from-cyan-500 to-emerald-400 h-full transition-all duration-500" style={{ width: `${myProgress.lazinessScore}%` }}></div>
                    </div>
                  </div>

                  {/* Badges */}
                  <div className="glass-box rounded-3xl p-6 border border-slate-800 text-center">
                    <span className="text-sm font-bold text-slate-300 block mb-3.5">🏅 나의 연속 달성 도장</span>
                    <div className="flex justify-center gap-2.5 text-3xl">
                      {['🔥', '⭐', '🏆', '🎯', '👑'].map((icon, i) => (
                        <div key={i} className="w-12 h-12 rounded-2xl bg-space-900 border border-gold-500/40 flex items-center justify-center shadow-inner">
                          {icon}
                        </div>
                      ))}
                    </div>
                  </div>

                </aside>

              </div>
            )}

            {/* TAB 2: 3-MINUTE TIMER */}
            {activeTab === 'TIMER' && (
              <section className="flex-1 flex flex-col items-center justify-center p-6 text-center bg-space-950/90">
                <div className="max-w-lg w-full glass-box-active rounded-3xl p-10 border-2 border-cyan-400/50 shadow-2xl">
                  
                  <span className="inline-block text-sm font-bold text-cyan-300 bg-cyan-500/20 px-4 py-1.5 rounded-full mb-4">
                    ⏱️ 딱 3분만 해보기
                  </span>

                  <h2 className="text-xl md:text-2xl font-black text-white mb-3 leading-relaxed">
                    "{myProgress.easyMission}"
                  </h2>
                  <p className="text-sm md:text-base text-slate-300 mb-8">
                    완벽하게 하려고 애쓰지 말고, 3분 동안 이것만 가볍게 해보세요!
                  </p>

                  {/* Clock */}
                  <div className="bg-space-900 py-8 rounded-3xl border-2 border-cyan-500/30 mb-8 shadow-inner">
                    <span className="text-6xl md:text-7xl font-black font-mono text-cyan-300 tracking-wider">
                      {Math.floor(timeLeft / 60)}:{(timeLeft % 60).toString().padStart(2, '0')}
                    </span>
                  </div>

                  {!timerOn ? (
                    <button
                      onClick={() => { setTimerOn(true); playSound('pop'); }}
                      className="w-full py-4 rounded-2xl font-black text-lg bg-gradient-to-r from-cyan-500 via-indigo-600 to-purple-600 text-white shadow-xl shadow-cyan-500/40 hover:scale-105 transition flex items-center justify-center gap-2">
                      <i data-lucide="play" className="w-6 h-6"></i>
                      <span>⏱️ 3분 타이머 시작하기</span>
                    </button>
                  ) : (
                    <div className="flex gap-4">
                      <button
                        onClick={() => { setTimerOn(false); playSound('pop'); }}
                        className="flex-1 py-4 rounded-2xl font-bold text-base bg-space-800 hover:bg-space-700 text-slate-200 border border-slate-700 transition">
                        잠깐 멈춤
                      </button>
                      <button
                        onClick={() => setTimeLeft(0)}
                        className="flex-1 py-4 rounded-2xl font-bold text-base bg-emerald-600 hover:bg-emerald-500 text-white transition">
                        ✓ 다 했어요!
                      </button>
                    </div>
                  )}
                </div>
              </section>
            )}

            {/* TAB 3: NOTEBOOK */}
            {activeTab === 'RECORD' && (
              <section className="flex-1 overflow-y-auto p-6 md:p-12 max-w-5xl mx-auto space-y-7">
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-2xl md:text-3xl font-black text-white">📒 나의 성공 기록장</h2>
                    <p className="text-sm md:text-base text-slate-300 mt-1">내가 원하는 목표와 오늘 해낸 작은 실천들이 저장되어 있어요.</p>
                  </div>
                  <button
                    onClick={() => {
                      const doc = `# 🌟 나의 3분 성공 습관 기록장\n\n- 내가 원하는 목표: ${myProgress.targetGoal}\n- 극복한 망설임: ${myProgress.fearReason}\n- 오늘 해낸 3분 미션: ${myProgress.easyMission}\n- 연속 성공 기록: ${myProgress.streakDays}일 연속\n- 모은 성공 도장: ${myProgress.stampCount}개`;
                      const blob = new Blob([doc], { type: 'text/markdown;charset=utf-8;' });
                      const url = URL.createObjectURL(blob);
                      const a = document.createElement('a');
                      a.href = url;
                      a.download = `나의_성공기록장.md`;
                      a.click();
                      playSound('cheer');
                    }}
                    className="px-5 py-3 rounded-xl font-bold text-sm md:text-base bg-cyan-500/20 text-cyan-300 border border-cyan-400 hover:bg-cyan-500/30 flex items-center gap-2 shadow-md">
                    <i data-lucide="download" className="w-5 h-5"></i>
                    <span>기록장 파일로 저장하기</span>
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                  <div className="glass-box rounded-3xl p-7 border border-slate-800">
                    <span className="text-sm font-bold text-cyan-400 block mb-1.5">🎯 내가 이루고 싶은 목표</span>
                    <p className="text-lg md:text-xl font-bold text-white leading-relaxed">{myProgress.targetGoal}</p>
                  </div>
                  <div className="glass-box rounded-3xl p-7 border border-slate-800">
                    <span className="text-sm font-bold text-rose-400 block mb-1.5">🛑 내가 극복한 망설임</span>
                    <p className="text-lg md:text-xl font-medium text-rose-200 leading-relaxed">{myProgress.fearReason}</p>
                  </div>
                </div>

                <div className="glass-box-active rounded-3xl p-7 border-2 border-emerald-500/30">
                  <span className="text-sm font-bold text-emerald-400 block mb-1.5">⚡ 오늘 당장 해낸 3분 미션</span>
                  <p className="text-xl md:text-2xl font-bold text-emerald-200 leading-relaxed">"{myProgress.easyMission}"</p>
                </div>
              </section>
            )}

          </div>

          {/* Stamp Popup */}
          {showStampPopup && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-box-active rounded-3xl max-w-md w-full p-8 text-center border-2 border-cyan-400 shadow-2xl">
                <div className="w-20 h-20 rounded-full bg-emerald-500/20 text-emerald-400 mx-auto flex items-center justify-center mb-4">
                  <span className="text-4xl">🎉</span>
                </div>
                <h3 className="text-2xl font-black text-white mb-2">3분 미션 성공 완료!</h3>
                <p className="text-base text-slate-200 mb-6 leading-relaxed">
                  오늘의 귀차니즘을 멋지게 이겨내셨어요!<br/>
                  <strong>참 잘했어요 도장 1개</strong>가 추가되었습니다.
                </p>

                <button
                  onClick={() => setShowStampPopup(false)}
                  className="w-full py-4 rounded-xl font-bold text-base bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-lg">
                  확인
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
