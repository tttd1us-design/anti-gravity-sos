    const playSound = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'bell') {
          [659.25, 880, 1046.5, 1318.51].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.08);
            gain.gain.setValueAtTime(0.06, ctx.currentTime + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.08);
            osc.stop(ctx.currentTime + i * 0.08 + 0.35);
          });
        } else if (type === 'cheer') {
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.05);
            gain.gain.setValueAtTime(0.05, ctx.currentTime + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.05 + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.05);
            osc.stop(ctx.currentTime + i * 0.05 + 0.2);
          });
        }
      } catch (e) {}

                        <span>🤝</span> 파트너 사회적 감시 및 공개 서약 (Social Contract)
                      </span>
                      <span className="text-xs font-mono px-3 py-1 rounded-full bg-rose-500/20 text-rose-300 border border-rose-400">
                        Accountability Active
                      </span>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs md:text-sm">
                      <div className="p-4 bg-space-950 rounded-2xl border border-slate-800 space-y-1.5">
                        <label className="text-slate-400 block font-bold">감시 파트너 / 스터디장 이름:</label>
                        <input
                          type="text"
                          value={socialAlarmSettings.partnerName}
                          onChange={(e) => setSocialAlarmSettings({ ...socialAlarmSettings, partnerName: e.target.value })}
                          className="w-full bg-space-900 border border-slate-700 rounded-xl px-3 py-2 text-white font-bold focus:border-rose-400 focus:outline-none"
                        />
                      </div>

                      <div className="p-4 bg-space-950 rounded-2xl border border-slate-800 space-y-1.5">
                        <label className="text-slate-400 block font-bold">미완수 1회당 파트너 입금 벌금 (원):</label>
                        <input
                          type="text"
                          value={socialAlarmSettings.penaltyPerMiss}
                          onChange={(e) => setSocialAlarmSettings({ ...socialAlarmSettings, penaltyPerMiss: e.target.value })}
                          className="w-full bg-space-900 border border-slate-700 rounded-xl px-3 py-2 text-gold-300 font-bold focus:border-rose-400 focus:outline-none"
                        />
                      </div>
                    </div>

                    <div className="p-4 bg-space-950 rounded-2xl border border-rose-500/30 flex flex-col sm:flex-row justify-between items-center gap-3">
                      <div>
                        <span className="text-xs text-rose-300 font-bold block mb-0.5">🔗 나의 실시간 서약 공유 링크:</span>
                        <code className="text-xs text-slate-300 font-mono bg-space-900 px-2 py-1 rounded border border-slate-800">
                          {socialAlarmSettings.socialPledgeUrl}
                        </code>
                      </div>
                      <button
                        onClick={() => {
                          navigator.clipboard?.writeText(socialAlarmSettings.socialPledgeUrl);
                          alert("서약 링크가 복사되었습니다! 파트너나 단톡방에 공유하세요.");
                          playSound('pop');
                        }}
                        className="px-4 py-2 rounded-xl text-xs font-bold bg-rose-500 hover:bg-rose-400 text-white shadow-md">
                        링크 복사
                      </button>
                    </div>
                  </div>

                  <div className="glass-box rounded-3xl p-7 border border-slate-800 space-y-5">
                    <h3 className="text-base md:text-lg font-black text-white flex items-center gap-2">
                      <span>⏰</span> 3대 정밀 알람 스케줄러 (Kakao / Push / Web)
                    </h3>

                    <div className="space-y-3.5">
                      <div className="p-4 bg-space-900 rounded-2xl border-l-4 border-cyan-400 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="text-cyan-300 font-bold text-sm">☀️ 모닝 3분 활성화 알람 ({socialAlarmSettings.morningAlarmTime})</span>
                            <span className="text-[10px] px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300">카카오톡 + 푸시</span>
                          </div>
                          <p className="text-xs text-slate-300 mt-1">
                            메시지: "오늘 당장 3분 안에 할 수 있는 최소 행동 [{fiveMastersData.gtd.runway}]을 실행하세요!"
                          </p>
                        </div>
                        <button
                          onClick={() => triggerTestAlarm('morning')}
                          className="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-400 hover:bg-cyan-500/30">
                          🔔 모의 알람 테스트
                        </button>
                      </div>

                      <div className="p-4 bg-space-900 rounded-2xl border-l-4 border-gold-400 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="text-gold-300 font-bold text-sm">⚡ Ray Dalio If-Then 긴급 방어 알람</span>
                            <span className="text-[10px] px-2 py-0.5 rounded bg-gold-500/20 text-gold-300">자동 감지</span>
                          </div>
                          <p className="text-xs text-slate-300 mt-1">
                            메시지: "{fiveMastersData.dalio.ifThenRule}"
                          </p>
                        </div>
                        <button
                          onClick={() => triggerTestAlarm('ifthen')}
                          className="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-gold-500/20 text-gold-300 border border-gold-400 hover:bg-gold-500/30">
                          🔔 모의 알람 테스트
                        </button>
                      </div>

                      <div className="p-4 bg-space-900 rounded-2xl border-l-4 border-purple-400 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                        <div>
                          <div className="flex items-center gap-2">
                            <span className="text-purple-300 font-bold text-sm">🌙 나이트 5대 거장 모멘텀 결산 알람 ({socialAlarmSettings.nightAlarmTime})</span>
                            <span className="text-[10px] px-2 py-0.5 rounded bg-purple-500/20 text-purple-300">파트너 자동 공유</span>
                          </div>
                          <p className="text-xs text-slate-300 mt-1">
                            메시지: "오늘 3분 미션을 완수하셨나요? 미완수 시 파트너 {socialAlarmSettings.partnerName}님에게 {socialAlarmSettings.penaltyPerMiss}원이 청구됩니다."
                          </p>
                        </div>
                        <button
                          onClick={() => triggerTestAlarm('night')}
                          className="px-3.5 py-1.5 rounded-xl text-xs font-bold bg-purple-500/20 text-purple-300 border border-purple-400 hover:bg-purple-500/30">
                          🔔 모의 알람 테스트
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* 3-Minute Stamp Complete Modal */}
          {showStampPopup && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-box-active rounded-3xl max-w-md w-full p-8 text-center border-2 border-cyan-400 shadow-2xl">
                <div className="w-20 h-20 rounded-full bg-emerald-500/20 text-emerald-400 mx-auto flex items-center justify-center mb-4">
                  <span className="text-4xl">🎉</span>
                </div>
                <h3 className="text-2xl font-black text-white mb-2">3분 미션 성공 완료!</h3>
                <p className="text-sm text-slate-200 mb-6 leading-relaxed">
                  오늘의 귀차니즘을 멋지게 이겨내셨어요!<br/>
                  <strong>개인화된 성공관리시스템(AG-SMS)</strong>에 실행 데이터가 안전하게 누적되었습니다.
                </p>
                <button
                  onClick={() => setShowStampPopup(false)}
                  className="w-full py-4 rounded-xl font-bold text-base bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-lg">
                  확인
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
