<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anti-Gravity SOS - 24시간 전담 AI CSO & 실행 운영체제</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            space: {
              950: '#030508',
              900: '#070B12',
              850: '#0D1422',
              800: '#141E33',
              700: '#1D2A47',
            },
            cyan: {
              300: '#67E8F9',
              400: '#22D3EE',
              500: '#06B6D4',
              glow: '#00F0FF',
            },
            gold: {
              300: '#FDE047',
              400: '#FACC15',
              500: '#EAB308',
              glow: '#FFD700',
            },
            emerald: {
              400: '#34D399',
              500: '#10B981',
            },
            rose: {
              400: '#FB7185',
              500: '#F43F5E',
            }
          },
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #030508;
      color: #F8FAFC;
      font-family: 'Pretendard', sans-serif;
      overflow-x: hidden;
      font-size: 18px;
      line-height: 1.75;
      transition: font-size 0.15s ease;
    }
    
    .bg-soft-pattern {
      background-image: 
        linear-gradient(to right, rgba(34, 211, 238, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(34, 211, 238, 0.03) 1px, transparent 1px);
      background-size: 36px 36px;
    }
    
    .glass-box {
      background: rgba(13, 20, 34, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid rgba(34, 211, 238, 0.22);
    }

    .glass-box-active {
      background: rgba(13, 20, 34, 0.96);
      backdrop-filter: blur(22px);
      border: 2px solid rgba(0, 240, 255, 0.55);
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.18);
    }

    .glass-box-danger {
      background: rgba(30, 15, 25, 0.95);
      backdrop-filter: blur(22px);
      border: 2px solid rgba(244, 63, 94, 0.5);
      box-shadow: 0 0 35px rgba(244, 63, 94, 0.2);
    }

    .glass-box-safe {
      background: rgba(10, 30, 25, 0.95);
      backdrop-filter: blur(22px);
      border: 2px solid rgba(16, 185, 129, 0.5);
      box-shadow: 0 0 35px rgba(16, 185, 129, 0.2);
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #070B12;
    }
    ::-webkit-scrollbar-thumb {
      background: #1D2A47;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #00F0FF;
    }
  </style>
</head>
<body class="bg-soft-pattern min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const playSound = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.06);
          gain.gain.setValueAtTime(0.05, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.06);
        } else if (type === 'cheer') {
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.06);
            gain.gain.setValueAtTime(0.06, ctx.currentTime + i * 0.06);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.06 + 0.25);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.06);
            osc.stop(ctx.currentTime + i * 0.06 + 0.25);
          });
        } else if (type === 'calm') {
          [440, 554.37, 659.25].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.15);
            gain.gain.setValueAtTime(0.04, ctx.currentTime + i * 0.15);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.6);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.15);
            osc.stop(ctx.currentTime + i * 0.15 + 0.6);
          });
        }
      } catch (e) {}
    };

    function App() {
      // 폰트 스케일러 (기본 1.5)
      const [fontSize, setFontSize] = useState(() => {
        return parseFloat(localStorage.getItem('AG_SOS_FONT') || '1.5');
      });

      // 탭: 'ONE_ACTION', 'PULSE_CAPTURE', 'CSO_COACH', 'CIRCUIT_BREAKER', 'COMPOUNDING'
      const [activeTab, setActiveTab] = useState('ONE_ACTION');

      // 전역 상태
      const [state, setState] = useState(() => {
        const saved = localStorage.getItem('AG_SOS_GLOBAL_STATE_V1');
        return saved ? JSON.parse(saved) : {
          isSafeLandingActive: false, // 비상 착륙 모드
          crucialAction: {
            title: "월 100만 원 부업용 상품 기획서 파일 열고 1줄 적기",
            vision: "월 100만원 부업 시스템 구축",
            milestone: "Q1 MVP 상품 런칭",
            timeBoxMinutes: 5,
            isCompleted: false
          },
          pulseEntries: [
            { id: 1, type: 'TODO', rawText: "내일 오전 10시 거래처 견적서 송부", time: "오전 09:15", tag: "할 일" },
            { id: 2, type: 'IDEA', rawText: "3분 마이크로 코칭 인스타그램 릴스 주제", time: "오후 02:40", tag: "아이디어" },
            { id: 3, type: 'FINANCE', rawText: "부업 온라인 강의 런칭 매출 +99,000원 입금", time: "오후 06:10", tag: "수익" }
          ],
          compoundingStats: {
            streakDays: 5,
            totalFocusMinutes: 185,
            completionRate: 88,
            gravityOvercomeScore: 94,
            compoundingMultiplier: 1.42
          }
        };
      });

      // 5분 타이머
      const [timeLeft, setTimeLeft] = useState(300);
      const [timerOn, setTimerOn] = useState(false);
      const [showCompleteModal, setShowCompleteModal] = useState(false);
      const [showPricingModal, setShowPricingModal] = useState(false);

      // Pulse 퀵 캡처 입력
      const [pulseInput, setPulseInput] = useState("");
      const [isPulseProcessing, setIsPulseProcessing] = useState(false);

      // CSO 대화 메시지
      const [csoMessages, setCsoMessages] = useState([
        {
          id: 1,
          sender: 'cso',
          text: `안녕하십니까, 대표님. 24시간 전담 CSO(최고전략책임자)입니다.\n\n오늘 대표님의 실행 에너지를 낭비하지 않도록, **'오늘 중력을 뚫기 위한 단 1개의 핵심 액션'**을 추출해 두었습니다.\n\n준비되셨을 때 보고해 주시면 최적의 궤도로 안내하겠습니다.`,
          time: '지금'
        }
      ]);
      const [csoInput, setCsoInput] = useState("");
      const [isCsoThinking, setIsCsoThinking] = useState(false);
      const chatEndRef = useRef(null);

      useEffect(() => {
        localStorage.setItem('AG_SOS_GLOBAL_STATE_V1', JSON.stringify(state));
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [state, activeTab, csoMessages, fontSize]);

      // 타이머 제어
      useEffect(() => {
        let timer = null;
        if (timerOn && timeLeft > 0) {
          timer = setInterval(() => setTimeLeft(t => t - 1), 1000);
        } else if (timeLeft === 0 && timerOn) {
          setTimerOn(false);
          playSound('cheer');
          if (window.confetti) {
            window.confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
          }
          setState(prev => ({
            ...prev,
            crucialAction: { ...prev.crucialAction, isCompleted: true },
            compoundingStats: {
              ...prev.compoundingStats,
              streakDays: prev.compoundingStats.streakDays + 1,
              totalFocusMinutes: prev.compoundingStats.totalFocusMinutes + 5,
              completionRate: Math.min(100, prev.compoundingStats.completionRate + 3),
              compoundingMultiplier: parseFloat((prev.compoundingStats.compoundingMultiplier + 0.05).toFixed(2))
            }
          }));
          setShowCompleteModal(true);
        }
        return () => clearInterval(timer);
      }, [timerOn, timeLeft]);

      const changeFontSize = (scale) => {
        const val = Math.min(2.4, Math.max(1.1, parseFloat(scale.toFixed(1))));
        setFontSize(val);
        localStorage.setItem('AG_SOS_FONT', val.toString());
        playSound('pop');
      };

      // Pulse 캡처 전송 및 자동 파싱
      const handlePulseSubmit = (e) => {
        e?.preventDefault();
        const text = pulseInput.trim();
        if (!text || isPulseProcessing) return;

        setIsPulseProcessing(true);
        playSound('pop');

        setTimeout(() => {
          let detectedType = 'IDEA';
          let tagLabel = '아이디어';

          if (text.includes('송부') || text.includes('미팅') || text.includes('하기') || text.includes('작성') || text.includes('연락')) {
            detectedType = 'TODO';
            tagLabel = '할 일';
          } else if (text.includes('원') || text.includes('매출') || text.includes('지출') || text.includes('결제') || text.includes('입금')) {
            detectedType = 'FINANCE';
            tagLabel = '수익/지출';
          } else if (text.includes('힘들') || text.includes('좋았') || text.includes('후회') || text.includes('느낌') || text.includes('피곤')) {
            detectedType = 'RETRO';
            tagLabel = '감정/회고';
          }

          const newEntry = {
            id: Date.now(),
            type: detectedType,
            rawText: text,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            tag: tagLabel
          };

          setState(prev => ({
            ...prev,
            pulseEntries: [newEntry, ...prev.pulseEntries]
          }));
          setPulseInput("");
          setIsPulseProcessing(false);
          playSound('cheer');
        }, 350);
      };

      // CSO 대화
      const handleCsoSend = (e) => {
        e?.preventDefault();
        const text = csoInput.trim();
        if (!text || isCsoThinking) return;

        const userMsg = {
          id: Date.now(),
          sender: 'user',
          text,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setCsoMessages(prev => [...prev, userMsg]);
        setCsoInput("");
        playSound('pop');
        setIsCsoThinking(true);

        setTimeout(() => {
          let reply = `대표님, 공유해 주신 실행 현황을 검토했습니다. 훌륭한 추진력입니다.\n\n다만 저녁 시간대에는 의지력이 소모되기 쉬우므로, **내일 오전 9시 골든타임 90분을 먼저 확보**하고 핵심 기획을 단숨에 돌파하시길 권고드립니다. 오늘 저녁은 멘탈 궤도를 안정화하십시오.`;
          
          if (text.includes('힘들') || text.includes('피곤') || text.includes('지쳤') || text.includes('포기')) {
            reply = `대표님, 중력이 위험 수준으로 감지되었습니다. 억지로 밀어붙이면 번아웃과 이탈을 초래합니다.\n\n상단의 **[🛡️ SOS 비상 착륙 모드]**를 가동하여 오늘 8개 과제를 모두 보류하고, [수면 7시간 확보]와 [따뜻한 차 한 잔]으로 궤도를 낮추겠습니다.`;
          }

          const csoReply = {
            id: Date.now() + 1,
            sender: 'cso',
            text: reply,
            time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          };

          setCsoMessages(prev => [...prev, csoReply]);
          setIsCsoThinking(false);
          playSound('pop');
        }, 450);
      };

      // SOS 비상 착륙 모드 토글
      const toggleSafeLanding = () => {
        playSound('calm');
        setState(prev => ({
          ...prev,
          isSafeLandingActive: !prev.isSafeLandingActive
        }));
      };

      const currentFontPx = Math.max(18, 14 * fontSize);

      return (
        <div className="flex flex-col h-screen max-h-screen">
          
          {/* Header */}
          <header className={`h-24 border-b px-4 md:px-8 flex items-center justify-between z-20 transition-colors ${
            state.isSafeLandingActive 
              ? 'bg-emerald-950/90 border-emerald-500/40 glass-box-safe' 
              : 'border-cyan-500/20 glass-box'
          }`}>
            
            {/* Logo */}
            <div className="flex items-center space-x-4">
              <div className={`w-12 h-12 md:w-14 md:h-14 rounded-2xl flex items-center justify-center shadow-lg transition ${
                state.isSafeLandingActive
                  ? 'bg-gradient-to-br from-emerald-400 to-teal-700 shadow-emerald-500/30'
                  : 'bg-gradient-to-br from-cyan-400 via-indigo-600 to-purple-600 shadow-cyan-500/30'
              }`}>
                <span className="text-3xl">{state.isSafeLandingActive ? '🛡️' : '🚀'}</span>
              </div>
              <div>
                <div className="flex items-center gap-2.5">
                  <h1 className="text-xl md:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-white to-gold-300 tracking-tight">
                    Anti-Gravity SOS
                  </h1>
                  <span className={`text-xs md:text-sm font-bold px-3 py-0.5 rounded-full border ${
                    state.isSafeLandingActive
                      ? 'bg-emerald-500/20 text-emerald-300 border-emerald-400'
                      : 'bg-cyan-500/20 text-cyan-300 border-cyan-400'
                  }`}>
                    {state.isSafeLandingActive ? '비상 착륙 가동 중' : '전담 AI CSO'}
                  </span>
                </div>
                <p className="text-xs md:text-sm text-slate-300 font-medium">4대 중력을 제거하는 24시간 성공 운영체제</p>
              </div>
            </div>

            {/* Nav Tabs */}
            <nav className="hidden lg:flex items-center space-x-1.5 bg-space-900 border border-slate-800 rounded-2xl p-1.5">
              {[
                { id: 'ONE_ACTION', label: '🎯 One Crucial Action', icon: 'target' },
                { id: 'PULSE_CAPTURE', label: '⚡ Zero-Friction Pulse', icon: 'zap' },
                { id: 'CSO_COACH', label: '💼 AI 전담 CSO', icon: 'shield' },
                { id: 'COMPOUNDING', label: '📊 복리 성장 허브', icon: 'trending-up' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => { setActiveTab(tab.id); playSound('pop'); }}
                  className={`px-3.5 py-2.5 rounded-xl text-xs md:text-sm font-bold flex items-center gap-1.5 transition ${
                    activeTab === tab.id
                      ? 'bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-md shadow-cyan-500/30'
                      : 'text-slate-300 hover:text-white hover:bg-space-800'
                  }`}>
                  <i data-lucide={tab.icon} className="w-4 h-4"></i>
                  <span>{tab.label}</span>
                </button>
              ))}
            </nav>

            {/* Right Controls */}
            <div className="flex items-center space-x-3">
              
              {/* SOS Circuit Breaker Quick Button */}
              <button
                onClick={toggleSafeLanding}
                className={`px-3.5 py-2 rounded-2xl text-xs md:text-sm font-black flex items-center gap-1.5 transition border ${
                  state.isSafeLandingActive
                    ? 'bg-emerald-500 text-black border-emerald-300 shadow-lg shadow-emerald-500/40 animate-pulse'
                    : 'bg-rose-500/20 text-rose-300 border-rose-500/40 hover:bg-rose-500/30'
                }`}>
                <span>{state.isSafeLandingActive ? '🛡️ 비상 착륙 해제' : '🚨 SOS 비상 착륙'}</span>
              </button>

              {/* Pro Pricing Button */}
              <button
                onClick={() => { setShowPricingModal(true); playSound('pop'); }}
                className="hidden sm:flex px-3.5 py-2 rounded-2xl text-xs md:text-sm font-bold bg-gradient-to-r from-gold-400 to-amber-500 text-black shadow-md shadow-gold-500/20 hover:scale-105 transition items-center gap-1.5">
                <i data-lucide="crown" className="w-4 h-4"></i>
                <span>Pro ₩19,900</span>
              </button>

              {/* Font Size Controller */}
              <div className="flex items-center space-x-1 bg-space-900 border border-slate-700 rounded-2xl px-2.5 py-1">
                <button
                  onClick={() => changeFontSize(fontSize - 0.2)}
                  className="w-8 h-8 rounded-lg bg-space-800 hover:bg-space-700 text-slate-200 font-bold text-sm flex items-center justify-center">
                  A-
                </button>
                <span className="text-xs font-mono text-cyan-300 px-1 font-bold">
                  {Math.round(fontSize * 100)}%
                </span>
                <button
                  onClick={() => changeFontSize(fontSize + 0.2)}
                  className="w-8 h-8 rounded-lg bg-space-800 hover:bg-space-700 text-slate-200 font-bold text-sm flex items-center justify-center">
                  A+
                </button>
              </div>

            </div>

          </header>

          {/* Main Workspace */}
          <div className="flex-1 flex overflow-hidden">
            
            {/* 1. ONE CRUCIAL ACTION (GRAVITY BREAKER) */}
            {activeTab === 'ONE_ACTION' && (
              <section className="flex-1 overflow-y-auto p-6 md:p-12 max-w-4xl mx-auto flex flex-col justify-center items-center text-center space-y-8">
                
                {/* Safe Landing Banner if Active */}
                {state.isSafeLandingActive ? (
                  <div className="w-full glass-box-safe rounded-3xl p-8 border-2 border-emerald-400/60 shadow-2xl text-left space-y-4">
                    <div className="flex items-center gap-3 text-emerald-300">
                      <span className="text-3xl">🛡️</span>
                      <h2 className="text-2xl font-black">비상 착륙 모드 (Safe Landing Mode) 가동 중</h2>
                    </div>
                    <p className="text-base text-slate-200 leading-relaxed">
                      "대표님, 현재 중력이 너무 강합니다. 자책하지 마십시오. 오늘 등록된 8개의 모든 할 일을 안전하게 보류하였습니다. 오늘은 오직 아래 2가지만 수행하고 푹 쉬십시오."
                    </p>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                      <div className="p-4 bg-space-900 rounded-2xl border border-emerald-500/40 text-emerald-200 font-bold flex items-center gap-3">
                        <span className="text-2xl">☕</span> 따뜻한 물 한 잔 마시기
                      </div>
                      <div className="p-4 bg-space-900 rounded-2xl border border-emerald-500/40 text-emerald-200 font-bold flex items-center gap-3">
                        <span className="text-2xl">🛌</span> 오늘 밤 수면 7시간 확보하기
                      </div>
                    </div>
                    <button
                      onClick={toggleSafeLanding}
                      className="mt-2 px-6 py-3 rounded-xl font-bold text-sm bg-emerald-600 hover:bg-emerald-500 text-white transition">
                      궤도 복구 및 일상 모드로 전환
                    </button>
                  </div>
                ) : (
                  <div className="w-full glass-box-active rounded-3xl p-8 md:p-12 border-2 border-cyan-400/50 shadow-2xl space-y-6">
                    
                    <div className="flex items-center justify-between text-xs md:text-sm font-bold text-cyan-300 border-b border-slate-800 pb-4">
                      <span>비전: {state.crucialAction.vision}</span>
                      <span>마일스톤: {state.crucialAction.milestone}</span>
                    </div>

                    <div>
                      <span className="inline-block text-xs md:text-sm font-black text-cyan-300 bg-cyan-500/20 px-4 py-1.5 rounded-full mb-3">
                        ⚡ 오늘 중력을 뚫기 위한 단 1개의 행동 (One Crucial Action)
                      </span>
                      <h2 className="text-2xl md:text-3xl font-black text-white leading-tight">
                        "{state.crucialAction.title}"
                      </h2>
                      <p className="text-sm text-slate-300 mt-2">
                        복잡한 할 일 목록을 지우고, 오늘 딱 5분 동안 이것만 시작하십시오.
                      </p>
                    </div>

                    {/* 5-Min Timer Display */}
                    <div className="bg-space-900 py-8 rounded-3xl border-2 border-cyan-500/30 shadow-inner">
                      <span className="text-6xl md:text-7xl font-black font-mono text-cyan-300 tracking-wider">
                        {Math.floor(timeLeft / 60)}:{(timeLeft % 60).toString().padStart(2, '0')}
                      </span>
                    </div>

                    {/* Action Buttons */}
                    {!timerOn ? (
                      <button
                        onClick={() => { setTimerOn(true); playSound('pop'); }}
                        className="w-full py-5 rounded-2xl font-black text-lg bg-gradient-to-r from-cyan-500 via-indigo-600 to-purple-600 text-white shadow-xl shadow-cyan-500/40 hover:scale-105 transition flex items-center justify-center gap-2">
                        <i data-lucide="play" className="w-6 h-6"></i>
                        <span>⏱️ 5분 집중 궤도 돌파 시작</span>
                      </button>
                    ) : (
                      <div className="flex gap-4">
                        <button
                          onClick={() => { setTimerOn(false); playSound('pop'); }}
                          className="flex-1 py-4 rounded-2xl font-bold text-base bg-space-800 hover:bg-space-700 text-slate-200 border border-slate-700 transition">
                          일시 정지
                        </button>
                        <button
                          onClick={() => setTimeLeft(0)}
                          className="flex-1 py-4 rounded-2xl font-bold text-base bg-emerald-600 hover:bg-emerald-500 text-white transition">
                          ✓ 목표 달성 완료!
                        </button>
                      </div>
                    )}

                  </div>
                )}

              </section>
            )}

            {/* 2. ZERO-FRICTION PULSE (INTELLIGENT CAPTURE) */}
            {activeTab === 'PULSE_CAPTURE' && (
              <section className="flex-1 overflow-y-auto p-6 md:p-10 max-w-5xl mx-auto space-y-7">
                
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-2xl md:text-3xl font-black text-white">⚡ Zero-Friction Pulse (무마찰 인텔리전트 캡처)</h2>
                    <p className="text-sm md:text-base text-slate-300 mt-1">
                      앱을 켜고 정리하지 마세요. 음성이나 텍스트로 던지면 AI가 알아서 [할 일/아이디어/수익/회고]로 자동 분류합니다.
                    </p>
                  </div>
                </div>

                {/* Input Pulse Box */}
                <div className="glass-box-active rounded-3xl p-6 border-2 border-cyan-400/40">
                  <form onSubmit={handlePulseSubmit} className="relative flex flex-col gap-3">
                    <textarea
                      rows="3"
                      value={pulseInput}
                      onChange={(e) => setPulseInput(e.target.value)}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter' && !e.shiftKey) {
                          e.preventDefault();
                          handlePulseSubmit();
                        }
                      }}
                      placeholder="생각나는 것을 아무렇게나 적으세요 (예: '내일 거래처 견적서 보내기', '강의 매출 99,000원 입금됨', '오늘 너무 피곤해서 일찍 자고 싶음')..."
                      className="w-full bg-space-950 border-2 border-slate-700 focus:border-cyan-400 rounded-2xl p-4 text-white placeholder-slate-500 focus:outline-none resize-none font-sans"
                      style={{ fontSize: `${currentFontPx}px` }}
                    />
                    <div className="flex justify-between items-center">
                      <div className="flex items-center gap-2 text-xs font-bold text-slate-400">
                        <span className="px-2.5 py-1 rounded-lg bg-space-800 border border-slate-700 text-cyan-300">
                          🎙️ 음성 인식 자동 파싱 지원
                        </span>
                        <span className="hidden sm:inline">엔터 키로 즉시 전송</span>
                      </div>
                      <button
                        type="submit"
                        disabled={!pulseInput.trim() || isPulseProcessing}
                        className="px-6 py-3 rounded-xl font-bold text-sm bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-lg flex items-center gap-2 hover:scale-105 transition">
                        <span>펄스 캡처</span>
                        <i data-lucide="send" className="w-4 h-4"></i>
                      </button>
                    </div>
                  </form>
                </div>

                {/* Pulse Stream List */}
                <div className="space-y-3.5">
                  <h3 className="text-base font-bold text-slate-300">최근 자동 분류된 펄스 피드</h3>
                  <div className="grid grid-cols-1 gap-3">
                    {state.pulseEntries.map(entry => (
                      <div key={entry.id} className="glass-box rounded-2xl p-5 border border-slate-800 flex items-center justify-between">
                        <div className="flex items-center gap-4">
                          <span className={`px-3 py-1 rounded-xl text-xs font-black border ${
                            entry.type === 'TODO' ? 'bg-cyan-500/20 text-cyan-300 border-cyan-500/40' :
                            entry.type === 'IDEA' ? 'bg-purple-500/20 text-purple-300 border-purple-500/40' :
                            entry.type === 'FINANCE' ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' :
                            'bg-rose-500/20 text-rose-300 border-rose-500/40'
                          }`}>
                            {entry.tag}
                          </span>
                          <span className="text-base font-medium text-slate-100">{entry.rawText}</span>
                        </div>
                        <span className="text-xs text-slate-500">{entry.time}</span>
                      </div>
                    ))}
                  </div>
                </div>

              </section>
            )}

            {/* 3. AI EXECUTIVE PARTNER (CSO COACHING) */}
            {activeTab === 'CSO_COACH' && (
              <section className="flex-1 flex flex-col bg-space-950/80 border-r border-cyan-500/10 relative">
                
                {/* CSO Header */}
                <div className="bg-space-900/95 border-b border-cyan-500/10 px-6 py-3.5 flex items-center justify-between text-sm md:text-base font-medium">
                  <div className="flex items-center gap-3">
                    <div className="w-3 h-3 rounded-full bg-emerald-400 animate-ping"></div>
                    <span className="font-bold text-slate-200">10조 자산가 전담 CSO(최고전략책임자) 브리핑 채널</span>
                  </div>
                  <span className="text-xs text-slate-400 font-mono">ENCRYPTED CSO CHANNEL</span>
                </div>

                {/* Message Stream */}
                <div className="flex-1 overflow-y-auto p-6 md:p-8 space-y-6">
                  {csoMessages.map(m => (
                    <div key={m.id} className={`flex flex-col ${m.sender === 'user' ? 'items-end' : 'items-start'}`}>
                      <div className="flex items-center gap-2 mb-1.5 px-1">
                        <span className="text-sm font-bold text-cyan-400">
                          {m.sender === 'cso' ? '💼 AI 전담 CSO' : '👤 대표님'}
                        </span>
                        <span className="text-xs text-slate-400">{m.time}</span>
                      </div>

                      <div className={`max-w-[92%] md:max-w-[85%] rounded-3xl p-6 leading-relaxed shadow-lg ${
                        m.sender === 'user'
                          ? 'bg-gradient-to-r from-cyan-950/90 to-indigo-950/95 border-2 border-cyan-500/40 text-white rounded-tr-none'
                          : 'glass-box-active text-slate-100 border-l-[6px] border-l-gold-400 rounded-tl-none'
                      }`} style={{ fontSize: `${currentFontPx}px`, lineHeight: '1.75' }}>
                        <p className="whitespace-pre-line font-medium">{m.text}</p>
                      </div>
                    </div>
                  ))}

                  {isCsoThinking && (
                    <div className="flex items-center space-x-3 text-gold-300 text-base font-medium p-4 glass-box rounded-2xl w-fit">
                      <i data-lucide="loader-2" className="w-5 h-5 animate-spin"></i>
                      <span>전략을 분석하고 있습니다...</span>
                    </div>
                  )}
                  <div ref={chatEndRef} />
                </div>

                {/* CSO Input Box */}
                <div className="p-5 md:p-6 bg-space-900/95 border-t border-cyan-500/20">
                  <form onSubmit={handleCsoSend} className="relative flex items-center">
                    <textarea
                      rows="2"
                      value={csoInput}
                      onChange={(e) => setCsoInput(e.target.value)}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter' && !e.shiftKey) {
                          e.preventDefault();
                          handleCsoSend();
                        }
                      }}
                      placeholder="오늘의 고민이나 성과를 CSO에게 보고하세요..."
                      className="w-full bg-space-950 border-2 border-slate-700 focus:border-gold-400 rounded-2xl px-6 py-4 text-white placeholder-slate-400 focus:outline-none resize-none pr-32 font-sans leading-relaxed"
                      style={{ fontSize: `${currentFontPx}px` }}
                    />
                    <button
                      type="submit"
                      disabled={!csoInput.trim() || isCsoThinking}
                      className="absolute right-3.5 bottom-4 px-6 py-3 rounded-xl font-bold text-base bg-gradient-to-r from-gold-400 to-amber-500 text-black shadow-lg hover:scale-105 transition">
                      <span>보고</span>
                    </button>
                  </form>
                </div>

              </section>
            )}

            {/* 4. COMPOUNDING HUB (WEEKLY EXECUTIVE BRIEFING) */}
            {activeTab === 'COMPOUNDING' && (
              <section className="flex-1 overflow-y-auto p-6 md:p-12 max-w-5xl mx-auto space-y-8">
                
                <div className="flex justify-between items-center">
                  <div>
                    <h2 className="text-2xl md:text-3xl font-black text-white">📊 지적/경제적 복리 성장 허브</h2>
                    <p className="text-sm md:text-base text-slate-300 mt-1">
                      당신의 5분 실행 1회가 미래 목표치에 기여한 복리 가치를 시각화합니다.
                    </p>
                  </div>
                  <button
                    onClick={() => {
                      const doc = `# 🚀 [Anti-Gravity Weekly Briefing]\n\n- 극복한 중력치: ${state.compoundingStats.gravityOvercomeScore}점\n- 주간 몰입 누적: ${state.compoundingStats.totalFocusMinutes}분\n- 실행 완료율: ${state.compoundingStats.completionRate}%\n- 성장 복리 배율: ${state.compoundingStats.compoundingMultiplier}x\n\n"나는 오늘도 삶의 중력을 뚫고 목표를 향해 나아갔다."`;
                      navigator.clipboard.writeText(doc);
                      playSound('cheer');
                      alert("주간 브리핑 카드가 클립보드에 복사되었습니다! 인스타그램/스레드에 공유하세요.");
                    }}
                    className="px-5 py-3 rounded-xl font-bold text-sm md:text-base bg-gold-500/20 text-gold-300 border border-gold-400 hover:bg-gold-500/30 flex items-center gap-2 shadow-md">
                    <i data-lucide="share-2" className="w-5 h-5"></i>
                    <span>주간 브리핑 카드 복사 (소셜 공유용)</span>
                  </button>
                </div>

                {/* 4 Metric Cards */}
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                  <div className="glass-box rounded-3xl p-6 border border-slate-800 text-center">
                    <span className="text-xs font-bold text-slate-400 block mb-1">극복한 중력치</span>
                    <span className="text-3xl font-black text-cyan-300">{state.compoundingStats.gravityOvercomeScore}점</span>
                  </div>
                  <div className="glass-box rounded-3xl p-6 border border-slate-800 text-center">
                    <span className="text-xs font-bold text-slate-400 block mb-1">누적 집중 시간</span>
                    <span className="text-3xl font-black text-gold-300">{state.compoundingStats.totalFocusMinutes}분</span>
                  </div>
                  <div className="glass-box rounded-3xl p-6 border border-slate-800 text-center">
                    <span className="text-xs font-bold text-slate-400 block mb-1">실행 완수율</span>
                    <span className="text-3xl font-black text-emerald-300">{state.compoundingStats.completionRate}%</span>
                  </div>
                  <div className="glass-box rounded-3xl p-6 border border-slate-800 text-center">
                    <span className="text-xs font-bold text-slate-400 block mb-1">성장 복리 배율</span>
                    <span className="text-3xl font-black text-purple-300">{state.compoundingStats.compoundingMultiplier}x</span>
                  </div>
                </div>

                {/* Executive Briefing Report Box */}
                <div className="glass-box-active rounded-3xl p-8 border-2 border-gold-400/40 space-y-6">
                  <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                    <span className="text-sm font-bold text-gold-400">OFFICIAL EXECUTIVE WEEKLY BRIEFING</span>
                    <span className="text-xs text-slate-400 font-mono">2026-W36 REPORT</span>
                  </div>
                  
                  <p className="text-lg font-bold text-white leading-relaxed">
                    "대표님은 이번 주 5일 연속 관성을 돌파하셨으며, 특히 **[부업 상품 기획]** 분야에서 시작 저항을 완벽하게 제거하셨습니다. 현재의 복리 성장 궤도가 유지될 경우, 목표 도달 예상 시점은 당초 계획보다 18일 단축됩니다."
                  </p>

                  <div className="p-4 bg-space-900 rounded-2xl border border-slate-800 text-xs md:text-sm text-slate-300 font-mono">
                    ✦ 다음 주 CSO 권고: "오전 9시 90분 기획 딥워크 고정 및 저녁 회고 루틴 자동화"
                  </div>
                </div>

              </section>
            )}

          </div>

          {/* Modal 1: 5-Min Task Complete */}
          {showCompleteModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-box-active rounded-3xl max-w-md w-full p-8 text-center border-2 border-cyan-400 shadow-2xl">
                <div className="w-20 h-20 rounded-full bg-emerald-500/20 text-emerald-400 mx-auto flex items-center justify-center mb-4">
                  <span className="text-4xl">🎉</span>
                </div>
                <h3 className="text-2xl font-black text-white mb-2">오늘의 중력 돌파 성공!</h3>
                <p className="text-base text-slate-200 mb-6 leading-relaxed">
                  오늘의 One Crucial Action을 완수하셨습니다.<br/>
                  <strong>성장 복리 배율 +0.05x</strong>가 적립되었습니다.
                </p>

                <button
                  onClick={() => setShowCompleteModal(false)}
                  className="w-full py-4 rounded-xl font-bold text-base bg-gradient-to-r from-cyan-500 to-indigo-600 text-white shadow-lg">
                  확인
                </button>
              </div>
            </div>
          )}

          {/* Modal 2: Pro Pricing Plan Modal */}
          {showPricingModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-box-active rounded-3xl max-w-lg w-full p-8 border-2 border-gold-400 shadow-2xl space-y-6">
                
                <div className="flex justify-between items-center">
                  <span className="text-xs font-bold text-gold-400 bg-gold-500/20 px-3 py-1 rounded-full">
                    👑 ANTI-GRAVITY PRO
                  </span>
                  <button onClick={() => setShowPricingModal(false)} className="text-slate-400 hover:text-white font-bold">
                    ✕
                  </button>
                </div>

                <div className="text-center">
                  <h3 className="text-2xl md:text-3xl font-black text-white">월 19,900원의 전담 AI CSO</h3>
                  <p className="text-sm text-slate-300 mt-1">인생의 4대 중력을 제거하고 매일 복리 성장을 만드세요.</p>
                </div>

                <div className="space-y-3 text-sm text-slate-200">
                  <div className="p-3.5 bg-space-900 rounded-xl border border-slate-800 flex items-center gap-3">
                    <span className="text-emerald-400 font-bold">✓</span> 무제한 음성/메신저 AI 펄스 캡처 & 자동 정렬
                  </div>
                  <div className="p-3.5 bg-space-900 rounded-xl border border-slate-800 flex items-center gap-3">
                    <span className="text-emerald-400 font-bold">✓</span> 10조 자산가 전담 AI CSO 일일 브리핑 & 주간 심층 리포트
                  </div>
                  <div className="p-3.5 bg-space-900 rounded-xl border border-slate-800 flex items-center gap-3">
                    <span className="text-emerald-400 font-bold">✓</span> SOS 비상 착륙 모드 & 번아웃 서킷 브레이커
                  </div>
                  <div className="p-3.5 bg-space-900 rounded-xl border border-slate-800 flex items-center gap-3">
                    <span className="text-emerald-400 font-bold">✓</span> Notion / Obsidian / Google Calendar 양방향 동기화
                  </div>
                </div>

                <button
                  onClick={() => {
                    alert("Pro 멤버십 사전 신청이 완료되었습니다! 7일 무료 체험이 시작됩니다.");
                    setShowPricingModal(false);
                    playSound('cheer');
                  }}
                  className="w-full py-4 rounded-xl font-black text-base bg-gradient-to-r from-gold-400 via-amber-500 to-yellow-500 text-black shadow-xl hover:scale-105 transition">
                  7일 무료 체험 시작하기 (월 19,900원)
                </button>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
