    const playSound = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'bell') {
          [659.25, 880, 1046.5, 1318.51].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.08);
            gain.gain.setValueAtTime(0.06, ctx.currentTime + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.08);
            osc.stop(ctx.currentTime + i * 0.08 + 0.35);
          });
        } else if (type === 'cheer') {
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.05);
            gain.gain.setValueAtTime(0.05, ctx.currentTime + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.05 + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.05);
            osc.stop(ctx.currentTime + i * 0.05 + 0.2);
          });
        }
      } catch (e) {}
    };

        };

        if (isDragging) {
          window.addEventListener('mousemove', handleMouseMove);
          window.addEventListener('mouseup', handleMouseUp);

          return;

        if (isRecording) {

          isExplicitStopRef.current = false;

          const recognition = new SpeechRecognition();
          recognition.lang = 'ko-KR';
          recognition.continuous = true;
          recognition.interimResults = true;

          recognition.onstart = () => setIsRecording(true);

          recognition.onresult = (event) => {
            for (let i = event.resultIndex; i < event.results.length; ++i) {

                const finalPiece = event.results[i][0].transcript.trim();
                setInputMsg(prev => (prev ? prev + " " : "") + finalPiece);

          recognition.onerror = (event) => {

              setIsRecording(false);

          recognition.onend = () => {
            if (!isExplicitStopRef.current) {

                          onChange={(e) => {
                            const updated = { ...socialAlarmSettings, penaltyPerMiss: e.target.value };
                            setSocialAlarmSettings(updated);
                            localStorage.setItem('AG_SOCIAL_ALARM_SETTINGS_V2', JSON.stringify(updated));
                          }}
                          style={{ fontSize: `${alarmSmallPx}px` }}
                          placeholder="예: 10,000"
                          className="w-full bg-space-900 border border-rose-500/50 rounded-xl px-3 py-1.5 text-rose-300 font-mono font-bold focus:outline-none focus:border-rose-400"
                        />
                      </div>
                    </div>

                    {/* 실시간 서약 공개 링크 & 비상 알람 */}
                    <div className="p-4 bg-space-950 rounded-2xl border border-slate-800 space-y-3 flex flex-col justify-between">
                      <div>
                        <strong style={{ fontSize: `${alarmBodyPx}px` }} className="text-gold-300 block font-bold">🔗 공개 서약 링크 & If-Then 비상 알람</strong>
                        <p style={{ fontSize: `${alarmSmallPx}px` }} className="text-slate-300 mt-1">
                          파트너에게 전달할 실시간 서약 및 진척도 공개 링크입니다.
                        </p>
                        <div className="flex items-center gap-2 mt-2">
                          <input
                            type="text"
                            readOnly
                            value={socialAlarmSettings.socialPledgeUrl}
                            style={{ fontSize: `${alarmSmallPx}px` }}
                            className="flex-1 bg-space-900 border border-slate-700 rounded-xl px-3 py-1.5 text-slate-300 font-mono text-xs focus:outline-none"
                          />
                          <button
                            onClick={() => {
                              navigator.clipboard.writeText(socialAlarmSettings.socialPledgeUrl);
                              playSound('pop');
                              alert('📋 소셜 서약 링크가 클립보드에 복사되었습니다! 파트너에게 카톡으로 공유하세요.');
                            }}
                            style={{ fontSize: `${alarmSmallPx}px` }}
                            className="px-3 py-1.5 rounded-xl bg-gold-500/20 text-gold-300 border border-gold-400/50 hover:bg-gold-500/30 font-bold shrink-0">
                            링크 복사
                          </button>
                        </div>
                      </div>

                      <div className="pt-2 border-t border-slate-800 flex items-center justify-between">
                        <div>
                          <span style={{ fontSize: `${alarmSmallPx}px` }} className="text-white font-bold block">🚨 If-Then 타성 감지 비상 SOS 발송</span>
                          <span style={{ fontSize: `${alarmSmallPx - 1}px` }} className="text-slate-400">2일 연속 미실행 시 파트너에게 자동 비상 경고 전송</span>
                        </div>
                        <input
                          type="checkbox"
                          checked={socialAlarmSettings.ifThenEmergencyAlarm}
                          onChange={(e) => {
                            const updated = { ...socialAlarmSettings, ifThenEmergencyAlarm: e.target.checked };
                            setSocialAlarmSettings(updated);
                            localStorage.setItem('AG_SOCIAL_ALARM_SETTINGS_V2', JSON.stringify(updated));
                          }}
                          className="w-5 h-5 accent-rose-500 rounded cursor-pointer"
                        />
                      </div>
                    </div>

                  </div>
                </div>

                {/* 4. 하단 네비게이션 */}
                <div className="flex flex-wrap items-center justify-between gap-3 pt-2">
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => { setMainNavTab('WORKSPACE'); playSound('pop'); }}
                      style={{ fontSize: `${alarmSmallPx}px` }}
                      className="px-4 py-2 rounded-xl bg-space-800 hover:bg-space-700 text-slate-200 border border-slate-700 font-bold transition flex items-center gap-1.5">
                      <span>💬</span> 대화 워크스페이스
                    </button>
                    <button
                      onClick={() => { setMainNavTab('ANALYSIS'); playSound('pop'); }}
                      style={{ fontSize: `${alarmSmallPx}px` }}
                      className="px-4 py-2 rounded-xl bg-space-800 hover:bg-space-700 text-slate-200 border border-slate-700 font-bold transition flex items-center gap-1.5">
                      <span>📊</span> 5대 거장 분석 시스템
                    </button>
                    <button
                      onClick={() => { setMainNavTab('ACTION'); playSound('pop'); }}
                      style={{ fontSize: `${alarmSmallPx}px` }}
                      className="px-4 py-2 rounded-xl bg-space-800 hover:bg-space-700 text-slate-200 border border-slate-700 font-bold transition flex items-center gap-1.5">
                      <span>⚡</span> 행동연계 관제탑
                    </button>
                  </div>

                  <button
                    onClick={() => triggerBroadcastAllChannels('morning')}
                    style={{ fontSize: `${alarmSmallPx}px` }}
                    className="px-5 py-2.5 rounded-xl bg-gradient-to-r from-cyan-400 to-teal-400 hover:scale-105 transition text-black font-black shadow-lg flex items-center gap-2">
                    <span>🚀</span> 지금 즉시 5대 시스템 아침 지침 전송
                  </button>
                </div>

              </div>
            )}

          </main>

          {/* 🔔 소셜 알람 실시간 발송 완료 시뮬레이션 팝업 모달 */}
          {alarmSimulatedAlert && (
            <div className="fixed bottom-6 right-6 z-50 max-w-lg w-full p-4 animate-fade-in">
              <div className="glass-box-active rounded-3xl p-6 border-2 border-rose-400 bg-space-950/95 shadow-2xl shadow-rose-500/30 space-y-3">
                <div className="flex items-center justify-between border-b border-rose-500/30 pb-2">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🔔</span>
                    <strong className="text-rose-300 text-sm font-black">실시간 소셜 알람 발송 완료 브리핑</strong>
                  </div>
                  <button
                    onClick={() => setAlarmSimulatedAlert(null)}
                    className="w-6 h-6 rounded-full bg-space-800 text-slate-400 hover:text-white flex items-center justify-center text-xs font-bold">
                    ✕
                  </button>
                </div>
                <pre className="text-xs font-mono text-slate-200 whitespace-pre-wrap leading-relaxed max-h-72 overflow-y-auto bg-space-900/80 p-3.5 rounded-2xl border border-slate-800">
                  {alarmSimulatedAlert}
                </pre>
                <div className="flex items-center justify-between pt-1">
                  <span className="text-[11px] text-slate-400 font-mono">📡 Multi-Channel Gateway Connected</span>
                  <button
                    onClick={() => setAlarmSimulatedAlert(null)}
                    className="px-4 py-1.5 rounded-xl bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-400/50 text-xs font-bold">
                    확인 및 닫기
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 3-Minute Stamp Complete Modal */}
          {showStampPopup && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="glass-box-active rounded-3xl max-w-md w-full p-8 text-center border-2 border-cyan-400 shadow-2xl">
                <span className="text-4xl block mb-2">🎉</span>
                <h3 className="text-2xl font-black text-white mb-2">3분 미션 성공 완료!</h3>
                <button onClick={() => setShowStampPopup(false)} className="w-full py-3 bg-cyan-500 text-black font-bold rounded-xl mt-4">
                  확인
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
