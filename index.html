    const playSound = (type) => {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (type === 'pop') {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(600, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(900, ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'bell') {
          [659.25, 880, 1046.5, 1318.51].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.08);
            gain.gain.setValueAtTime(0.06, ctx.currentTime + i * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.08 + 0.35);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.08);
            osc.stop(ctx.currentTime + i * 0.08 + 0.35);
          });
        } else if (type === 'cheer') {
          [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.05);
            gain.gain.setValueAtTime(0.05, ctx.currentTime + i * 0.05);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.05 + 0.2);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + i * 0.05);
            osc.stop(ctx.currentTime + i * 0.05 + 0.2);
          });
        }
      } catch (e) {}

                <div className="glass-box rounded-3xl p-6 border border-slate-800 space-y-4">
                  <div className="flex items-center justify-between">
                    <span className="text-white font-black text-sm md:text-base flex items-center gap-2">
                      <span>⏰</span> 매일매일 정해진 시간 행동 유도 스케줄러 (Daily Action Triggers)
                    </span>
                    <span className="text-xs text-slate-400 font-mono">자동 발송 설정됨</span>
                  </div>

                  <div className="space-y-3">
                    
                    {/* 아침 07:00 */}
                    <div className="p-4 bg-space-950 rounded-2xl border-l-4 border-cyan-400 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                      <div className="space-y-1">
                        <div className="flex items-center gap-2">
                          <span className="text-cyan-300 font-bold text-xs md:text-sm">☀️ [모닝 착수] ({socialAlarmSettings.morningAlarmTime})</span>
                          <span className="text-[10px] px-2 py-0.2 rounded bg-cyan-500/20 text-cyan-300 font-mono">GTD Runway 지침</span>
                        </div>
                        <p className="text-xs text-slate-200 font-medium">
                          <strong>유도 메시지:</strong> "오늘 당장 3분 안에 할 1가지 행동: <strong>[{fiveMastersData.gtd.runway}]</strong>을 실행하세요!"
                        </p>
                      </div>
                      <button
                        onClick={() => triggerChannelActionAlarm('전체 연동 채널', 'morning')}
                        className="px-3 py-1.5 rounded-xl text-xs font-bold bg-cyan-500/20 text-cyan-300 border border-cyan-400 hover:bg-cyan-500/30 shrink-0">
                        🔔 모닝 지침 발송
                      </button>
                    </div>

                    {/* 낮 13:00 */}
                    <div className="p-4 bg-space-950 rounded-2xl border-l-4 border-gold-400 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                      <div className="space-y-1">
                        <div className="flex items-center gap-2">
                          <span className="text-gold-300 font-bold text-xs md:text-sm">🌤️ [미드데이 방어] ({socialAlarmSettings.middayAlarmTime})</span>
                          <span className="text-[10px] px-2 py-0.2 rounded bg-gold-500/20 text-gold-300 font-mono">Ray Dalio If-Then 방어</span>
                        </div>
                        <p className="text-xs text-slate-200 font-medium">
                          <strong>유도 메시지:</strong> "{fiveMastersData.dalio.ifThenRule}"
                        </p>
                      </div>
                      <button
                        onClick={() => triggerChannelActionAlarm('전체 연동 채널', 'midday')}
                        className="px-3 py-1.5 rounded-xl text-xs font-bold bg-gold-500/20 text-gold-300 border border-gold-400 hover:bg-gold-500/30 shrink-0">
                        🔔 미드데이 지침 발송
                      </button>
                    </div>

                    {/* 밤 22:00 */}
                    <div className="p-4 bg-space-950 rounded-2xl border-l-4 border-purple-400 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                      <div className="space-y-1">
                        <div className="flex items-center gap-2">
                          <span className="text-purple-300 font-bold text-xs md:text-sm">🌙 [나이트 결산 & 서약] ({socialAlarmSettings.nightAlarmTime})</span>
                          <span className="text-[10px] px-2 py-0.2 rounded bg-purple-500/20 text-purple-300 font-mono">Social Pledge</span>
                        </div>
                        <p className="text-xs text-slate-200 font-medium">
                          <strong>유도 메시지:</strong> "오늘 3분 미션을 완수하셨나요? 미완수 시 파트너 {socialAlarmSettings.partnerName}님에게 {socialAlarmSettings.penaltyPerMiss}원이 청구됩니다."
                        </p>
                      </div>
                      <button
                        onClick={() => triggerChannelActionAlarm('전체 연동 채널', 'night')}
                        className="px-3 py-1.5 rounded-xl text-xs font-bold bg-purple-500/20 text-purple-300 border border-purple-400 hover:bg-purple-500/30 shrink-0">
                        🔔 나이트 결산 발송
                      </button>
                    </div>

                  </div>
                </div>

                {/* 4. 파트너 상호 감시 계약 설정 */}
                <div className="glass-box rounded-3xl p-6 border border-slate-800 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-rose-300 font-bold text-sm flex items-center gap-1.5">
                      <span>🤝</span> 파트너 상호 감시 및 벌금 계약 (Social Contract)
                    </span>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                    <div className="p-3 bg-space-950 rounded-xl border border-slate-800">
                      <label className="text-slate-400 block font-bold mb-1">감시 파트너 이름:</label>
                      <input
                        type="text"
                        value={socialAlarmSettings.partnerName}
                        onChange={(e) => setSocialAlarmSettings({ ...socialAlarmSettings, partnerName: e.target.value })}
                        className="w-full bg-space-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-white font-bold focus:border-rose-400 focus:outline-none"
                      />
                    </div>
                    <div className="p-3 bg-space-950 rounded-xl border border-slate-800">
                      <label className="text-slate-400 block font-bold mb-1">미완수 1회당 벌금 (원):</label>
                      <input
                        type="text"
                        value={socialAlarmSettings.penaltyPerMiss}
                        onChange={(e) => setSocialAlarmSettings({ ...socialAlarmSettings, penaltyPerMiss: e.target.value })}
                        className="w-full bg-space-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-gold-300 font-bold focus:border-rose-400 focus:outline-none"
                      />
                    </div>
                  </div>
                </div>

              </div>
            )}

            {/* 🌟 1. [대화 워크스페이스] 탭 */}
            {mainNavTab === 'WORKSPACE' && (
              <div className="flex-1 p-6 text-center">
                <p className="text-white">대화 워크스페이스로 전환 중...</p>
              </div>
            )}

            {/* 🌟 2. [대화&답변 백업로그] 탭 */}
            {mainNavTab === 'BACKUP_LOGS' && (
              <div className="flex-1 p-6 overflow-y-auto space-y-2 max-w-5xl mx-auto">
                <h2 className="text-xl font-black text-teal-300 mb-3">📒 실시간 대화 & 답변 백업로그 볼트</h2>
                {qaBackupLogs.map((log, idx) => (
                  <div key={log.id} className="glass-box-active p-3 rounded-xl border border-slate-750">
                    <strong className="text-cyan-300 text-xs block mb-1">#{idx + 1} {log.question} ({log.time})</strong>
                    <p className="text-white text-xs leading-snug">{log.answer}</p>
                  </div>
                ))}
              </div>
            )}

            {/* 🌟 3. [5대 시스템종합] 탭 */}
            {mainNavTab === 'MATRIX' && (
              <div className="flex-1 p-6 overflow-y-auto max-w-6xl mx-auto">
                <h2 className="text-xl font-black text-white mb-4">📑 5대 시스템종합 데이터 아키텍처 매트릭스</h2>
                <div className="glass-box rounded-2xl p-4 border border-cyan-500/30">
                  <p className="text-slate-200 text-xs">5대 거장 시스템의 원리와 산출물이 체계적으로 매핑되어 있습니다.</p>
                </div>
              </div>
            )}

            {/* 🌟 4. [분석 시스템] 탭 */}
            {mainNavTab === 'ANALYSIS' && (
              <div className="flex-1 p-6 overflow-y-auto max-w-6xl mx-auto">
                <h2 className="text-xl font-black text-purple-300 mb-4">📊 5대 거장 분석 시스템</h2>
                <div className="glass-box rounded-2xl p-4 border border-purple-500/30">
                  <p className="text-slate-200 text-xs">5대 거장의 핵심 원리와 3대 기준, AI 행동 처방전을 확인하세요.</p>
                </div>
              </div>
            )}

            {/* 🌟 5. [행동연계] 탭 */}
            {mainNavTab === 'ACTION' && (
              <div className="flex-1 p-6 overflow-y-auto max-w-5xl mx-auto">
                <h2 className="text-xl font-black text-gold-300 mb-4">⚡ 5대 시스템 실전 행동연계 관제탑</h2>
                <div className="glass-box-active p-6 rounded-2xl border border-cyan-400">
                  <strong className="text-white block text-base mb-2">지상 3분 Runway 물리 액션</strong>
                  <p className="text-cyan-300 text-sm">"{fiveMastersData.gtd.runway}"</p>
                </div>
              </div>
            )}

          </main>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
